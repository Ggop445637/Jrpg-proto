    case "flag":
      return `<div class="grid2">${sceneField("Отметка", sceneTxt(i, "flag", st.flag, "например: bridge_open", "flagList"))}<div style="align-self:end">${sceneChk(i, "clear", st.clear, "снять, а не поставить")}</div></div>`;
    case "affinity":
      return `<div class="grid2">${sceneField("Чья", sceneSel(i, "member", st.member||"lira", [["lira", CompanionName], ["moth", MothName()]]))}${sceneField("Симпатия (минус — обида)", sceneNum(i, "delta", st.delta||0, 1))}</div>`;
    case "join":
      if (st.member === "moth") return `${sceneField("Кто", sceneSel(i, "member", "moth", [["lira", CompanionName], ["moth", MothName()]]))}<p class="hint">${esc(MothName())} вступает в отряд (как от собирателя гусениц за 50): летит следом, сражается пыльцой. Ставится отметка <code>moth_joined</code>.</p>`;
      return sceneField("Кто", sceneSel(i, "member", "lira", [["lira", CompanionName], ["moth", MothName()]])) + `<p class="hint">${CompanionName} встаёт в отряд: идёт за героем, сражается, заговаривает сама. Где она ждёт до этого — «Сцены» слева → «${CompanionName} до встречи».</p>`;
    case "fall":
      return `<div class="grid3">${sceneField("Куда (карта)", sceneSel(i, "map", st.map||firstMapId(), Object.keys(state.worldMaps).map(id=>[id, mapName(id)])))}${sceneField("X", sceneNum(i, "x", st.x||0))}${sceneField("Z", sceneNum(i, "z", st.z||0))}</div><p class="hint">Земля трескается под героем, он проваливается, затемнение — и падает сверху на этой карте с жёстким приземлением. Путь назад той же дорогой забывается («Назад» не ведёт наверх).</p>`;
    case "checkpoint":
      return `${sceneField("Подпись (для себя)", sceneTxt(i, "name", st.name, "например: перед механическим стражем"))}<p class="hint">Если отряд падёт — очнётся там, где стоит герой в этот момент (а не в городе). Как источник исцеления, только без лечения: поставьте перед боссом.</p>`;
    case "tip":
      return `${sceneField("Какая", sceneSel(i, "tip", st.tip||"", [["","— свой текст ниже"]].concat(Object.keys(DEFAULT_TIPS).map(id=>[id, `${DEFAULT_TIPS[id].title} (${DEFAULT_TIPS[id].where})`]))))}
        ${st.tip ? `<p class="hint">Текст — из раздела «Игра → Обучение».</p>` : `${sceneField("Заголовок", sceneTxt(i, "title", st.title, "Подсказка"))}<label class="field"><span>Текст ({имя} — имя героя)</span><textarea data-sf="${i}:text" rows="3">${esc(st.text||"")}</textarea></label>`}`;
    case "battle":
      return `${(st.monsters||[]).map((m,k)=>`<div class="lootrow" style="grid-template-columns:minmax(0,1fr) 80px auto"><select data-smon="${i}:${k}">${monsterTypes().map(([v,l])=>`<option value="${v}" ${m.type===v?"selected":""}>${esc(l)}</option>`).join("")}</select><input type="number" data-smlv="${i}:${k}" value="${m.level||0}" min="0" max="99" title="уровень (0 — как у героя)"><button class="btn small danger" data-smdel="${i}:${k}">✕</button></div>`).join("")}
        ${(st.monsters||[]).length < 4 ? `<button class="btn small" data-smadd="${i}">+ Монстр</button>` : ""}
        ${sceneChk(i, "tutorial", st.tutorial, "Обучающий бой: проиграть нельзя (здоровье не падает ниже 1)")}
        ${sceneField("Монстр сдаётся, когда здоровья осталось, % (0 — бьётся до конца)", sceneNum(i, "spare", st.spare||0, 5))}
        <p class="hint">Подсказки обучения появляются в любом бою, пока игрок их не видел (раздел «Игра → Обучение»). Сдавшийся монстр не погибает (и не делится), опыт — как за победу. Проигрыш обрывает сцену; победа или побег — сцена продолжается.</p>`;
    case "teleport":
      return `<div class="grid3">${sceneField("Карта", sceneSel(i, "map", st.map||firstMapId(), Object.keys(state.worldMaps).map(id=>[id, mapName(id)])))}${sceneField("X", sceneNum(i, "x", st.x||0))}${sceneField("Z", sceneNum(i, "z", st.z||0))}</div><p class="hint">Затемнение и переход; дальше сцена идёт уже там.</p>`;
    case "quest":
      return sceneField("Какое задание", sceneSel(i, "quest", st.quest||"", [["","— выберите"]].concat((state.quests||[]).map(q=>[q.id, q.name||q.id])))) + `<p class="hint">Игрок получает задание прямо в сцене (если ещё не брал и не выполнил).</p>`;
    // --- раунд 49 ---
    case "choice":
      return `<div class="grid2">${sceneField("Кто спрашивает", sceneSel(i, "who", st.who||"hero", speakerOptions(s)))}${sceneField("Эмоция", sceneSel(i, "emotion", st.emotion||"normal", EMOTIONS.map(([v,l])=>[v, (EMO_ICON[v]||"") + " " + l])))}</div>
        <label class="field"><span>Вопрос или реплика над ответами</span><textarea data-sf="${i}:text" rows="2">${esc(st.text||"")}</textarea></label>
        <div class="hint">Ответы игрока — каждый ведёт к своей метке («🔖 Метка» — шаг ниже); пусто — сцена просто идёт дальше</div>
        ${(st.options||[]).map((o,k)=>`<div class="lootrow" style="grid-template-columns:minmax(0,1fr) 160px auto"><input type="text" data-sopt="${i}:${k}" value="${esc(o.text||"")}" placeholder="текст ответа"><select data-sogo="${i}:${k}">${labelOptions(s).map(([v,l])=>`<option value="${esc(v)}" ${v===(o.goto||"")?"selected":""}>${esc(l)}</option>`).join("")}</select><button class="btn small danger" data-sodel="${i}:${k}">✕</button></div>`).join("")}
        <div style="display:flex;gap:6px;flex-wrap:wrap">${(st.options||[]).length < 6 ? `<button class="btn small" data-soadd="${i}">+ Ответ</button>` : ""}<button class="btn small" data-solabels="${i}" title="Добавить метки под каждый ответ и связать их">Сделать ветки для ответов</button></div>
        <p class="hint">Пример: «Налево» → 🔖 лес, «Направо» → 🔖 река. В конце каждой ветки поставьте «⏹ Закончить» или «↪ Перейти» к общему продолжению — иначе сцена пойдёт дальше вниз по порядку.</p>`;
    case "take":
      return `${sceneField("Золото", sceneNum(i, "gold", st.gold||0, 5))}${sceneItemsHtml(st, i)}<p class="hint">Забирается сколько есть (надетое снаряжение не снимается). Проверить, есть ли вещь, — шагом «Если…» перед этим.</p>`;
    case "heal":
      return `<p class="hint">Герой и ${esc(CompanionName)} полностью восстанавливают HP и SP (ночлег у костра, лекарь, святой источник).</p>`;
    case "sound":
      return sceneField("Звук", sceneSel(i, "sound", st.sound||"alert", SOUND_IDS)) + `<p class="hint">Свой звук — файл sounds/&lt;имя&gt;.ogg заменит встроенный.</p>`;
    case "fade":
      return `<div class="grid2">${sceneField("Что", sceneSel(i, "mode", st.mode||"out", [["out","🌑 В чёрное"],["in","🌕 Из чёрного"],["flash","⚡ Белая вспышка"]]))}${sceneField("Секунд", sceneNum(i, "time", st.time==null?0.8:st.time, 0.1))}</div>
        <p class="hint">Под затемнением удобно переставлять персонажей и менять время суток. Если забыть «Из чёрного» — экран откроется сам в конце сцены.</p>`;
    case "shake":
      return `<div class="grid2">${sceneField("Сила (0.1 — дрожь, 1 — землетрясение)", sceneNum(i, "power", st.power==null?0.5:st.power, 0.1))}${sceneField("Секунд", sceneNum(i, "time", st.time==null?0.6:st.time, 0.1))}</div>`;
    case "mech":
      return `<div class="grid2">${sceneField("Механизм", sceneSel(i, "mech", st.mech||"", mechOptions(s.area)))}${sceneField("Что сделать", sceneSel(i, "state", st.state||"open", [["open","открыть / отключить ловушку"],["close","закрыть / включить ловушку"],["reset","снова по рычагам и плитам"]]))}</div>
        <p class="hint">Дверь, решётка, мост, ловушка или рычаг. Так сцена сама открывает проход («ворота распахнулись») или запирает героя.</p>`;
    case "var":
      return `<div class="grid3">${sceneField("Счётчик (латиницей)", sceneTxt(i, "name", st.name, "например: helped", "varList"))}${sceneField("Действие", sceneSel(i, "op", st.op||"add", [["add","прибавить"],["set","сделать равным"]]))}${sceneField("Число", sceneNum(i, "value", st.value==null?1:st.value, 1))}</div>
        <p class="hint">Счётчик — число в сюжете: сколько раз помог, сколько собрал. Проверяется в «Если…» и в условиях ответов. Минус — отнять.</p>`;
    case "label":
      return sceneField("Имя метки", `<input type="text" data-slabel="${i}" value="${esc(st.name||"")}" placeholder="например: лес">`) + `<p class="hint">Сюда прыгают «Если…», «Перейти» и ответы на вопрос. Переименуете — ссылки поправятся сами.</p>`;
    case "if":
      return sceneCondHtml(i, st) + `<div class="grid2">${sceneField("Если ДА — перейти к", sceneSel(i, "goto", st.goto||"", labelOptions(s)))}${sceneField("Если НЕТ — перейти к", sceneSel(i, "elseGoto", st.elseGoto||"", labelOptions(s)))}</div>
        <p class="hint">Все заполненные условия должны выполниться одновременно. Пустые — не проверяются.</p>`;
    case "goto":
      return sceneField("К метке", sceneSel(i, "label", st.label||"", [["","— выберите"]].concat(sceneLabels(s).map(l=>[l, "🔖 " + l])))) + `<p class="hint">Можно и назад — например, повторять вопрос, пока игрок не ответит правильно.</p>`;
    case "end":
      return `<p class="hint">Сцена заканчивается здесь — шаги ниже не играют (удобно в конце ветки).</p>`;
    case "blacktext": {
      const last = !["blacktext","name"].includes((s.steps[i+1]||{}).type);
      return `<label class="field"><span>Текст (новая строка — новая строка на экране, пустая строка — следующая страница; {имя} — имя героя)</span><textarea data-sf="${i}:text" rows="4" placeholder="Темно…&#10;И тихо.">${esc(st.text||"")}</textarea></label>
        <div class="grid2">${sceneField("Фон", sceneSel(i, "bg", st.bg||"dream", BLACK_BGS))}${sceneField("Вид текста", sceneSel(i, "style", st.style||"thought", BLACK_STYLES))}</div>
        <div class="grid3">${sceneField("Скорость печати", sceneSel(i, "speed", st.speed==null?"34":String(st.speed), speedOptions(st.speed, 34)))}${sceneField("Сама дальше через, с (0 — ждать Enter)", sceneNum(i, "hold", st.hold||0, 0.5))}${last ? sceneField("Потом мир проступает, с", sceneNum(i, "reveal", st.reveal==null?3.5:st.reveal, 0.5)) : "<span class='hint'>дальше — снова на этом фоне</span>"}</div>
        <p class="hint">Экран чёрный, строки проявляются по одной, буквы «проступают». Несколько таких шагов подряд (и «Имя героя») идут на одном чёрном экране; после последнего чёрное плавно растворяется и сцена продолжается как обычно. Если сцена — вступление (Игра → Начало игры), мир не мелькнёт: игра сразу начнёт с чёрного.</p>`;
    }
    case "name": {
      const last = !["blacktext","name"].includes((s.steps[i+1]||{}).type);
      return `<div class="grid3">${sceneField("Вопрос над полем", sceneTxt(i, "prompt", st.prompt, "Как тебя зовут?"))}${sceneField("Фон", sceneSel(i, "bg", st.bg||"dream", BLACK_BGS))}${last ? sceneField("Потом мир проступает, с", sceneNum(i, "reveal", st.reveal==null?3.5:st.reveal, 0.5)) : "<span class='hint'>дальше — снова на этом фоне</span>"}</div>
        <p class="hint">Игрок печатает имя (до 14 букв), Enter — готово. Сначала в поле имя из «Начала игры». Дальше в любых текстах {имя} заменится на введённое, имя пишется в сохранение.</p>`;
    }
    case "pose":
      return `<div class="grid2">${sceneField("Кто", sceneSel(i, "actor", st.actor||"hero", sceneActors(s).filter(o=>!o.group && ["hero","lira"].includes(o[0]))))}${sceneField("Что", sceneSel(i, "pose", st.pose||"lie", [["lie","ложится / лежит"],["stand","встаёт"]]))}</div>
        <p class="hint">Для пробуждения: «Лечь» ПЕРВЫМ шагом сцены (пока экран ещё чёрный), потом «Встать». Свой рисунок лежащего — <code>sprites/player/world/lie.png</code> (Лира — companion/world/lie.png), без него фигура просто ложится.</p>`;
  }
  return "";
}

function renderScene(){
  const s = sceneObj();
  if (!s){ closeModal(); return; }
  const root = document.getElementById("modalRoot");
  const playing = !!(sceneEd.play);
  let steps = "";
  s.steps.forEach((st, i)=>{
    const forced = STEP_ALWAYS_WAIT.includes(st.type);
    steps += `<div class="node ${sceneEd.focus===i?"start":""} ${["label","if","goto","end","choice"].includes(st.type)?"flow":""}" id="scstep-${i}" data-sfocus="${i}">
      <div class="node-head">
        <span class="pill">${i+1}</span>
        <select data-stype="${i}">${stepTypeOptions(st.type)}</select>
        ${forced ? `<span class="hint">ждёт окончания</span>` : `<label class="check" title="Снята — следующий шаг ждёт, пока этот закончится. Отмечена — следующий шаг начнётся сразу, и они пойдут одновременно (например, Лира идёт, пока говорит герой)."><input type="checkbox" data-spar="${i}" ${st.wait===false?"checked":""}><span>⇉ одновременно со следующим</span></label>`}
        <span class="grow" style="flex:1"></span>
        <button class="btn small" data-sup="${i}" title="выше">↑</button><button class="btn small" data-sdown="${i}" title="ниже">↓</button>
        <button class="btn small" data-sdup="${i}" title="копия">⧉</button><button class="btn small danger" data-sdel="${i}" title="удалить">✕</button>
      </div>
      ${stepFields(st, i, s)}
      ${STEP_HELP[st.type] ? `<details class="shelp" data-keep="shelp_${st.type}" ${ui.secs["shelp_" + st.type] ? "open" : ""}><summary>❔ Как это работает</summary><div>${esc(STEP_HELP[st.type])}</div></details>` : ""}
      <div style="margin-top:6px"><select data-sadd="${i}"><option value="">+ шаг после этого…</option>${stepTypeOptions("")}</select></div>
    </div>${!forced && st.wait===false && i < s.steps.length-1 ? `<div class="sc-par">⇣ одновременно — следующий шаг начнётся сразу</div>` : ""}`;
  });
  if (!s.steps.length) steps = `<p class="hint">Пока ни одного шага.</p><select data-sadd="-1"><option value="">+ первый шаг…</option>${stepTypeOptions("")}</select>`;
  let figs = (s.figures||[]).map((f,k)=>`<div class="card"><div class="lootrow" style="grid-template-columns:minmax(0,1fr) 60px auto"><input type="text" data-fname="${k}" value="${esc(f.name||"")}" placeholder="имя"><input type="color" data-fcolor="${k}" value="${validHex(f.color,"#9a8a70")}"><button class="btn small danger" data-fdel="${k}">✕</button></div>
    <label class="field"><span>Кто это</span><select data-fmon="${k}"><option value="">человек (картинка sprites/npc/${esc(f.sprite||f.id)})</option>${monsterTypes().map(([v,l])=>`<option value="${v}" ${f.monster===v?"selected":""}>монстр: ${esc(l)}</option>`).join("")}</select></label>
    <div class="hint">id: <code>${esc(f.id)}</code> · портреты: sprites/portraits/${esc(f.id)}/… · место: ${round2(f.x||0)}, ${round2(f.z||0)} ${pickBtn(-1-k, "fig", "указать")}</div>
    <label class="check"><input type="checkbox" data-fvis="${k}" ${f.visible!==false?"checked":""}><span>видна с начала сцены (иначе — шагом «Появиться»)</span></label></div>`).join("");
  root.innerHTML = `<div class="modal" id="scModal">
    <div class="modal-box" role="dialog" aria-label="Сцена">
      <div class="modal-head">
        <div style="width:30px;height:30px;flex:0 0 auto;display:flex;color:#4d86e8">${glyph("scene")}</div>
        <div><input class="title" id="scName" value="${esc(s.name||"")}" style="font-size:20px;font-weight:700;border:0;background:transparent;"><div class="hint">${esc((SCENE_TRIGGERS.find(t=>t[0]===s.trigger)||["",""])[1])} · ${esc(areaLabel(s.area))}</div></div>
        <span class="grow"></span>
        <button class="btn primary" id="scClose">Готово (Esc)</button>
      </div>
      <div class="modal-body">
        <div class="dlg" style="grid-template-columns:minmax(0,1fr) minmax(420px, 46%);">
          <div id="scSteps">${SCENE_GUIDE.replace('<details class="guide">', `<details class="guide" data-keep="scene_guide" ${ui.secs.scene_guide ? "open" : ""}>`)}${steps}</div>
          <div class="preview" style="position:sticky;top:0;max-height:calc(100vh - 130px);overflow-y:auto">
            <div class="pv-top"><span>Место сцены · колесо — масштаб, тянуть — двигать</span><span style="display:flex;gap:4px"><button class="btn small" id="scFit" title="показать всех участников">По сцене</button><button class="btn small" id="scZoomIn" title="ближе">＋</button><button class="btn small" id="scZoomOut" title="дальше">－</button></span></div>
            <div style="display:flex;gap:6px;align-items:center;margin:0 10px 8px;flex-wrap:wrap"><select id="scAddMove" style="color:#2a2433;background:#f3efe5;flex:0 0 auto;max-width:220px"><option value="">+ Движение: кто идёт?</option>${sceneActors(s).map(o=> o.group ? `<optgroup label="${esc(o.group)}">${o.items.map(([v,l])=>`<option value="${esc(v)}">${esc(l)}</option>`).join("")}</optgroup>` : `<option value="${esc(o[0])}">${esc(o[1])}</option>`).join("")}</select><span class="hint" id="scMapHint" style="flex:1;min-width:180px;color:#cfc8de">${esc(sceneMapHint(s))}</span></div>
            <div id="scMap" style="margin:0 10px">${sceneMapSvg(s, playing ? sceneEd.play.t : null)}</div>
            <div style="display:flex;gap:6px;margin:8px 0;flex-wrap:wrap">
              <button class="btn ${playing?"":"primary"}" id="scPlay">${playing ? "■ Стоп" : "▶ Проверить сцену"}</button>
              ${s.startAt && Object.keys(s.startAt).length ? `<button class="btn" id="scStartReset" title="герой — где сработала сцена, ${esc(CompanionName)} — рядом с ним, жители — на своих местах">Сбросить начальные места (${Object.keys(s.startAt).length})</button>` : ""}
            </div>
            <div id="scLine" class="pv-box" style="min-height:120px">${playing ? "" : `<span class="hint">Нажмите «Проверить» — фигурки пойдут по мини-карте, реплики появятся здесь.</span>`}</div>
            <div class="hint" style="margin-top:12px">Фигуры сцены — персонажи, которых нет среди жителей (гонец, враг, призрак). Живут только в этой сцене.</div>
            ${figs}
            <button class="btn small" id="scFigAdd">+ Фигура</button>
          </div>
        </div>
      </div>
    </div></div>`;
  bindScene(root, s);
  decorateTips(root);
  // раскрытые схема и пояснения не сворачиваются при перерисовке
  root.querySelectorAll("details[data-keep]").forEach(d=> d.addEventListener("toggle", ()=>{ ui.secs[d.dataset.keep] = d.open; saveUi(); }));
  if (playing) scenePaint(s);
}

function bindScene(root, s){
  const parse = (v)=> v.split(":").map(Number);
  const step = (v)=> s.steps[parse(v)[0]];
  const structural = ()=>{ commit(); renderScene(); renderOutliner(); renderCanvas(); };
  root.querySelector("#scClose").onclick = closeModal;
  root.querySelector("#scName").addEventListener("input", e=>{ s.name = e.target.value; });
  root.querySelector("#scName").addEventListener("change", ()=>{ commit(); render(); });
  root.querySelector("#scModal").addEventListener("pointerdown", ev=>{ if (ev.target.id === "scModal") closeModal(); });
  root.querySelectorAll("[data-ss]").forEach(el=> el.onchange = ()=>{ const [i] = parse(el.dataset.ss); const f = el.dataset.ss.split(":")[1]; s.steps[i][f] = f === "speed" ? Number(el.value) : el.value; structural(); });
  root.querySelectorAll("[data-sn]").forEach(el=>{
    el.addEventListener("input", ()=>{ const [i] = parse(el.dataset.sn); const f = el.dataset.sn.split(":")[1]; const x = parseFloat(el.value); if (!isNaN(x)){ s.steps[i][f] = x; const m = root.querySelector("#scMap"); if (m) m.innerHTML = sceneMapSvg(s, null); } });
    el.addEventListener("change", structural);
  });
  root.querySelectorAll("[data-sf]").forEach(el=>{
    const numLike = ["relMin","relMax"];
    el.addEventListener("input", ()=>{ const [i] = parse(el.dataset.sf); const f = el.dataset.sf.split(":")[1]; if (!numLike.includes(f)) s.steps[i][f] = el.value; });
    el.addEventListener("change", ()=>{
      const [i] = parse(el.dataset.sf); const f = el.dataset.sf.split(":")[1];
      if (numLike.includes(f)){ const v = String(el.value).trim().replace(",", "."); s.steps[i][f] = v === "" ? null : clamp(Math.round(Number(v))||0, -100, 100); }

// ---------- проверка ▶ ----------
function scenePlay(){
  sceneEd.play = {t:0, last:performance.now(), raf:0};
  const tick = (now)=>{
    if (!sceneEd || !sceneEd.play) return;
    const s = sceneObj(); if (!s){ sceneStop(); return; }
    const dt = Math.min((now - sceneEd.play.last)/1000, 0.1);
    sceneEd.play.last = now;
    sceneEd.play.t += dt;
    scenePaint(s);
    const tl = sceneTimeline(s);
    if (sceneEd.play.t > tl.total + 1.2){ sceneStop(); renderScene(); return; }
    sceneEd.play.raf = requestAnimationFrame(tick);
  };
  sceneEd.play.raf = requestAnimationFrame(tick);
}
function sceneStop(){ if (sceneEd && sceneEd.play){ cancelAnimationFrame(sceneEd.play.raf); sceneEd.play = null; } }
function scenePaint(s){
  const T = sceneEd.play.t;
  const m = document.getElementById("scMap"); if (m) m.innerHTML = sceneMapSvg(s, T);
  const tl = sceneTimeline(s);
  // какой шаг сейчас
  let cur = -1; tl.spans.forEach((sp, i)=>{ if (T >= sp.t0 && T < Math.max(sp.t1, sp.t0+0.05)) cur = i; });
  document.querySelectorAll("#scSteps .node").forEach(n=> n.classList.toggle("live", n.id === "scstep-"+cur));
  // реплика и портреты (как в игре: говорящий ярче, второй приглушён)
  const line = tl.says.find(x=> T >= x.t0 && T < x.t1);
  const el = document.getElementById("scLine"); if (!el) return;
  if (!line){ el.innerHTML = T > tl.total ? `<span class="hint">Сцена закончилась.</span>` : `<span class="hint">…</span>`; return; }
  const st = line.st;
  const who = st.who || "narrator";
  const side = st.side==="left" || st.side==="right" ? st.side : (who==="hero" ? "left" : "right");
  // кто был на другой стороне
  let other = null;
  tl.says.forEach(x=>{ if (x.t0 < line.t0 && x.st.who && x.st.who!=="narrator" && x.st.who!==who){ const sd = x.st.side==="left"||x.st.side==="right" ? x.st.side : (x.st.who==="hero"?"left":"right"); if (sd !== side) other = x.st; } });
  const face = (w, emo, active)=> w && w!=="narrator" ? `<div style="text-align:center;opacity:${active?1:0.45};transform:scale(${active?1:0.9})"><div style="width:64px;height:64px;border-radius:50%;background:${actorColor(s,w)};display:flex;align-items:center;justify-content:center;font-size:30px;margin:auto">${EMO_ICON[emo]||"🙂"}</div><div class="hint">${esc(actorName(s,w))}</div></div>` : `<div style="width:64px"></div>`;
  const shown = String(st.text||"").slice(0, Math.floor((T - line.t0) * 45));
  const left = side==="left" ? face(who, st.emotion, true) : (other ? face(other.who, other.emotion, false) : face(null));
  const right = side==="right" ? face(who, st.emotion, true) : (other ? face(other.who, other.emotion, false) : face(null));
  el.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:6px">${left}${right}</div>
    ${who!=="narrator" ? `<span class="pv-name">${esc(st.name || actorName(s, who))}</span>` : ""}<div style="white-space:pre-wrap">${esc(shown)}</div>`;
}

let toastTimer = null;
function toast(text, actionLabel, action){
  const el = document.getElementById("toast");
  el.hidden = false;
  el.innerHTML = `<span>${esc(text)}</span>${actionLabel ? `<button id="toastAct">${esc(actionLabel)}</button>` : ""}`;
  if (actionLabel) el.querySelector("#toastAct").onclick = ()=>{ el.hidden = true; action(); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.hidden = true; }, actionLabel ? 6000 : 3500);
}

   Chrome/Edge: File System Access API — один раз выбрать world_data.json,
   дальше «Сохранить в игру» пишет прямо в него (ссылка на файл хранится в

   Иначе — обычное скачивание. */
let fileHandle = null;
const hasFS = typeof window.showSaveFilePicker === "function" && window.self === window.top;
function idb(){
  if (idb._p) return idb._p;
  return idb._p = new Promise((res, rej)=>{
    const r = indexedDB.open("mapwright", 2);
    r.onupgradeneeded = ()=>{ const db = r.result; ["handles", "work"].forEach(n=>{ if (!db.objectStoreNames.contains(n)) db.createObjectStore(n); }); };
    r.onsuccess = ()=> res(r.result);
    r.onerror = ()=>{ idb._p = null; rej(r.error); };
  });
}
async function idbSet(key, val){ try{ const db = await idb(); await new Promise(r=>{ const tx = db.transaction("handles","readwrite"); val==null ? tx.objectStore("handles").delete(key) : tx.objectStore("handles").put(val, key); tx.oncomplete = r; tx.onerror = r; }); }catch(e){} }
async function idbGet(key){ try{ const db = await idb(); return await new Promise(r=>{ const q = db.transaction("handles").objectStore("handles").get(key); q.onsuccess = ()=> r(q.result||null); q.onerror = ()=> r(null); }); }catch(e){ return null; } }

function stateText(){ return JSON.stringify(state, null, 2); }
function markSaved(){ commit(); lsSet(LS_SAVED, baseline === _dirtyB ? _dirtyH : hashStr(baseline)); renderTopbar(); }

let downloadsApi = null;
(async ()=>{ if (!window.claude?.use) return; try{ downloadsApi = await window.claude.use("downloads"); }catch(e){} })();
async function downloadText(filename, text){
  if (downloadsApi){
    try{ await downloadsApi.save({filename, data:text}); return true; }catch(e){ if (e && e.code === "declined") return false; }
  }
  try{
    const url = URL.createObjectURL(new Blob([text], {type:"application/json"}));
    const a = document.createElement("a"); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    return true;
  }catch(e){ return false; }
}
async function saveToGame(chooseNew){
  commit();
  maybeBackup(JSON.stringify(state), true);
  _probCache = null;
  const errs = getProblems().filter(p=>p.level==="error").length;
  if (hasFS){

      if (!fileHandle || chooseNew){
        fileHandle = await window.showSaveFilePicker({suggestedName:"world_data.json", types:[{description:"Мир игры (JSON)", accept:{"application/json":[".json"]}}]});
        await idbSet("world", fileHandle);
      }
      let perm = await fileHandle.queryPermission({mode:"readwrite"});
      if (perm !== "granted") perm = await fileHandle.requestPermission({mode:"readwrite"});
      if (perm !== "granted"){ toast("Браузер не дал записать файл — попробуйте ещё раз"); return; }
      const w = await fileHandle.createWritable();
      await w.write(stateText());
      await w.close();
      markSaved();
      toast(`Записано в ${fileHandle.name}. Перезапустите игру${errs ? ` · ошибок в мире: ${errs}` : ""}`);

// Подмешать кусок мира (тот же формат): новые карты и объекты с новыми id; то,
// что уже есть (тот же id), не трогается. Игра делает то же с world/addons/*.json.
function mergeState(add, sourceLabel){
  if (!add || typeof add !== "object") throw new Error("это не файл Mapwright");
  let n = 0;
  Object.keys(add.worldMaps||{}).forEach(k=>{ if (!state.worldMaps[k]){ state.worldMaps[k] = add.worldMaps[k]; n++; } });
  // раунд 91: список своих моделей из Студии (models/models_for_mapwright.json) — заменяет прежний
  if (Array.isArray(add.customModels)){ state.customModels = add.customModels; n += add.customModels.length; }
  ["houses","containers","props","paths","battles","npcs","mechs","keys","towns","caterpillars"].forEach(key=>{
    state[key] = Array.isArray(state[key]) ? state[key] : [];
    const ids = new Set(state[key].map(o=>o.id));
    (add[key]||[]).forEach(o=>{ if (!ids.has(o.id)){ state[key].push(o); n++; } });
  });
  repairState();
  commit();
  render();
  toast(n ? `Добавлено из «${sourceLabel}»: ${n} ${plural(n,"объект","объекта","объектов")}` : `В «${sourceLabel}» нет ничего нового — всё уже есть`, n ? "Отменить" : null, n ? undo : null);
}
function loadState(data, sourceLabel){
  if (!data || typeof data !== "object" || !data.worldMaps) throw new Error("в файле нет карт мира — это не файл Mapwright");
  state = data;
  repairState();
  ui.sel = null; ui.pick = null; ui.nav = []; ui.views = {};
  ui.ctx = {kind:"map", id:firstMapId()};
  commit();
  render();
  toast(`Загружено: ${sourceLabel}`, "Отменить", undo);
}
async function openFromGame(){
  if (isGameDirty() && !confirm("В редакторе есть изменения, которых нет в игре. Загрузить файл вместо них? (Отменить можно через Ctrl+Z)")) return;
  if (hasFS && typeof window.showOpenFilePicker === "function"){
    try{
      const [h] = await window.showOpenFilePicker({types:[{description:"Мир игры (JSON)", accept:{"application/json":[".json"]}}]});
      const text = await (await h.getFile()).text();
      loadState(JSON.parse(text), h.name);
      if (h.name === "world_data.json"){ fileHandle = h; await idbSet("world", h); markSaved(); }
      return;
    }catch(e){
      if (e && e.name === "AbortError") return;
      if (e instanceof SyntaxError || (e && /Mapwright/.test(e.message))){ toast("Не удалось прочитать: " + e.message); return; }
    }
  }
  pendingFileMode = "open";
  document.getElementById("fileInput").click();
}
let pendingFileMode = "open";
document.getElementById("fileInput").addEventListener("change", e=>{
  const file = e.target.files[0]; e.target.value = "";
  if (!file) return;
  file.text().then(text=>{
    try{
      if (pendingFileMode==="merge"){ mergeState(JSON.parse(text), file.name); return; }
      loadState(JSON.parse(text), file.name); if (pendingFileMode==="open" && file.name==="world_data.json") markSaved();
    }
    catch(err){ toast("Не удалось прочитать файл: " + err.message); }
  });
});

function openPalette(){
  const all = paletteEntries();
  let sel = 0, list = all;
  const root = document.getElementById("modalRoot");
  root.innerHTML = `<div class="modal" id="palModal" style="align-items:flex-start;padding-top:10vh"><div class="modal-box narrow" role="dialog" aria-label="Быстрый переход" style="max-width:640px">
    <div style="padding:12px"><input class="search" id="palQ" placeholder="Что найти или сделать? Например: сундук, Лира, зелье, новая сцена…" autocomplete="off" style="font-size:15px;padding:10px 12px"></div>
    <div id="palList" style="max-height:60vh;overflow:auto;padding:0 8px 10px"></div></div></div>`;
  const q = root.querySelector("#palQ"), box = root.querySelector("#palList");
  const close = ()=>{ root.innerHTML = ""; };
  const norm = (s)=> String(s||"").toLowerCase().replace(/ё/g, "е");
  const draw = ()=>{
    box.innerHTML = list.slice(0, 60).map((e, i)=>`<div class="row ${i===sel?"sel":""}" data-pi="${i}" style="display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer">${e.g||""}<span class="lbl" style="flex:1 1 auto">${esc(e.label)}</span><span class="hint">${esc(e.meta||"")}</span><span class="pill">${esc(e.kind)}</span></div>`).join("") || `<p class="hint" style="padding:8px">Ничего не найдено</p>`;
    box.querySelectorAll("[data-pi]").forEach(r=>{ r.onclick = ()=> run(Number(r.dataset.pi)); r.onmousemove = ()=>{ if (sel !== Number(r.dataset.pi)){ sel = Number(r.dataset.pi); draw(); } }; });
    const cur = box.querySelector(".row.sel"); if (cur) cur.scrollIntoView({block:"nearest"});
  };
  const run = (i)=>{ const e = list[i]; if (!e) return; close(); e.run(); };
  const filter = ()=>{
    const words = norm(q.value).split(/\s+/).filter(Boolean);
    list = !words.length ? all : all.filter(e=>{ const t = norm(e.label + " " + e.meta + " " + e.kind); return words.every(w=>t.includes(w)); })
      .sort((a, b)=> (norm(a.label).startsWith(words[0]) ? 0 : 1) - (norm(b.label).startsWith(words[0]) ? 0 : 1));
    sel = 0; draw();
  };
  q.addEventListener("input", filter);
  q.addEventListener("keydown", ev=>{
    if (ev.key === "ArrowDown"){ ev.preventDefault(); sel = Math.min(sel + 1, Math.min(list.length, 60) - 1); draw(); }
    else if (ev.key === "ArrowUp"){ ev.preventDefault(); sel = Math.max(sel - 1, 0); draw(); }
    else if (ev.key === "Enter"){ ev.preventDefault(); run(sel); }
    else if (ev.key === "Escape"){ ev.preventDefault(); ev.stopPropagation(); close(); }
  });
  root.querySelector("#palModal").addEventListener("pointerdown", ev=>{ if (ev.target.id === "palModal") close(); });
  draw();
  q.focus();
}

function monsterTypes(){
  return allMonsterIds().map(id=>{
    const d = monsterDef(id);
    const tag = d.boss ? "★ БОСС: " : "";
    const tail = d.minion ? " (помощник)" : "";
    return [id, tag + (d.name||id) + tail];
  });
}
function wildMonsterTypes(){ return monsterTypes().filter(m=>!isBossType(m[0])); }
function attackOptions(cur){
  const groups = ATTACK_KINDS.map(([k, l])=>({group:l, items: allAttackIds().filter(id=>(attackDef(id).kind||"hit")===k).map(id=>[id, attackName(id)]).sort((a,b)=>a[1].localeCompare(b[1], "ru"))}));
  if (cur && !attackDef(cur)) groups.unshift({group:"Нет такой", items:[[cur, `${cur} (удалена?)`]]});
  return groups;
}
function statusName(id){ const s = GAME_STATUSES.find(x=>x[0]===id); return s ? s[1] : id; }
function elementName(id){ const e = GAME_ELEMENTS.find(x=>x[0]===id); return e ? e[1] : id; }
function materialOptions(cur){
  const mats = itemCatalog().filter(i=>i.category==="material");
  const out = [{group:"Сырьё", items: mats.map(i=>[i.id, i.name])}, {group:"Расходники", items: itemCatalog().filter(i=>i.category==="consumable").map(i=>[i.id, i.name])}];
  if (cur && !itemCatalog().some(i=>i.id===cur)) out.unshift({group:"Нет такого", items:[[cur, cur]]});
  return out;
}
function usesOfAttack(aid){
  return allMonsterIds().filter(id=>{
    const d = monsterDef(id);
    const pools = [d.pool||[], d.airPool||[], (d.phase2||{}).pool||[]];
    return pools.some(p=>p.some(e=>e.t===aid)) || d.opener===aid;
  });
}
function whereMonsterLives(id){
  const out = [];
  Object.values(state.worldMaps).forEach(m=>{ if ((m.monsters||[]).includes(id)) out.push(`карта «${m.name||m.id}»`); });
  allFloors().forEach(({house, floor})=>{ if ((floor.monsters||[]).includes(id)) out.push(`«${house.name} › ${floor.name}»`); });
  (state.battles||[]).forEach(b=>{ if ((b.monsters||[]).some(x=>x.type===id)) out.push(`бой «${b.name||b.id}»`); });
  return out;
}

// --- схема клеток: 0 — клетка героя (внизу), +1 — слева (A), −1 — справа (D), 2 — напротив ---
function normOff(v, n){ let x = ((v % n) + n) % n; if (x > n/2) x -= n; return x; }
function offLabel(o, n){
  if (n === 4) return {0:"клетка героя", 1:"слева (A)", "-1":"справа (D)", 2:"напротив"}[normOff(o, 4)];
  const x = normOff(o, n);
  return x === 0 ? "клетка героя" : (x > 0 ? `${x} влево` : `${-x} вправо`);
}
let ringHandlers = {};
function ringSvg(n, marks, opt={}){
  // marks: {offset: "danger"|"fake"|"safe"|"hero"...}; opt.key — кликабельная схема
  const size = opt.size || 150, c = size/2, R = size*0.34, cr = n===4 ? size*0.13 : size*0.095;
  const hh = size + (opt.labels ? 16 : 0);
  let g = `<svg viewBox="0 0 ${size} ${hh}" width="${size}" height="${hh}" class="ringsvg">`;
  g += `<circle cx="${c}" cy="${c}" r="${R}" fill="none" stroke="currentColor" stroke-opacity=".18" stroke-width="2"/>`;
  g += `<circle cx="${c}" cy="${c}" r="${size*0.11}" fill="${opt.monColor||"#8a4a4a"}" opacity=".85"/><text x="${c}" y="${c+3}" text-anchor="middle" font-size="${Math.max(7, size*0.05).toFixed(1)}" fill="#fff" opacity=".85">монстр</text>`;
  for (let k=0; k<n; k++){
    const off = normOff(k, n);
    const ang = Math.PI/2 + off * (2*Math.PI/n);
    const x = c + Math.cos(ang)*R, y = c + Math.sin(ang)*R;
    const m = marks[off] || "";
    const fill = {danger:"#e0443a", fake:"#f2d27a", vuln:"#f5c542", pool:"#6aa84f", fire:"#f07a2a", both:"#e0443a", charge:"#fff0c8"}[m] || (opt.dark ? "#2e3340" : "var(--panel-3, #3a3f4a)");
    const stroke = m==="both" ? "#f2d27a" : "rgba(0,0,0,.35)";
    g += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${cr}" fill="${fill}" stroke="${stroke}" stroke-width="${m==="both"?3:1.2}" ${opt.key?`data-ring="${opt.key}:${off}" style="cursor:pointer"`:""}/>`;
    if (off === (opt.hero==null ? 0 : opt.hero)) g += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${cr*0.42}" fill="#35c7e6" stroke="#fff" stroke-width="1.5" pointer-events="none"/>`;
    if (opt.labels && n === 4) g += `<text x="${x.toFixed(1)}" y="${(y + cr + 11).toFixed(1)}" text-anchor="middle" font-size="9.5" fill="currentColor" opacity=".7" pointer-events="none">${{0:"герой",1:"A",2:"напротив","-1":"D"}[off]}</text>`;
  }
  if (opt.arrow){ // стрелка рывка
    const a0 = Math.PI/2, a1 = Math.PI/2 + opt.arrow * (2*Math.PI/n);
    const p = (a)=> [c + Math.cos(a)*(R+cr+6), c + Math.sin(a)*(R+cr+6)];
    const [x0,y0] = p(a0), [x1,y1] = p(a1);
    g += `<path d="M${x0.toFixed(1)} ${y0.toFixed(1)} A ${R+cr+6} ${R+cr+6} 0 0 ${opt.arrow>0?1:0} ${x1.toFixed(1)} ${y1.toFixed(1)}" fill="none" stroke="#35c7e6" stroke-width="2.5" marker-end="url(#mwArrow)"/>`;
    g += `<defs><marker id="mwArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#35c7e6"/></marker></defs>`;
  }
  return g + `</svg>`;
}
// кликабельная схема: get() — массив смещений, set(arr)
function ringPicker(key, n, get, set, kind="danger", extra={}){
  ringHandlers[key] = {n, get, set};
  const marks = {};
  (extra.under||[]).forEach(o=> marks[normOff(o, n)] = "fake");
  (get()||[]).forEach(o=>{ const v = normOff(o, n); marks[v] = marks[v]==="fake" && kind==="danger" ? "both" : kind; });
  return `<div class="ringpick">${ringSvg(n, marks, {key, labels:true, size: n===4 ? 150 : 170, monColor: extra.monColor})}</div>`;
}
function bindRings(root){
  root.querySelectorAll("[data-ring]").forEach(el=> el.addEventListener("click", ()=>{
    const [key, off] = el.dataset.ring.split(/:(?=-?\d+$)/);
    const h = ringHandlers[key]; if (!h) return;
    const o = Number(off);
    let arr = (h.get()||[]).map(v=>normOff(Number(v), h.n));
    if (arr.includes(o)) arr = arr.filter(v=>v!==o); else arr.push(o);
    arr.sort((a,b)=>Math.abs(a)-Math.abs(b) || b-a);
    h.set(arr);
    commit(); renderMon();
  }));
}

// --- описание атаки простыми словами ---
function cellsText(cells, n=4){
  if (!cells || !cells.length) return "ни одной клетки";
  return cells.map(o=>offLabel(o, n)).join(", ");
}
function infText(list){ return (list||[]).map(([s, ch])=>`${statusName(s).toLowerCase()} ${Math.round(ch*100)}%`).join(", "); }
function atkSummary(a){
  if (!a) return "";
  const k = a.kind || "hit";
  const parts = [];
  const dmg = ()=>{ const p = []; if (a.mult != null && a.mult !== 1) p.push(`урон ×${a.mult}`); if (a.element) p.push(elementName(a.element).toLowerCase()); if (a.inflict && a.inflict.length) p.push("эффекты: " + infText(a.inflict)); return p.join(", "); };
  if (k === "hit"){
    if (a.area === "all") parts.push("Бьёт по всей арене.");
    else if (a.area === "all_but") parts.push(`Бьёт везде, кроме ${a.safe||1} ${plural(a.safe||1,"клетки","клеток","клеток")} (клетка героя всегда под ударом).`);
    else parts.push(`Бьёт: ${cellsText(a.cells)}.`);
    const r = a.rand; if (r && (r[1]||r[0])) parts.push(`Плюс ${r[0]===r[1] ? r[0] : `${r[0]}–${r[1]}`} случайн. клетк.`);
    if (a.mirror) parts.push("Узор случайно отражается влево/вправо.");
    if (a.fake && a.fake.length) parts.push(`ОБМАН: до вспышки светятся ${cellsText(a.fake)} — а бьёт по другим.`);
    else if (a.follow === false) parts.push("Не следует за героем.");
    else parts.push("До вспышки следует за героем.");
    if (a.yank) parts.push(`Во вспышку тянет героя на ${Math.abs(a.yank)} ${a.yank>0?"влево":"вправо"} — надо успеть отскочить.`);
  } else if (k === "series"){
    const hits = a.hits || [];
    parts.push(`Серия из ${hits.length}${a.perMinion ? " + по удару за каждого помощника" : ""}: ` + hits.map((h,i)=>`${i+1}) ${h.all ? "вся арена" : cellsText(h.cells)}${h.rand ? ` +${h.rand} случ.` : ""}`).join("; ") + ".");
    if (a.fixed) parts.push("Удары отсчитываются от клетки, где герой стоял в начале.");
    if (a.swap) parts.push("На середине замаха узор переворачивается!");
    if (a.tired) parts.push(`Потом монстр устаёт на ${a.tired} р.`);
  } else if (k === "throw"){
    parts.push("Не увернуться: бросает героя к другому монстру. Защита смягчает.");
  } else {
    const e = BUFF_EFFECTS.find(x=>x[0]===a.effect);
    parts.push((e ? e[1] : "Приём") + ".");
    if (a.effect === "trap") parts.push(`${(POOL_KINDS.find(x=>x[0]===a.trap)||["","огонь"])[1]} на ${a.rounds||2} р.`);
    else if (a.effect === "summon") parts.push(`Кого: ${a.summon ? monsterName(a.summon) : "кого зовёт сам монстр"} ×${a.count||1}.`);
    else if (a.effect === "charge") parts.push(`Копит ${a.rounds||2} р., потом — «${attackName(a.release||"pounce")}».`);
    else if (a.effect === "heal") parts.push(`Лечит ${a.allies ? "всех монстров" : "себя"} на ${Math.round((a.heal||0.2)*100)}%.`);
    else if (a.effect === "thorns") parts.push(`${a.rounds||2} р., ранит бьющего на ${Math.round((a.thorns||0.4)*100)}% урона.`);
    else if (a.effect !== "cleanse" && a.rounds) parts.push(`На ${a.rounds} р.`);
  }
  if (k !== "buff"){ const d = dmg(); if (d) parts.push(d[0].toUpperCase() + d.slice(1) + "."); }
  if (a.stun) parts.push("Попал — оглушение (ход потерян).");
  if (a.push) parts.push(`Попал — отбрасывает на ${Math.abs(a.push)}.`);
  if (a.drain) parts.push(`Лечится на ${Math.round(a.drain*100)}% нанесённого.`);
  if (a.leave) parts.push(`После удара на клетках остаётся ${POOL_SHORT[a.leave]||a.leave} на ${a.leaveRounds||2} р.`);
  if (a.selfDestruct) parts.push("Сам сгорает.");
  if (a.land) parts.push("После удара садится.");
  if (a.kind === "hit" && a.tired) parts.push(`Устаёт на ${a.tired} р.`);
  if (a.noVuln) parts.push("Без слабого места.");
  return parts.join(" ");
}

/* ---------- «ИГРАТЬ ОТСЮДА» (раунд 87) ----------
   state.playtest = {enabled, area, x, z, level, lira, flags, scenesDone, hour,
   noTips, noIntro}. Игра: на титульнике первый пункт «▶ Тест: играть отсюда»
   (main._start_playtest). */
function startPlaytest(){
  const ctx = ui.ctx && ui.ctx.kind === "map" ? ui.ctx : {kind:"map", id: (state.playerStart||{}).area || firstMapId()};
  startPick("▶ Играть отсюда: кликните, где начать тест", ctx, (x, z)=>{
    state.playtest = Object.assign({level:0, lira:false, flags:[], scenesDone:[], hour:-1, noTips:false, noIntro:true}, state.playtest||{}, {area:ctx.id, x, z});
    setTimeout(openPlaytestDialog, 50);
  });
}
function openPlaytestDialog(){
  const pt = state.playtest || {};
  const u = storyUsage();
  const flags = Object.keys(u.flags).filter(n=>!/^(scene_done|battle_done|autotalk_done):/.test(n)).sort();
  const scenes = (state.cutscenes||[]).filter(sc=>sc.once !== false);
  const body = `<p class="hint">Игра начнётся сразу в точке <b>${esc(mapName(pt.area))}</b> (${round2(pt.x)}, ${round2(pt.z)}) — новая сессия, как будто игрок уже дошёл сюда. Ваши сохранения не трогаются.</p>
    <div class="grid2"><label class="field"><span>Уровень героя (0 — как в «Начале игры»)</span><input type="number" id="ptLevel" min="0" max="60" value="${Number(pt.level)||0}"></label>
    <label class="field"><span>Время суток (−1 — как в начале игры)</span><input type="number" id="ptHour" min="-1" max="23" step="0.5" value="${pt.hour==null ? -1 : pt.hour}"></label></div>
    <label class="check"><input type="checkbox" id="ptLira" ${pt.lira?"checked":""}><span>${esc(CompanionName)} уже в отряде</span></label>
    <label class="check"><input type="checkbox" id="ptIntro" ${pt.noIntro!==false?"checked":""}><span>Вступление уже было (не показывать сцену «начало новой игры»)</span></label>
    <label class="check"><input type="checkbox" id="ptTips" ${pt.noTips?"checked":""}><span>Без подсказок обучения</span></label>
    <div class="lab" style="margin-top:8px">Отметки сюжета, которые уже стоят</div>
    <div class="list" style="max-height:160px;overflow:auto">${flags.length ? flags.map(f=>`<label class="check"><input type="checkbox" data-ptflag="${esc(f)}" ${(pt.flags||[]).includes(f)?"checked":""}><span class="mono">${esc(f)}</span></label>`).join("") : `<p class="hint">В мире пока нет отметок.</p>`}</div>
    <div class="lab" style="margin-top:8px">Сцены, которые уже сыграны</div>
    <div class="list" style="max-height:160px;overflow:auto">${scenes.length ? scenes.map(sc=>`<label class="check"><input type="checkbox" data-ptscene="${esc(sc.id)}" ${(pt.scenesDone||[]).includes(sc.id)?"checked":""}><span>${esc(sc.name||sc.id)}</span></label>`).join("") : `<p class="hint">Сцен пока нет.</p>`}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn primary" id="ptGo">Записать и сохранить в игру</button><button class="btn" id="ptPlace">Другое место…</button>${pt.enabled ? `<button class="btn danger" id="ptOff">Выключить тест</button>` : ""}</div>
    <p class="hint" style="margin-top:8px">Дальше: запустите игру — на титульнике первым пунктом будет <b>«▶ Тест: играть отсюда»</b>. Перед выпуском игры тест выключите (проверка мира напомнит).</p>`;
  openSimpleModal("▶ Играть отсюда", body, (root, close)=>{
    const read = ()=>{
      const t = state.playtest = state.playtest || {};
      t.level = Math.max(0, Math.min(60, parseInt(root.querySelector("#ptLevel").value)||0));
      const h = parseFloat(root.querySelector("#ptHour").value); t.hour = isNaN(h) ? -1 : h;
      t.lira = root.querySelector("#ptLira").checked;
      t.noIntro = root.querySelector("#ptIntro").checked;
      t.noTips = root.querySelector("#ptTips").checked;
      t.flags = Array.from(root.querySelectorAll("[data-ptflag]")).filter(e=>e.checked).map(e=>e.dataset.ptflag);
      t.scenesDone = Array.from(root.querySelectorAll("[data-ptscene]")).filter(e=>e.checked).map(e=>e.dataset.ptscene);
      return t;
    };
    root.querySelector("#ptGo").onclick = ()=>{ const t = read(); t.enabled = true; commit(); close(); saveToGame(false); toast("Тест записан. Запустите игру → «▶ Тест: играть отсюда»"); };
    root.querySelector("#ptPlace").onclick = ()=>{ read(); close(); startPlaytest(); };
    const off = root.querySelector("#ptOff"); if (off) off.onclick = ()=>{ state.playtest.enabled = false; commit(); close(); saveToGame(false); toast("Тест выключен"); };
  });
}

м.","title":"Слабое место","where":"бой: золотая клетка"},"w_bag":{"text":"Находки, зелья и снаряжение — в сумке. Там же карта, задания и бестиарий. Зелье можно выпить и вне боя.","title":"Сумка","where":"мир: что-то нашёл"},"w_equip":{"text":"Найдено снаряжение! Надень его в сумке на вкладке «Снаряжение» — справа видно, что станет лучше, а что хуже.","title":"Снаряжение","where":"мир: найдена вещь"},"w_inn":{"text":"В городе можно переночевать — отряд полностью восстановит здоровье и энергию.\nСюда же отряд вернётся, если погибнет (потеряв часть золота).","title":"Гостиница","where":"мир: первый город"},"w_lira":{"text":"Теперь вас двое. Подойди к напарнице и нажми E — поговорить.\nВ бою: пункт «В бой» — сменить бойца, E — её помощь со скамейки.","title":"Напарница","where":"мир: Лира в отряде"},"w_map":{"text":"Карта открывается по мере того, как ты исследуешь мир. На ней отмечены дома, переходы и жители.","title":"Карта","where":"мир: вторая карта"},"w_monsters":{"text":"Монстры бродят по опасной земле и замечают тебя («!»).\nУдарь первым мечом (Пробел) — бой начнётся с ПРЕИМУЩЕСТВОМ. Догонят со спины — будет ЗАСАДА.","title":"Монстры","where":"мир: монстр рядом"},"w_move":{"text":"Осмотрись вокруг. Подходи к людям и вещам — над ними появится подсказка.","title":"Управление","where":"мир: начало игры"},"w_night":{"text":"Ночью монстры быстрее и зорче, чаще попадается элита. Зато распускаются ночные травы.","title":"Ночь","where":"мир: первая ночь"},"w_quest":{"text":"Текущая цель видна в углу экрана. Все задания — в сумке на вкладке «Задания».","title":"Задания","where":"мир: взято задание"},"w_save":{"text":"Игра сохраняется сама каждые 5 минут и после важных событий. Сохраниться вручную — Esc → «Сохранить».","title":"Сохранение","where":"мир: 10 минут игры"},"w_tree":{"text":"За новый уровень дают ОЧКО НАВЫКОВ. Открой древо и изучи узел рядом с уже изученным: прибавки, новые приёмы, сильные ключевые узлы.\nУровень сам здоровье не лечит.","title":"Древо навыков","where":"мир: есть очко навыков"},"w_spores":{"title":"Споровый туман","where":"мир: споровый туман","text":"Ядовитые споры понемногу отнимают здоровье всему отряду.\nУкройтесь в городе или под магическим куполом — или выпейте «Эликсир чистого дыхания» (варится из лазурного светогриба)."},"w_fish":{"title":"Рыбалка","where":"мир: первая рыбалка","text":"Нужны надетая удочка (сумка → Снаряжение → «Удочка») и наживка этой воды — их продают в лавке.\nЖдите, пока поплавок не уйдёт под воду, — и сразу подсекайте. Дальше по кругу бежит стрелка: жмите, когда она над ЗЕЛЁНОЙ зоной. Поймали все зоны — открывается следующий круг. Чем ценнее улов, тем больше кругов.\nПромах рвёт леску — у неё три жизни. После поклёвки наживка может пропасть.","keys":[[["Пробел","E","ЛКМ"],"подсечь"],[["Q"],"бросить прикормку"],[["Esc","шаг"],"смотать удочку"]]},"w_fishspot":{"title":"Рыбное место","where":"мир: первое рыбное место","text":"Вода забурлила — там собралась рыба! Отойдите вдоль берега и забросьте удочку прямо в пузыри: клюёт вдвое быстрее, крупная рыба чаще, а со дна иногда поднимаются сокровища. Место скоро исчезнет.\nПрикормка собирает рыбу у поплавка: Q во время рыбалки (R — выбрать другую) или «Бросить в воду» в сумке. Её продают в рыболовной лавке или варят в котле.","keys":[[["Q"],"бросить прикормку"],[["R"],"другая прикормка"]]}};
function tutorialState(){ state.tutorial = state.tutorial || {}; state.tutorial.tips = state.tutorial.tips || {}; return state.tutorial; }
function insTutorial(F, sel){
  const tu = state.tutorial || {};
  let html = `<div class="ins-head"><div class="badge">${glyph("game")}</div><div class="titles"><div class="kind">Игра</div><div class="disp" style="font-size:20px;">Обучение</div></div></div>`;
  html += `<p class="hint" style="margin:8px 12px">Подсказки показываются ОДИН раз — в нужный момент: в первом бою (по ходу: уклонение, слабое место, меню, надлом…) и в мире (управление, сумка, древо навыков, гостиница…). Пока подсказка открыта, бой стоит. Тексты ниже можно переписать; пустое поле — текст игры. Свою подсказку в любой момент — шаг сцены «💡 Подсказка». Обучающий бой (проиграть нельзя, монстр может сдаться) — у шага сцены «⚔ Бой».</p>`;
  html += `<div style="margin:0 12px">${F.check("Показывать подсказки обучения", tu.enabled !== false, v=>{ const t = tutorialState(); if (v) delete t.enabled; else t.enabled = false; })}</div>`;
  const group = (pref, title)=>{
    let h = "";
    Object.keys(DEFAULT_TIPS).filter(id=>id.startsWith(pref)).forEach(id=>{
      const d = DEFAULT_TIPS[id]; const o = (tu.tips||{})[id] || {};
      const T = ()=>{ const t = tutorialState(); t.tips[id] = t.tips[id] || {}; return t.tips[id]; };
      h += `<div class="card"><div class="hint">${esc(d.where)} · <code>${id}</code></div>
        ${F.check("Показывать", !o.off, v=>{ T().off = !v; })}
        ${F.text("Заголовок", o.title||"", v=>T().title=v, {placeholder:d.title})}
        ${F.area("Текст", o.text||"", v=>T().text=v, {rows:3, placeholder:d.text})}</div>`;
    });
    return sec("tut_" + pref, title, `<div class="list">${h}</div>`, false);
  };
  html += group("b_", "В бою");
  html += group("w_", "В мире");
  return html;
}

function slimeSceneTemplate(){
  const area = currentMapId ? currentMapId() : firstMapId();
  const ps = state.playerStart && state.playerStart.area === area ? state.playerStart : null;
  const x = ps ? Number(ps.x)||0 : 0, z = ps ? (Number(ps.z)||0) + 12 : 0;
  const id = uidIn(state.cutscenes, "slime_meet");
  const sc = {id, name:"Встреча со слизнем", trigger:"zone", area, x, z, radius:4, once:true, needFlag:"", noFlag:"",
    figures:[{id:"slime", name:"Слизень", color:"#59cc8c", monster:"slime", x, z: z - 2.5, visible:true}],
    steps:[
      {type:"emote", actor:"slime", icon:"question", jump:true, time:1.2, wait:true},
      {type:"say", who:"slime", emotion:"surprised", side:"auto", text:"Бу-у?! Ты кто такой? Пахнешь… странно. Не по-здешнему."},
      {type:"say", who:"hero", emotion:"thinking", side:"auto", text:"Я… не помню. Очнулся у большого дерева — и вот я здесь."},
      {type:"choice", who:"hero", emotion:"thinking", text:"Что ответить слизню?", options:[{text:"Я не враг. Просто ищу дорогу.", goto:"вежливо"}, {text:"Прочь с дороги, слизь!", goto:"грубо"}]},
      {type:"label", name:"вежливо"},
      {type:"emote", actor:"slime", icon:"heart", jump:true, time:1.0, wait:false},
      {type:"say", who:"slime", emotion:"happy", side:"auto", text:"Хм-м! Вежливый. Ладно, потеряшка, раз уж ты ничего не помнишь — покажу, как тут выживают.\n\nНападай понарошку! Я не обижусь."},
      {type:"battle", monsters:[{type:"slime", level:1}], tutorial:true, spare:50},
      {type:"say", who:"slime", emotion:"happy", side:"auto", text:"Уф! Хватит-хватит, сдаюсь! Для новичка — очень даже.\n\nДержи, пригодится. Дальше по тропе водятся звери позлее меня."},
      {type:"give", gold:0, items:[{itemId:"potion_hp", qty:3}], wait:true},
      {type:"flag", flag:"slime_friend", clear:false, wait:true},
      {type:"goto", label:"конец"},
      {type:"label", name:"грубо"},
      {type:"emote", actor:"slime", icon:"anger", jump:true, time:1.0, wait:false},
      {type:"say", who:"slime", emotion:"angry", side:"auto", text:"Сам ты слизь! Ну держись!"},
      {type:"battle", monsters:[{type:"slime", level:1}], tutorial:true, spare:0},
      {type:"say", who:"hero", emotion:"sad", side:"auto", text:"…Похоже, здесь стоит быть вежливее."},
      {type:"label", name:"конец"},
    ]};
  state.cutscenes.push(sc);
  commit(); select({type:"scene", id}); openScene(id);
  toast("Сцена-образец создана: круг-триггер стоит рядом со стартом — передвиньте его к кустам. Слизень — фигура сцены (монстр).");
}

function treeOf(owner){ const t = state.skillTrees && state.skillTrees[owner]; return (t && Array.isArray(t.nodes) && t.nodes.length) ? t : DEFAULT_SKILL_TREES[owner]; }
function treeOwn(owner){ return !!(state.skillTrees && state.skillTrees[owner] && (state.skillTrees[owner].nodes||[]).length); }
// правка: встроенное дерево копируется в мир при первом изменении
function treeEdit(owner){
  state.skillTrees = state.skillTrees || {};
  if (!treeOwn(owner)) state.skillTrees[owner] = deepCopy(DEFAULT_SKILL_TREES[owner] || {nodes:[{id:owner[0]+"1", x:0, y:0, kind:"start", name:"Начало", cost:0, stats:{}}], links:[]});
  return state.skillTrees[owner];
}
function treeStatLabel(k){ const r = TREE_STATS.find(x=>x[0]===k); return r ? r[1] : k; }
function treeNodeTitle(owner, n){
  if (!n) return "";
  if ((n.name||"").trim()) return n.name;
  if (n.skill) return (skillDefs().find(s=>s.id===n.skill)||{}).name || n.skill;
  const ks = Object.keys(n.stats||{});
  if (ks.length){ const v = n.stats[ks[0]]; return `${v>0?"+":""}${v} ${treeStatLabel(ks[0]).replace(/ \(\+N\)|, %.*$/,"")}`; }
  return (TREE_KINDS.find(k=>k[0]===n.kind)||["","Узел"])[1].split(" —")[0];
}
function treeProblems(owner){
  const t = treeOf(owner); const out = [];
  if (!t || !t.nodes || !t.nodes.length){ return [`Древо пустое`]; }
  const ids = new Set(t.nodes.map(n=>n.id));
  const start = t.nodes.find(n=>n.kind==="start");
  if (!start) out.push("Нет узла «Начало» — игрок не сможет ничего изучить");
  const adj = {}; t.nodes.forEach(n=>adj[n.id]=[]);
  (t.links||[]).forEach(([a,b])=>{ if (ids.has(a) && ids.has(b)){ adj[a].push(b); adj[b].push(a); } });
  if (start){
    const seen = new Set([start.id]); const q = [start.id];
    while (q.length){ const c = q.pop(); adj[c].forEach(nb=>{ if (!seen.has(nb)){ seen.add(nb); q.push(nb); } }); }
    const lost = t.nodes.filter(n=>!seen.has(n.id));
    if (lost.length) out.push(`Не связаны с началом (не взять): ${lost.map(n=>"«"+treeNodeTitle(owner,n)+"»").slice(0,5).join(", ")}${lost.length>5?"…":""}`);
  }
  const sk = skillDefs();
  t.nodes.forEach(n=>{
    if (n.kind==="skill" && !n.skill) out.push(`Узел-приём без приёма: «${treeNodeTitle(owner,n)}»`);
    [n.skill, n.rank].forEach(x=>{ if (x && !sk.some(s=>s.id===x)) out.push(`Нет приёма «${x}» (узел «${treeNodeTitle(owner,n)}»)`); });
  });
  return out;
}
function treeSkillOptions(owner, cur){
  return [["","— нет"]].concat(skillDefs().filter(s=>(s.owner||"hero")===owner && !s.off).map(s=>[s.id, `${s.name||s.id}${(s.unlock||1)<=1 ? " (известен с начала)" : ""}`]));
}

function treeFit(){
  const t = treeOf(ste.owner); const w = document.getElementById("stCanvasWrap");
  if (!t.nodes.length || !w) return;
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  t.nodes.forEach(n=>{ x0=Math.min(x0,n.x); y0=Math.min(y0,n.y); x1=Math.max(x1,n.x); y1=Math.max(y1,n.y); });
  ste.view.x = (x0+x1)/2; ste.view.y = (y0+y1)/2;
  ste.view.k = Math.min(1.6, Math.max(0.2, Math.min(w.clientWidth/(x1-x0+160), w.clientHeight/(y1-y0+160))));
}
function treeSvg(owner){
  const t = treeOf(owner);
  const byId = {}; t.nodes.forEach(n=>byId[n.id]=n);
  const v = ste.view;
  let h = `<svg id="stSvg" style="position:absolute;inset:0;width:100%;height:100%;cursor:grab" xmlns="http://www.w3.org/2000/svg"><g id="stG">`;
  (t.links||[]).forEach(([a,b])=>{ const A = byId[a], B = byId[b]; if (A && B) h += `<line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="${(ste.sel===a||ste.sel===b) ? "#f0c060" : "#5b6278"}" stroke-width="${(ste.sel===a||ste.sel===b) ? 5 : 3}"/>`; });
  const poly = (x, y, r, k, rot)=> Array.from({length:k}, (_, i)=>{ const a = rot + Math.PI*2*i/k; return `${(x+Math.cos(a)*r).toFixed(1)},${(y+Math.sin(a)*r).toFixed(1)}`; }).join(" ");
  t.nodes.forEach(n=>{
    const r = TREE_R[n.kind] || 11; const on = ste.sel === n.id;
    const col = {start:"#f0d890", keystone:"#e8885a", skill:"#6aa6f0", notable:"#e0bc6a", minor:"#c8bfa6"}[n.kind] || "#c8bfa6";
    const st = on ? `stroke="#ffffff" stroke-width="4"` : `stroke="${col}" stroke-width="2.5"`;
    let shape;
    if (n.kind==="keystone") shape = `<polygon points="${poly(n.x, n.y, r, 8, Math.PI/8)}" fill="#2a2030" ${st}/>`;
    else if (n.kind==="skill") shape = `<polygon points="${poly(n.x, n.y, r, 4, Math.PI/4)}" fill="#1c2840" ${st}/>`;
    else shape = `<circle cx="${n.x}" cy="${n.y}" r="${r}" fill="${n.kind==="start" ? col : "#1f2232"}" ${st}/>`;
    h += `<g data-stnode="${esc(n.id)}" style="cursor:pointer">${shape}`;
    if (n.kind!=="minor" && n.kind!=="start") h += `<text x="${n.x}" y="${n.y + r + 16}" text-anchor="middle" font-size="13" fill="#e8e2d0" style="pointer-events:none;paint-order:stroke" stroke="#141826" stroke-width="4">${esc(treeNodeTitle(owner, n))}</text>`;
    else if (n.kind==="minor") h += `<text x="${n.x}" y="${n.y + r + 13}" text-anchor="middle" font-size="10" fill="#9aa0b4" style="pointer-events:none;paint-order:stroke" stroke="#141826" stroke-width="3">${esc(treeNodeTitle(owner, n))}</text>`;
    const c = n.cost==null ? (TREE_COST[n.kind]||1) : n.cost;
    if (c > 1) h += `<text x="${n.x}" y="${n.y+4}" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" style="pointer-events:none">${c}</text>`;
    h += `</g>`;
  });
  h += `</g></svg><div class="hint" style="position:absolute;left:10px;bottom:8px;color:#a9a3b8">Клик — выбрать · тянуть узел — двигать · тянуть фон — панорама · колесо — масштаб · Shift+клик — связать/развязать с выбранным · двойной клик по фону — новый узел · Del — удалить</div>`;
  return h;
}
function treeApplyView(){
  const svg = document.getElementById("stSvg"), g = document.getElementById("stG");
  if (!svg || !g) return;
  const w = svg.clientWidth, h = svg.clientHeight, v = ste.view;
  g.setAttribute("transform", `translate(${w/2 - v.x*v.k} ${h/2 - v.y*v.k}) scale(${v.k})`);
}
function treeToWorld(ev){
  const svg = document.getElementById("stSvg"); const r = svg.getBoundingClientRect(); const v = ste.view;
  return {x: (ev.clientX - r.left - r.width/2)/v.k + v.x, y: (ev.clientY - r.top - r.height/2)/v.k + v.y};
}
function bindTreeSvg(){
  const svg = document.getElementById("stSvg");
  if (!svg) return;
  treeApplyView();
  svg.addEventListener("wheel", ev=>{ ev.preventDefault(); const p = treeToWorld(ev); const k0 = ste.view.k; ste.view.k = Math.max(0.15, Math.min(2.5, k0 * (ev.deltaY < 0 ? 1.15 : 1/1.15))); const p2 = treeToWorld(ev); ste.view.x += p.x - p2.x; ste.view.y += p.y - p2.y; treeApplyView(); }, {passive:false});
  svg.addEventListener("pointerdown", ev=>{
    const g = ev.target.closest("[data-stnode]");
    const p = treeToWorld(ev);
    if (g){
      const id = g.dataset.stnode;
      if (ev.shiftKey && ste.sel && ste.sel !== id){ treeToggleLink(ste.sel, id); return; }
      const n = treeOf(ste.owner).nodes.find(x=>x.id===id);
      ste.drag = {kind:"node", id, ox: p.x - n.x, oy: p.y - n.y, moved:false};
      if (ste.sel !== id){ ste.sel = id; renderSkillTree(); ste.drag = {kind:"node", id, ox: p.x - n.x, oy: p.y - n.y, moved:false}; }
    } else {
      ste.drag = {kind:"pan", sx: ev.clientX, sy: ev.clientY, vx: ste.view.x, vy: ste.view.y};
    }
    document.getElementById("stSvg").setPointerCapture(ev.pointerId);
  });
  svg.addEventListener("pointermove", ev=>{
    const d = ste && ste.drag; if (!d) return;
    if (d.kind === "pan"){ ste.view.x = d.vx - (ev.clientX - d.sx)/ste.view.k; ste.view.y = d.vy - (ev.clientY - d.sy)/ste.view.k; treeApplyView(); return; }
    const p = treeToWorld(ev);
    const t = treeEdit(ste.owner); const n = t.nodes.find(x=>x.id===d.id);
    n.x = Math.round((p.x - d.ox)/5)*5; n.y = Math.round((p.y - d.oy)/5)*5; d.moved = true;
    const wrap = document.getElementById("stCanvasWrap"); wrap.innerHTML = treeSvg(ste.owner); bindTreeSvgLite();
  });
  const up = ()=>{ if (ste && ste.drag){ const m = ste.drag.kind==="node" && ste.drag.moved; ste.drag = null; if (m){ commit(); renderSkillTree(); } } };
  svg.addEventListener("pointerup", up);
  svg.addEventListener("dblclick", ev=>{ if (ev.target.closest("[data-stnode]")) return; const p = treeToWorld(ev); treeAddAt(Math.round(p.x/5)*5, Math.round(p.y/5)*5); });
}
// во время перетаскивания SVG пересобирается — те же обработчики на новом
function bindTreeSvgLite(){ bindTreeSvg(); }
function treeNewId(t){ const ex = new Set(t.nodes.map(n=>n.id)); let k = t.nodes.length + 1; const p = ste.owner==="mage" ? "m" : (ste.owner==="moth" ? "t" : "h"); while (ex.has(p+k)) k++; return p+k; }
function treeAddAt(x, y){
  const t = treeEdit(ste.owner);
  const id = treeNewId(t);
  t.nodes.push({id, x, y, kind:"minor", name:"", desc:"", cost:1, stats:{hp:5}, skill:"", rank:"", level:0});
  if (ste.sel && t.nodes.some(n=>n.id===ste.sel)) t.links.push([ste.sel, id]);
  ste.sel = id; commit(); renderSkillTree();
}
function treeAddNear(n){
  const a = Math.atan2(n.y, n.x) + (Math.random()-0.5)*0.6; const r = Math.hypot(n.x, n.y) + 90;
  treeAddAt(Math.round(Math.cos(a)*r/5)*5, Math.round(Math.sin(a)*r/5)*5);

function treeToggleLink(a, b){
  const t = treeEdit(ste.owner);
  const i = t.links.findIndex(l=>(l[0]===a&&l[1]===b)||(l[0]===b&&l[1]===a));
  if (i >= 0) t.links.splice(i, 1); else t.links.push([a, b]);
  commit(); renderSkillTree();
}
function treeDelete(id){
  const t = treeEdit(ste.owner);
  const n = t.nodes.find(x=>x.id===id); if (!n || n.kind==="start") return;
  t.nodes = t.nodes.filter(x=>x.id!==id); t.links = t.links.filter(l=>!l.includes(id));

function newMonsterId(){ const ex = new Set(allMonsterIds()); let n = 1; while (ex.has("mon_"+n)) n++; return "mon_"+n; }
function newAttackId(){ const ex = new Set(allAttackIds()); let n = 1; while (ex.has("atk_"+n)) n++; return "atk_"+n; }
function matchQ(...s){ const q = (mon.q||"").trim().toLowerCase(); return !q || s.some(x=>String(x||"").toLowerCase().includes(q)); }

function inflictRows(F, list, setList, key){
  let h = (list||[]).map((p, i)=>`<div class="lootrow" style="grid-template-columns:minmax(0,1fr) 110px auto">
    ${F.select("", p[0], GAME_STATUSES, v=>{ const l = deepCopy(list); l[i][0] = v; setList(l); })}
    ${F.num("", Math.round((p[1]||0)*100), v=>{ const l = deepCopy(list); l[i][1] = Math.max(0, Math.min(100, v))/100; setList(l); }, {int:true, min:0, max:100, hint:"шанс, %"})}
    ${F.button("✕", ()=>{ const l = deepCopy(list); l.splice(i, 1); setList(l.length ? l : null); commit(); renderMon(); }, "danger")}
  </div>`).join("");

// строки пула атак
function poolRows(F, pool, setPool){
  const total = (pool||[]).reduce((s,e)=>s + (Number(e.w)||0), 0) || 1;
  let h = (pool||[]).map((e, i)=>`<div class="lootrow" style="grid-template-columns:minmax(0,1fr) 78px 44px auto auto">

    ${F.num("", e.w, v=>{ const l = deepCopy(pool); l[i].w = Math.max(0, v); setPool(l); }, {step:0.05, min:0})}
    <span class="hint" title="доля среди атак">${Math.round((Number(e.w)||0)/total*100)}%</span>
    <button class="btn small" data-openatk="${esc(e.t)}" title="открыть атаку">✎</button>
    ${F.button("✕", ()=>{ const l = deepCopy(pool); l.splice(i, 1); setPool(l); commit(); renderMon(); }, "danger")}

}

      if ((a.area||"cells") === "all") for (let o=0;o<n;o++) marks[normOff(o,n)] = "danger";
      else if (a.area === "all_but"){ for (let o=0;o<n;o++) marks[normOff(o,n)] = "danger"; marks[normOff(n/2, n)] = ""; }
      else ((n===8 && a.cells8!=null) ? a.cells8 : (a.cells||[])).forEach(o=>marks[normOff(o,n)] = "danger");
      ((n===8 && a.fake8!=null) ? a.fake8 : (a.fake||[])).forEach(o=>{ const v = normOff(o,n); marks[v] = marks[v]==="danger" ? "both" : "fake"; });
    }
    return ringSvg(n, marks, {size:220, labels:true, dark:true, arrow: a.yank && (a.kind||"hit")==="hit" ? a.yank : 0});
  }
  const marks = {};
  Object.entries(fr.marks||{}).forEach(([k, v])=>{
    if (v === "charge"){ marks[k] = "charge"; }
    else if (v === "orange") marks[k] = "fire";
    else if (v === "rock") marks[k] = "";
    else marks[k] = v;
  });
  let svg = ringSvg(n, marks, {size:220, labels:true, dark:true, hero: fr.hero==null?0:fr.hero, arrow: fr.arrow||0});
  if (fr.hit) svg = `<div style="animation:mwShake .25s">${svg}</div>`;
  return svg;
}
function atkPlay(){
  const a = attackDef(mon.aid); if (!a) return;
  const n = mon.ring8 ? 8 : 4;
  mon.play = {t:0, last:performance.now(), raf:0, tl: atkTimeline(a, n), n};
  const tick = (now)=>{
    if (!mon || !mon.play) return;
    const dt = Math.min((now - mon.play.last)/1000, 0.1);
    mon.play.last = now; mon.play.t += dt;
    atkPaint();
    if (mon.play.t > mon.play.tl.total + 0.6){ mon.play = null; renderMon(); return; }
    mon.play.raf = requestAnimationFrame(tick);
  };
  mon.play.raf = requestAnimationFrame(tick);
}
function atkPaint(){
  if (!mon || !mon.play) return;
  const a = attackDef(mon.aid);
  const T = mon.play.t;
  const fr = mon.play.tl.frames.find(f=>T >= f.t0 && T < f.t1) || null;
  const el = document.getElementById("atkPrev"); if (!el) return;
  if (!fr){ el.innerHTML = atkFrameSvg(a, mon.play.n, {marks:{}, hero:0}); const c = document.getElementById("atkCap"); if (c) c.textContent = T > mon.play.tl.total ? "Конец" : ""; return; }
  const key = mon.play.tl.frames.indexOf(fr);
  if (el.dataset.fr !== String(key)){ el.dataset.fr = String(key); el.innerHTML = atkFrameSvg(a, mon.play.n, fr); }
  const c = document.getElementById("atkCap"); if (c) c.textContent = fr.cap || "";
}

function monProblems(id){
  const d = monsterDef(id); if (!d) return [];

  if (!pool.length) out.push("Нет ни одной атаки — будет бить обычными ударами.");
  [[pool,"атак"],[d.airPool||[],"атак в воздухе"],[(d.phase2||{}).pool||[],"атак 2-й фазы"]].forEach(([p, what])=> p.forEach(e=>{ if (!attackDef(e.t)) out.push(`В списке ${what} нет такой атаки: ${e.t}`); }));
  if (d.opener && !attackDef(d.opener)) out.push(`Первая атака «${d.opener}» не найдена.`);
  if (d.summon && !monsterDef(d.summon)) out.push(`Призывает неизвестного монстра: ${d.summon}`);
  if (d.split && !monsterDef(d.split)) out.push(`Распадается на неизвестного монстра: ${d.split}`);
  const summons = pool.some(e=>(attackDef(e.t)||{}).effect==="summon" && !(attackDef(e.t)||{}).summon);
  if (summons && !d.summon) out.push("Есть «Призыв», но не выбрано, кого призывать (Особенности).");
  (d.drops||[]).forEach(x=>{ if (!itemCatalog().some(i=>i.id===x.id)) out.push(`Добыча: неизвестный предмет ${x.id}`); });

function atkProblems(aid){
  const a = attackDef(aid); if (!a) return [];
  const out = [];
  if ((a.kind||"hit")==="series" && !(a.hits||[]).length) out.push("В серии нет ни одного удара.");
  if ((a.kind||"hit")==="hit" && (a.area||"cells")==="cells" && !(a.cells||[]).length && !(a.rand||[0,0])[1]) out.push("Не выбрано ни одной клетки удара.");
  if (a.effect==="charge" && a.release && !attackDef(a.release)) out.push(`После заряда — неизвестная атака ${a.release}`);

}

/* ============================ выделение нескольких и буфер обмена (раунд 27) ============================
   Shift+клик — добавить/убрать объект; Shift+тянуть по пустому месту — рамка;
   Ctrl+A — всё на этой карте/этаже. Выделенные тянутся вместе, стрелки двигают
   все, Delete удаляет все. Ctrl+C / Ctrl+X / Ctrl+V — копировать, вырезать,
   вставить там, где курсор (можно на другой карте или этаже); Ctrl+D — копия рядом. */
const MULTI_TYPES = ["npc","container","town","battle","prop","house","path","exit","mech","cat"];
let clip = null;       // {items:[{type, obj, inside?}], cx, cz}
let boxSel = null;     // рамка выделения {a:[x,z], b:[x,z]}
function inMulti(sel){ return (ui.multi||[]).some(s=>sameSel(s, sel)); }
function selList(){
  const l = (ui.multi||[]).filter(s=>selExists(s));
  if (l.length) return l;
  return ui.sel && MULTI_TYPES.includes(ui.sel.type) && selExists(ui.sel) ? [ui.sel] : [];
}
function toggleMulti(sel){
  ui.multi = (ui.multi||[]).filter(s=>selExists(s));
  if (!ui.multi.length && ui.sel && MULTI_TYPES.includes(ui.sel.type) && !sameSel(ui.sel, sel) && selExists(ui.sel)) ui.multi.push(ui.sel);
  if (inMulti(sel)) ui.multi = ui.multi.filter(s=>!sameSel(s, sel)); else ui.multi.push(sel);
  ui.sel = ui.multi.length ? ui.multi[ui.multi.length-1] : null;
  if (ui.multi.length < 2) ui.multi = [];
}
function selPoint(sel){
  const o = getSelObj(sel); if (!o) return null;
  if (sel.type==="path"){ if (!o.points.length) return null; let x=0, z=0; o.points.forEach(p=>{ x+=p.x; z+=p.z; }); return [x/o.points.length, z/o.points.length]; }
  return selPos(sel);
}
function moveSelBy(sel, dx, dz){
  const o = getSelObj(sel); if (!o) return;
  if (sel.type==="path"){ o.points.forEach(p=>{ p.x = round2(p.x+dx); p.z = round2(p.z+dz); }); return; }
  if ("x" in o && "z" in o){ o.x = round2(o.x+dx); o.z = round2(o.z+dz); }
  if (sel.type==="npc" && o.behavior && Array.isArray(o.behavior.points)) o.behavior.points.forEach(p=>{ p.x = round2(p.x+dx); p.z = round2(p.z+dz); });
}
// всё, что лежит в прямоугольнике (мировые координаты) на открытой карте/этаже
function objectsInRect(x0, z0, x1, z1){
  const area = ui.ctx.id, floor = isFloorCtx(), out = [];
  const inR = (x, z)=> x >= x0 && x <= x1 && z >= z0 && z <= z1;
  state.npcs.forEach(o=>{ if (o.area===area && inR(o.x, o.z)) out.push({type:"npc", id:o.id}); });
  state.containers.forEach(o=>{ if (o.area===area && inR(o.x, o.z)) out.push({type:"container", id:o.id}); });
  (state.battles||[]).forEach(o=>{ if (o.area===area && inR(o.x, o.z)) out.push({type:"battle", id:o.id}); });
  (state.props||[]).forEach(o=>{ if (o.area===area && inR(o.x, o.z)) out.push({type:"prop", id:o.id}); });
  (state.mechs||[]).forEach(o=>{ if (o.area===area && inR(o.x, o.z)) out.push({type:"mech", id:o.id}); });
  (state.caterpillars||[]).forEach(o=>{ if (o.area===area && inR(o.x, o.z)) out.push({type:"cat", id:o.id}); });
  (state.paths||[]).forEach(o=>{ if (o.area===area && o.points.some(p=>inR(p.x, p.z))) out.push({type:"path", id:o.id}); });
  if (!floor){
    state.towns.forEach(o=>{ if (o.area===area && inR(o.x, o.z)) out.push({type:"town", id:o.id}); });
    state.houses.forEach(o=>{ if (o.area===area && inR(o.x, o.z)) out.push({type:"house", id:o.id}); });
  } else {
    const ff = findFloor(area);
    if (ff) ff.floor.exits.forEach(e=>{ if (inR(e.x, e.z)) out.push({type:"exit", floor:area, id:e.id}); });
  }
  return out;
}
function setMulti(list){ ui.multi = list.length > 1 ? list : []; ui.sel = list[0] || null; }
function deleteMulti(){
  const list = selList();

function copySel(cut){
  const list = selList().filter(s=>s.type!=="exit");
  if (!list.length){ toast("Выделите объекты (клик, Shift+клик или Shift+рамка), потом Ctrl+C"); return; }
  const items = []; let sx = 0, sz = 0, n = 0;
  list.forEach(sel=>{
    const o = getSelObj(sel); if (!o) return;
    const it = {type: sel.type, obj: deepCopy(o)};
    if (sel.type==="house" && o.type!=="cave"){
      const fids = new Set((o.floors||[]).map(f=>f.id));
      it.inside = {npcs: state.npcs.filter(x=>fids.has(x.area)).map(deepCopy), containers: state.containers.filter(x=>fids.has(x.area)).map(deepCopy),

        paths: (state.paths||[]).filter(x=>fids.has(x.area)).map(deepCopy)};
    }

  } else toast(`Скопировано: ${items.length}. Ctrl+V — вставить там, где курсор (можно на другой карте)`);

function pasteClip(at){
  if (!clip){ toast("Буфер пуст — выделите объекты и нажмите Ctrl+C"); return; }
  const area = ui.ctx.id, floor = isFloorCtx();
  const tx = at ? at[0] : getView().cx, tz = at ? at[1] : getView().cz;
  const dx = snap(tx - clip.cx), dz = snap(tz - clip.cz);
  const made = []; let skipped = 0;
  const shiftXZ = (o)=>{ if ("x" in o){ o.x = round2(o.x + dx); o.z = round2(o.z + dz); } };
  clip.items.forEach(it=>{
    const o = deepCopy(it.obj);
    switch (it.type){
      case "npc": o.id = uid("npc"); o.area = area; shiftXZ(o); if (o.behavior && o.behavior.points) o.behavior.points.forEach(p=>{ p.x = round2(p.x+dx); p.z = round2(p.z+dz); }); state.npcs.push(o); made.push({type:"npc", id:o.id}); break;
      case "container": o.id = uid(o.type==="chest" ? "chest" : "pot"); o.area = area; shiftXZ(o); state.containers.push(o); made.push({type:"container", id:o.id}); break;
      case "prop": o.id = uid("prop"); o.area = area; shiftXZ(o); state.props.push(o); made.push({type:"prop", id:o.id}); break;
      case "mech": o.id = uid(o.type); o.area = area; shiftXZ(o); state.mechs.push(o); made.push({type:"mech", id:o.id}); break;
      case "battle": o.id = uid("battle"); o.area = area; shiftXZ(o); state.battles.push(o); made.push({type:"battle", id:o.id}); break;
      case "path": o.id = uid("path"); o.area = area; o.points.forEach(p=>{ p.x = round2(p.x+dx); p.z = round2(p.z+dz); }); state.paths.push(o); made.push({type:"path", id:o.id}); break;
      case "cat": o.id = uid("cat"); o.area = area; shiftXZ(o); state.caterpillars.push(o); made.push({type:"cat", id:o.id}); break;
      case "town": if (floor){ skipped++; break; } o.id = uid("town"); o.area = area; shiftXZ(o); state.towns.push(o); made.push({type:"town", id:o.id}); break;
      case "house": {
        if (floor){ skipped++; break; }
        o.id = uid(o.type==="cave" ? "cave" : "house"); o.area = area; shiftXZ(o);
        if (o.type !== "cave"){
          const remap = {}; const used = allIds();
          (o.floors||[]).forEach(f=>{ let k = 1; while (used.has("floor_"+k)) k++; const nid = "floor_"+k; used.add(nid); remap[f.id] = nid; f.id = nid; });
          (o.floors||[]).forEach(f=> f.exits.forEach(e=>{ if (remap[e.target]) e.target = remap[e.target]; }));
          o.enterFloor = remap[o.enterFloor] || o.enterFloor;
          const inside = it.inside || {};
          const put = (arr, list, prefix)=> (list||[]).forEach(x=>{ const c = deepCopy(x); c.id = uid(typeof prefix === "function" ? prefix(c) : prefix); c.area = remap[c.area] || c.area; arr.push(c); });
          put(state.npcs, inside.npcs, "npc"); put(state.containers, inside.containers, c=> c.type==="chest" ? "chest" : "pot");
          put(state.props, inside.props, "prop"); put(state.battles, inside.battles, "battle"); put(state.paths, inside.paths, "path");
        }
        state.houses.push(o); made.push({type:"house", id:o.id});
        break;
      }
    }
  });
  setMulti(made);
  commit(); render();
  toast(`Вставлено: ${made.length}` + (skipped ? `, ${skipped} пропущено (здания и города — только на карте мира)` : ""));
}
