/* ============================ декор на карте (раунд 31) ============================
   Один рисунок для основной карты и мини-карты сцены: вид сверху с поворотом
   (крона дерева — полупрозрачный круг) и ТВЁРДАЯ зона, как её считает игра
   (PROP_TYPES[i][7] — выгрузка PropKit.footprints: [cx, cz, r] круг или
   [cx, cz, w, d] прямоугольник в своих координатах; поворот — rotate(-rot)). */
function propColor(o, t){
  const grp = t[2] || "";
  if (/tree|cactus|bush|hedge|mushroom/.test(o.type)) return o.type==="cactus" ? "#6a9a4a" : (o.type==="mushroom_giant" ? "#8a55c0" : "#3f7a3a");
  if (/rock|well|stone|ruin|menhir|obelisk|statue|gate|fountain/.test(o.type)) return "#8d877d";
  if (/bone|skull|ribcage/.test(o.type)) return "#e6dcc4";
  if (o.type==="crystal") return "#8fc8ff";
  return grp.startsWith("Дома") ? "#b0785a" : "#a07a4a";
}
function propSvg(o, k, opts={}){
  const t = PROP_TYPES.find(x=>x[0]===o.type) || [o.type, o.type, "", 0.6, 0.6, 0, 1, []];
  const sc = Number(o.scale)||1, rot = Number(o.rot)||0;
  const grp = t[2] || "";
  if (grp.startsWith("Дома")){
    const st = HOUSE_STYLES.find(x=>x[0]===o.type.replace("house_","")) || HOUSE_STYLES[0];
    return houseSvg(st[0], o.x, o.z, Number(t[3])*sc, Number(t[4])*sc, rot, st[2], st[3], k, {deco:true});
  }
  const col = propColor(o, t);
  const tree = /tree|cactus|bush|hedge|mushroom/.test(o.type);
  const pw = Math.max(Number(t[3]), 0.3), pd = Math.max(Number(t[4]), 0.3);
  const lw = (k / sc).toFixed(4);
  let body = "";
  if (tree && o.type !== "hedge"){
    // крона — сквозь неё видно, твёрдый только ствол
    const cr = Math.max(pw * 1.6, 1.2) * (o.type.startsWith("tree") ? 1.4 : 0.9) / 2;
    body = `<circle class="hl" cx="0" cy="0" r="${cr}" fill="${col}" fill-opacity=".55" stroke="rgba(20,40,15,.6)" stroke-width="${lw}"/>`;
  } else {
    body = `<rect class="hl" x="${-pw/2}" y="${-pd/2}" width="${pw}" height="${pd}" rx="${Math.min(pw,pd)*0.12}" fill="${col}" fill-opacity="${(t[7]||[]).length > 1 ? .35 : .8}" stroke="rgba(40,25,10,.6)" stroke-width="${lw}"/>`;
  }
  // твёрдая зона (как в игре): тёмная заливка + пунктир
  let solid = "";
  (t[7]||[]).forEach(sh=>{
    const dash = `stroke-dasharray="${(3*k/sc).toFixed(4)} ${(2*k/sc).toFixed(4)}"`;
    if (sh.length === 3) solid += `<circle cx="${sh[0]}" cy="${sh[1]}" r="${sh[2]}" fill="rgba(35,20,10,.45)" stroke="#2a1a0e" stroke-width="${(1.4*k/sc).toFixed(4)}" ${dash}/>`;
    else solid += `<rect x="${sh[0]-sh[2]/2}" y="${sh[1]-sh[3]/2}" width="${sh[2]}" height="${sh[3]}" ${sh[4] ? `transform="rotate(${-sh[4]} ${sh[0]} ${sh[1]})" ` : ""}fill="rgba(35,20,10,.45)" stroke="#2a1a0e" stroke-width="${(1.4*k/sc).toFixed(4)}" ${dash}/>`;   // раунд 109: 5-е число — поворот (ручная коллизия Студии)
  });
  const seat = t[5] ? `<circle cx="0" cy="0" r="${Math.max(0.1, 2.5*k)/sc}" fill="#fff"/>` : "";
  return `<g transform="translate(${o.x} ${o.z}) rotate(${-rot}) scale(${sc})">${body}${opts.noSolid ? "" : solid}${seat}</g>`;
}

/* ============================ силуэт здания как в игре (раунд 27) ============================
   Раньше на карте рисовался голый прямоугольник стен — в игре к нему добавляются
   свес крыши, крыльцо особняка, а башня и мельница круглые. Дверь — жёлтая метка
   со стрелкой наружу, точка, где игрок нажимает E, — кружок перед ней. */
function houseShape(style, w, d){
  switch (style){
    case "tower": { const r = Math.min(w, d)/2; return {round:true, roof:r+0.42, wall:r, door:r}; }
    case "windmill": { const r = Math.min(w, d)/2; return {round:true, roof:r*0.95, wall:r, door:r}; }
    case "tavern": return {roof:[w+0.9, d+0.9], wall:[w, d], door:d/2};
    case "manor": return {roof:[w+0.6, d+0.6], wall:[w, d], door:d/2, porch:[3.4, 1.6], entry:d/2+2.0};
    case "smithy": return {roof:[w+0.3, d+0.3], wall:[w*0.62, d], wallX:-w*0.19, door:d/2, entryX:-w*0.19};
    case "hall": return {roof:[w+0.6, d+0.6], wall:[w, d], door:d/2, entry:d/2+1.8};
    case "temple": return {roof:[w+0.6, d+0.6], wall:[w, d], door:d/2, entry:d/2+1.6};
    case "barn": return {roof:[w+0.6, d+0.6], wall:[w, d], door:d/2, entry:d/2+1.0};
    case "keep": return {roof:[w+0.5, d+0.5], wall:[w, d], door:d/2};
    default: return {roof:[w+0.6, d+0.6], wall:[w, d], door:d/2};
  }
}
function houseSvg(style, x, z, w, d, rotDeg, wallCol, roofCol, k, opts={}){
  const sh = houseShape(style, w, d);
  const sw = Math.max(0.12, 1.6*k);
  let g = `<g transform="translate(${x} ${z}) rotate(${-rotDeg})">`;
  if (sh.round){
    g += `<circle class="hl" cx="0" cy="0" r="${sh.roof}" fill="${roofCol}" fill-opacity="${opts.deco?0.7:0.9}" stroke="${wallCol}" stroke-width="${sw*1.6}"/>`;
    g += `<circle cx="0" cy="0" r="${sh.wall*0.2}" fill="rgba(0,0,0,.3)"/>`;
  } else {
    const [rw, rd] = sh.roof, [ww, wd] = sh.wall, wx = sh.wallX || 0;
    g += `<rect class="hl" x="${-rw/2}" y="${-rd/2}" width="${rw}" height="${rd}" rx="${Math.min(rw,rd)*0.05}" fill="${roofCol}" fill-opacity="${opts.deco?0.7:0.9}" stroke="${wallCol}" stroke-width="${sw*1.6}"/>`;
    g += `<rect x="${wx-ww/2}" y="${-wd/2}" width="${ww}" height="${wd}" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="${sw}" stroke-dasharray="${4*k} ${3*k}"/>`;
    g += `<path d="M${-rw/2} 0H${rw/2}" stroke="rgba(0,0,0,.3)" stroke-width="${sw}"/>`;
    if (sh.porch) g += `<rect x="${-sh.porch[0]/2}" y="${wd/2}" width="${sh.porch[0]}" height="${sh.porch[1]}" fill="${shade(wallCol, -0.1)}" stroke="rgba(0,0,0,.4)" stroke-width="${sw}"/>`;
  }
  if (opts.deco) g += `<path d="M${-w*0.3} ${-d*0.3}L${w*0.3} ${d*0.3}M${w*0.3} ${-d*0.3}L${-w*0.3} ${d*0.3}" stroke="rgba(0,0,0,.18)" stroke-width="${sw}"/>`;
  // дверь и стрелка наружу
  const dz = sh.door, dw = Math.max(0.9, Math.min(w, 3) * 0.35), dh = Math.max(0.35, 5*k), dx0 = (sh.entryX || 0);
  g += `<rect x="${dx0-dw/2}" y="${dz-dh*0.4}" width="${dw}" height="${dh}" fill="${opts.deco ? "#c9b27a" : "#f0c35a"}" stroke="rgba(60,35,5,.8)" stroke-width="${k}"/>`;
  const ay = dz + dh*0.6, al = Math.max(0.8, 10*k);
  g += `<path d="M${dx0} ${ay}L${dx0} ${ay+al}M${dx0-al*0.35} ${ay+al*0.6}L${dx0} ${ay+al}L${dx0+al*0.35} ${ay+al*0.6}" fill="none" stroke="${opts.deco ? "#8a7a5a" : "#b8860b"}" stroke-width="${Math.max(0.12, 2*k)}" stroke-linecap="round"/>`;
  if (opts.selected && !opts.deco){ const ez = sh.entry != null ? sh.entry : dz + 0.9; g += `<circle cx="${sh.entryX||0}" cy="${ez}" r="${Math.max(0.3, 5*k)}" fill="none" stroke="#b8860b" stroke-width="${k*1.5}" stroke-dasharray="${2*k} ${2*k}"/>`; }
  return g + `</g>`;
}

let nudgeTimer = null;
document.addEventListener("keydown", ev=>{
  const typing = ev.target && ev.target.closest ? ev.target.closest("input, textarea, select, [contenteditable]") : null;
  const mod = ev.ctrlKey || ev.metaKey;
  const key = ev.key;
  const lk = String(key||"").toLowerCase();
  // физическая клавиша (ev.code) или буква в латинской/русской раскладке
  const is = (code, ...letters)=> ev.code === code || letters.includes(lk);
  if (mod && is("KeyS", "s", "ы")){ ev.preventDefault(); saveToGame(false); return; }
  if (mod && is("KeyK", "k", "л")){ ev.preventDefault(); openPalette(); return; }
  if (!typing && (ui.pathDraw || ui.routeFor) && (key === "Enter" || key === "Escape")){
    ev.preventDefault();
    if (ui.pathDraw){ finishPath(); toast("Дорожка готова"); }
    if (ui.routeFor){ ui.routeFor = null; commit(); toast("Маршрут готов"); }
    render(); return;
  }
  if (!typing && ui.pathDraw && key === "Backspace"){
    ev.preventDefault();
    const p = state.paths.find(x=>x.id===ui.pathDraw); if (p && p.points.length){ p.points.pop(); commit(); renderCanvas(); }
    return;
  }
  if (key === "Escape"){
    if (document.getElementById("modalRoot").innerHTML){ if (sceneEd && sceneEd.pick){ sceneEd.pick = null; renderScene(); return; } if (dlg || sceneEd || mon || ste) closeModal(); else document.getElementById("modalRoot").innerHTML = ""; return; }
    if (typing){ ev.target.blur(); return; }
    if (ui.pick){ cancelPick(); return; }
    if (ui.menu){ ui.menu = false; renderTopbar(); return; }
    if (ui.tool !== "select"){ setTool("select"); return; }
    if (ui.sel || (ui.multi||[]).length){ ui.sel = null; ui.multi = []; render(); }
    return;
  }
  if (typing) return;
  if (mod && !ev.shiftKey && is("KeyZ", "z", "я")){ ev.preventDefault(); undo(); if (dlg) renderDialogue(); if (mon) renderMon(); if (ste) renderSkillTree(); return; }
  if (mod && ((ev.shiftKey && is("KeyZ", "z", "я")) || is("KeyY", "y", "н"))){ ev.preventDefault(); redo(); if (dlg) renderDialogue(); if (mon) renderMon(); return; }
  if (document.getElementById("modalRoot").innerHTML) return;
  if (mod && is("KeyD", "d", "в")){ ev.preventDefault(); if ((ui.multi||[]).length > 1) dupMulti(); else duplicateSel(); return; }
  if (mod && is("KeyC", "c", "с")){ ev.preventDefault(); copySel(false); return; }
  if (mod && is("KeyX", "x", "ч")){ ev.preventDefault(); copySel(true); return; }
  if (mod && is("KeyV", "v", "м")){ ev.preventDefault(); pasteClip(hover ? [hover.x, hover.z] : null); return; }
  if (mod && is("KeyA", "a", "ф")){ ev.preventDefault(); const l = objectsInRect(-1e9, -1e9, 1e9, 1e9); setMulti(l); render(); toast(`Выделено: ${l.length}`); return; }
  if (mod) return;
  if (key === " "){ spaceDown = true; ev.preventDefault(); return; }
  const sizes = [1,2,3,5];
  if (is("KeyV", "v", "м")){ setTool("select"); return; }
  if (is("KeyB", "b", "и")){ setTool("brush"); return; }
  if (is("BracketLeft", "[", "х")){ ui.brushSize = sizes[Math.max(0, sizes.indexOf(ui.brushSize)-1)]; saveUi(); renderToolbar(); renderOverlay(); return; }
  if (is("BracketRight", "]", "ъ")){ ui.brushSize = sizes[Math.min(sizes.length-1, sizes.indexOf(ui.brushSize)+1)]; saveUi(); renderToolbar(); renderOverlay(); return; }
  if (key === "Home"){ fitView(); renderCanvas(); return; }
  if (is("KeyF", "f", "а")){ const p = ui.sel && selPos(ui.sel); if (p){ const c = selCtx(ui.sel); if (c) openCtx(c); const v = getView(); v.cx = p[0]; v.cz = p[1]; render(); } return; }
  if (key === "Delete" || key === "Backspace"){
    if ((ui.multi||[]).length > 1){ ev.preventDefault(); deleteMulti(); return; }
    if (ui.sel && !["map","floor"].includes(ui.sel.type)){ ev.preventDefault(); deleteSel(ui.sel); }
    return;
  }
  if (key === "Enter"){ if (ui.sel) enterSel(ui.sel); return; }
  if (key === "?"){ openHelp(); return; }
  if (is("Backslash", "\\")){ toggleFocusMode(); return; }
  if (key === "/" || (ev.code === "Slash" && !ev.shiftKey)){ ev.preventDefault(); if (ui.hideL) togglePane("left"); const ts = document.getElementById("treeSearch"); ts.focus(); ts.select(); return; }
  if (ui.tool === "brush" && /^Digit[0-9]$/.test(ev.code) && !ev.shiftKey && !ev.altKey){
    const n = Number(ev.code.slice(5)), m = brushModes()[n === 0 ? 9 : n - 1];
    if (m){ ui.brush = m[0]; setTool("brush"); }
    return;
  }
  const arrows = {ArrowLeft:[-1,0], ArrowRight:[1,0], ArrowUp:[0,-1], ArrowDown:[0,1]};
  if (arrows[key] && (ui.multi||[]).length > 1){
    ev.preventDefault();
    const step = ev.shiftKey ? CELL : 0.5;
    selList().forEach(sl=> moveSelBy(sl, arrows[key][0]*step, arrows[key][1]*step));
    renderCanvas();
    clearTimeout(nudgeTimer); nudgeTimer = setTimeout(()=>{ commit(); render(); }, 450);
    return;
  }
  if (arrows[key] && ui.sel){
    const o = getSelObj(ui.sel);
    if (o && "x" in o && selCtx(ui.sel) && ctxKey(selCtx(ui.sel)) === ctxKey()){
      ev.preventDefault();
      const step = ev.shiftKey ? CELL : 0.5;
      o.x = round2(o.x + arrows[key][0]*step);
      o.z = round2(o.z + arrows[key][1]*step);
      renderCanvas(); renderInspector();
      clearTimeout(nudgeTimer); nudgeTimer = setTimeout(()=>{ commit(); render(); }, 450);
    }
  }
});

// Приводит данные к ожидаемой форме: старые сохранения, импорт, ручные правки JSON.
/* ---------- свои модели из Студии (раунд 91; игра: core/custom_models.gd) ----------
   state.customModels [{id, name, group, w, d, h, solid [[cx,cz,w,d]], round}] — только
   размеры для холста; форма — в models/<id>.json, её читает игра. Сюда попадают
   через «Файл → Свои модели из Студии…». В PROP_TYPES дописываются на ходу. */
const _customPropIds = new Set();
const _replacedOrig = {};   // раунд 93: тип игры -> исходная строка PROP_TYPES (до замены своей моделью)
function syncCustomProps(){
  for (let i = PROP_TYPES.length - 1; i >= 0; i--) if (_customPropIds.has(PROP_TYPES[i][0])) PROP_TYPES.splice(i, 1);
  _customPropIds.clear();
  for (const [t, row] of Object.entries(_replacedOrig)){ const i = PROP_TYPES.findIndex(x=>x[0]===t); if (i >= 0) PROP_TYPES[i] = row; delete _replacedOrig[t]; }
  (Array.isArray(state.customModels) ? state.customModels : []).forEach(m=>{
    if (!m || !m.id) return;
    const w = Number(m.w)||1, d = Number(m.d)||1;
    const fp = m.round ? [[0, 0, Math.min(w, d) / 2]] : (Array.isArray(m.solid) ? m.solid : []);
    if (m.replaces){
      // своя модель ВМЕСТО встроенной: отдельной строки нет, у встроенной — её размеры
      const i = PROP_TYPES.findIndex(x=>x[0]===m.replaces);
      if (i >= 0 && !_replacedOrig[m.replaces]){
        _replacedOrig[m.replaces] = PROP_TYPES[i];
        const row = PROP_TYPES[i].slice();
        if (m.name) row[1] = m.name;   // раунд 94: полная замена — одна строка с вашим именем
        row[3] = w; row[4] = d; row[6] = Number(m.h)||row[6]; row[7] = fp;
        PROP_TYPES[i] = row;
      }
      return;
    }
    if (PROP_TYPES.some(x=>x[0]===m.id)) return;
    PROP_TYPES.push([m.id, m.name || m.id, m.group || "Свои модели", w, d, 0, Number(m.h)||1, fp]);
    _customPropIds.add(m.id);
  });
}

  state.quests.forEach(q=>{ q.name = q.name || q.id; q.kind = q.kind || "side"; q.start = q.start && typeof q.start==="object" ? q.start : {trigger:"none"};
    q.stages = Array.isArray(q.stages) && q.stages.length ? q.stages : [{title:"Этап", text:"", objectives:[]}];
    q.stages.forEach(s=>{ s.objectives = Array.isArray(s.objectives) ? s.objectives : []; });
    q.reward = q.reward && typeof q.reward==="object" ? q.reward : {}; q.reward.items = Array.isArray(q.reward.items) ? q.reward.items : [];
    // встроенные задания, сохранённые до раунда 18, — без реплик: подставить из DEFAULT_QUESTS
    const dq = DEFAULT_QUESTS.find(d=>d.id===q.id);
    if (dq){
      ["offerText","acceptText","doneText"].forEach(k=>{ if (!String(q[k]||"").trim() && dq[k]) q[k] = dq[k]; });
      q.stages.forEach((s, si)=> s.objectives.forEach((o, oi)=>{ const d = ((dq.stages[si]||{}).objectives||[])[oi]; if (d && o.type==="turnin" && d.type==="turnin" && !String(o.say||"").trim() && d.say) o.say = d.say; }));
    } });
  if (!state.companionStart || typeof state.companionStart !== "object") state.companionStart = {inParty:false, area:"overworld", x:4, z:-3};
  // старт игрока (раунд 28): новая игра и возрождение без сохранений; только карты мира
  if (!state.playerStart || typeof state.playerStart !== "object" || !state.worldMaps[state.playerStart.area]) state.playerStart = {area: firstMapId(), x: 0, z: 0};
  state.biomes = Array.isArray(state.biomes) ? state.biomes : [];
  state.biomes.forEach(b=>{ b.weather = Array.isArray(b.weather) ? b.weather : []; b.treeTypes = Array.isArray(b.treeTypes) ? b.treeTypes : []; b.base = b.base || "meadow"; });
}
function start(initial){
  loadUi();
  applyLayout();
  let data = initial && Object.keys(initial).length ? initial : null;
  if (!data){
    for (const k of [LS_STATE, LS_STATE_V2]){
      try{ const raw = lsGet(k); if (raw){ const p = JSON.parse(raw); if (p && p.worldMaps){ data = p; break; } } }catch(e){}
    }
  }
  state = data || defaultState();
  repairState();
  baseline = JSON.stringify(state);
  if (lsGet(LS_SAVED) == null) lsSet(LS_SAVED, "");
  ui.pick = null; ui.menu = false; ui.sel = null; ui.nav = [];
  if (!ctxExists(ui.ctx)) ui.ctx = {kind:"map", id:firstMapId()};
  if (hasFS) idbGet("world").then(h=>{ if (h){ fileHandle = h; renderTopbar(); if (ui.autoGame) h.queryPermission({mode:"readwrite"}).then(p=>{ ui.autoGameBlocked = p !== "granted"; renderTopbar(); }).catch(()=>{}); } });
  requestAnimationFrame(()=> render());
  // IndexedDB свежее localStorage (большой мир туда уже не помещался) — взять оттуда
  if (!(initial && Object.keys(initial).length)) idbWork("get", "state").then(rec=>{
    const lsT = Number(lsGet(LS_STATE + "_t")) || 0;
    if (!rec || !rec.json || rec.t <= lsT || rec.json === JSON.stringify(state)) return;
    try{ state = JSON.parse(rec.json); repairState(); baseline = JSON.stringify(state); undoStack = []; redoStack = []; cellsRev++; if (!ctxExists(ui.ctx)) ui.ctx = {kind:"map", id:firstMapId()}; render(); }catch(e){}
  });
  setTimeout(()=> maybeBackup(JSON.stringify(state), true), 3000);   // копия того, с чем открыли
}
if (window.claude?.hot) window.claude.hot.snapshot(()=> state);
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? null);
window.addEventListener("beforeunload", ()=>{ commit(); saveWorkNow(); });
// вкладку свернули или переключились на игру — сохранить сразу, не дожидаясь паузы
document.addEventListener("visibilitychange", ()=>{ if (document.hidden && saveTimer){ clearTimeout(saveTimer); saveTimer = null; saveWorkNow(); } });
})();
</script>
