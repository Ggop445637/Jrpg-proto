/* ============================ дерево локаций ============================ */
function renderOutliner(){
  const el = document.getElementById("outliner");
  const q = ui.search.trim().toLowerCase();
  const tab = ui.tab || "world";
  const show = (t)=> !!q || tab === t;
  {
    const tb = document.getElementById("treeTabs");
    if (tb){
      tb.innerHTML = TREE_TABS.map(([id, l])=>`<button class="ttab ${tab===id && !q ? "on" : ""}" data-ttab="${id}">${l}</button>`).join("");
      tb.querySelectorAll("[data-ttab]").forEach(b=> b.onclick = ()=>{ ui.tab = b.dataset.ttab; if (ui.search){ ui.search = ""; document.getElementById("treeSearch").value = ""; } saveUi(); renderOutliner(); });
    }
  }
  const rows = [];   // {depth, sel, label, meta, glyph, kids:bool, key, ctx:bool}
  const match = (...parts)=> !q || parts.some(p=> String(p||"").toLowerCase().includes(q));

  const pushObj = (depth, sel, label, meta, g, extraMatch)=>{
    if (!match(label, meta, sel.id, extraMatch)) return false;
    rows.push({depth, sel, label, meta, glyph:g});
    return true;
  };
  // объекты места — по папкам (раунд 27): жители, сундуки, бои, дорожки, декор
  const areaChildren = (area, depth)=>{
    let any = false;
    const group = (key, title, gl, items, make)=>{
      if (!items.length) return;
      const gkey = `grp:${area}:${key}`;
      if (ui.collapsed[gkey] == null) ui.collapsed[gkey] = items.length > 10;
      const start = rows.length;
      rows.push({depth, sel:{type:"grp", id:gkey}, label:title, meta:`${items.length}`, glyph:gl, kids:true, key:gkey, grp:true});
      const cs = rows.length;
      let anyIn = false;
      items.forEach(x=>{ anyIn = make(x) || anyIn; });
      if (q && !anyIn){ rows.splice(start); return; }
      any = true;
      if (!q && ui.collapsed[gkey]) rows.splice(cs);
    };
    const BH = {wander:"бродит", patrol:"по маршруту", sit:"сидит"};
    group("npc", "Жители", glyph("npc"), state.npcs.filter(n=>n.area===area), n=> pushObj(depth+1, {type:"npc", id:n.id}, n.name, (n.behavior && BH[n.behavior.mode]) || "житель", glyph("npc", n.portraitColor)));
    group("cont", "Сундуки и горшки", glyph("chest"), state.containers.filter(c=>c.area===area), c=> pushObj(depth+1, {type:"container", id:c.id}, c.name, c.type==="chest"?"сундук":"горшок", glyph(c.type==="chest"?"chest":"pot")));
    group("battle", "Бои", glyph("battle"), state.battles.filter(b=>b.area===area), b=> pushObj(depth+1, {type:"battle", id:b.id}, b.name, "бой", glyph("battle"), b.monsters.map(m=>monsterName(m.type)).join(" ")));
    group("path", "Дорожки", glyph("path"), (state.paths||[]).filter(x=>x.area===area), x=> pushObj(depth+1, {type:"path", id:x.id}, PATH_KINDS_MAP[x.kind]||"Дорожка", "дорожка", glyph("path")));
    group("mech", "Механизмы", glyph("mech"), (state.mechs||[]).filter(x=>x.area===area), x=> pushObj(depth+1, {type:"mech", id:x.id}, mechName(x), (MECH_MAP[x.type]||[0,""])[1].toLowerCase(), glyph("mech", MECH_COLORS[x.type])));
    group("prop", "Декор", glyph("prop"), state.props.filter(x=>x.area===area), x=> pushObj(depth+1, {type:"prop", id:x.id}, propName(x.type), "декор", glyph("prop")));
    group("cat", "Золотые гусеницы", glyph("cat"), (state.caterpillars||[]).filter(x=>x.area===area), x=> pushObj(depth+1, {type:"cat", id:x.id}, x.note || "Золотая гусеница", CAT_SURF_RU[x.surface||"ground"], glyph("cat")));
    return any;
  };

  // раунд 57: миры (регионы) — верхний уровень, их пещеры и подкарты — внутри
  const mapRows = (mid, d)=>{
    const m = state.worldMaps[mid];
    const key = "map:"+mid;
    const start = rows.length;
    const root = d === 0;
    const header = {depth:d, sel:{type:"map", id:mid}, label:m.name||mid, meta:`${root ? "мир · " : m.dungeon ? "данж · " : ""}${cellCount(m.cells)} кл.`, glyph:glyph(m.dungeon?"dungeonmap":(m.isCave?"cavemap":"map")), kids:true, key, ctx: ui.ctx.kind==="map" && ui.ctx.id===mid, world: root};
    rows.push(header);
    const open = q || !ui.collapsed[key];
    let childAny = false;
    const childStart = rows.length;
    if (state.playerStart && state.playerStart.area===mid) childAny = pushObj(d+1, {type:"start", id:"player"}, "Старт игрока", "новая игра", glyph("start")) || childAny;
    state.houses.filter(h=>h.area===mid).forEach(h=>{
      if (h.type==="cave"){
        childAny = pushObj(d+1, {type:"house", id:h.id}, h.name, `→ ${mapName(h.targetMap)}`, glyph("cave")) || childAny;
        return;
      }
      const hkey = "house:"+h.id;
      const hRow = {depth:d+1, sel:{type:"house", id:h.id}, label:h.name, meta:`${(h.floors||[]).length} эт.`, glyph:glyph("house", h.wallColor), kids:true, key:hkey};
      const hIdx = rows.length;
      rows.push(hRow);
      let inner = false;
      const hOpen = q || !ui.collapsed[hkey];
      (h.floors||[]).forEach(f=>{
        const fRow = {depth:d+2, sel:{type:"floor", id:f.id}, label:f.name, meta: f.id===h.enterFloor ? "вход" : "", glyph:glyph("floor"), ctx: ui.ctx.kind==="floor" && ui.ctx.id===f.id};
        const fIdx = rows.length;
        rows.push(fRow);
        let finner = areaChildren(f.id, d+3);
        f.exits.forEach(e=>{ finner = pushObj(d+3, {type:"exit", floor:f.id, id:e.id}, e.label||e.id, e.target==="world"?"на улицу":"на этаж", glyph("exit")) || finner; });
        if (!finner && !match(f.name, f.id)) rows.splice(fIdx, 1); else inner = true;
      });
      if (!inner && !match(h.name, h.id)) rows.splice(hIdx); else { childAny = true; if (!hOpen) rows.splice(hIdx+1); }
    });
    allTransitions().filter(t=>t.map===mid).forEach(t=>{
      childAny = pushObj(d+1, {type:"transition", map:mid, key:t.key}, `Переход → ${mapName(t.portal.targetMap)}`, `клетка ${t.key}`, glyph("transition"), mapName(t.portal.targetMap)) || childAny;
    });
    state.towns.filter(t=>t.area===mid).forEach(t=>{
      childAny = pushObj(d+1, {type:"town", id:t.id}, t.name, "город", glyph("town")) || childAny;
    });
    childAny = areaChildren(mid, d+1) || childAny;
    // карты внутри этой (пещеры, подземелья, подрайоны)
    mapKids(mid).forEach(cid=>{ childAny = mapRows(cid, d+1) || childAny; });
    if (!childAny && !match(m.name, mid)) { rows.splice(start); return false; }
    if (!open) rows.splice(childStart);
    return true;
  };
  (show("world") ? mapRoots() : []).forEach(mid=> mapRows(mid, 0));

  // разговоры Лиры — отдельная ветка (к карте не привязаны, кроме «в месте»)
  if (show("story")) {
    const key = "talks";
    const start = rows.length;
    rows.push({depth:0, sel:{type:"talks"}, label:`${CompanionName} · разговоры`, meta:`${state.companionTalks.length}`, glyph:glyph("talk", CompanionColor), kids:true, key});
    const open = q || !ui.collapsed[key];
    let any = false;
    const childStart = rows.length;
    state.companionTalks.forEach(t=>{
      const meta = t.trigger==="event" ? "по событию" : (t.trigger==="place" ? "в месте" : "случайный");
      any = pushObj(1, {type:"talk", id:t.id}, t.title || t.id, meta, glyph("talk", CompanionColor), (t.nodes[0]||{}).text) || any;
    });
    if (!any && q) rows.splice(start); else if (!open) rows.splice(childStart);
  }
  // катсцены — своя ветка
  if (show("story")) {
    const key = "scenes";
    const start = rows.length;
    rows.push({depth:0, sel:{type:"scenes"}, label:"Сцены", meta:`${state.cutscenes.length}`, glyph:glyph("scene"), kids:true, key});
    const open = q || !ui.collapsed[key];
    let any = false;
    const childStart = rows.length;
    const TRIG = {talk:"по разговору", zone:"в месте", dialogue:"из диалога", event:"по событию", flag:"по отметке", manual:"вручную"};
    state.cutscenes.forEach(s=>{
      any = pushObj(1, {type:"scene", id:s.id}, s.name || s.id, TRIG[s.trigger] || "", glyph("scene"), (s.steps||[]).map(x=>x.text||"").join(" ")) || any;
    });
    if (!any && q) rows.splice(start); else if (!open) rows.splice(childStart);
  }
  // задания — своя ветка
  if (show("story")) {
    const key = "quests";
    const start = rows.length;
    rows.push({depth:0, sel:{type:"quests"}, label:"Задания", meta:`${state.quests.length}`, glyph:glyph("quest"), kids:true, key});
    const open = q || !ui.collapsed[key];
    let any = false;
    const childStart = rows.length;
    state.quests.forEach(x=>{
      any = pushObj(1, {type:"quest", id:x.id}, x.name || x.id, x.kind==="main" ? "сюжет" : (x.board ? "доска" : "побочное"), glyph("quest", x.kind==="main" ? "#e8c46c" : null), x.description||"") || any;
    });
    if (!any && q) rows.splice(start); else if (!open) rows.splice(childStart);
  }

  // ремёсла (раунд 46): рецепты алхимии и кузницы
  for (const kind of (show("items") ? ["alchemy", "forge"] : [])){
    const key = "crafts_" + kind;
    const list = craftList(kind);
    const start = rows.length;
    rows.push({depth:0, sel:{type:key}, label: kind==="alchemy" ? "Алхимия · рецепты" : "Кузница · рецепты", meta:`${list.length}`, glyph:glyph("craft", kind==="alchemy" ? "#6fd08a" : "#e8853a"), kids:true, key});
    if (ui.collapsed[key] == null) ui.collapsed[key] = true;
    const open = q || !ui.collapsed[key];
    let any = false;
    const childStart = rows.length;
    list.forEach(r=>{
      any = pushObj(1, {type:"recipe", id: kind + ":" + r.id}, craftResultName(kind, r.result), kind==="alchemy" ? `${r.lo}–${r.hi}°` : RARITIES[r.tier||0], glyph("craft", kind==="alchemy" ? craftColor(r) : "#e8853a"), (r.ingredients||[]).map(e=>itemName(e.itemId)).join(" ")) || any;
    });
    if (!any && q) rows.splice(start); else if (!open) rows.splice(childStart);
  }
  // ключи подземелий (раунд 45) — своя ветка
  if (show("items")) {
    const key = "keys";
    const start = rows.length;
    rows.push({depth:0, sel:{type:"keys"}, label:"Ключи", meta:`${(state.keys||[]).length}`, glyph:glyph("key"), kids:true, key});
    const open = q || !ui.collapsed[key];
    let any = false;
    const childStart = rows.length;
    (state.keys||[]).forEach(k=>{
      const doors = state.mechs.filter(m=>m.type==="door" && m.lock==="key" && m.keyId===k.id).length;
      any = pushObj(1, {type:"key", id:k.id}, k.name || k.id, doors ? `${doors} ${plural(doors,"дверь","двери","дверей")}` : "", glyph("key", validHex(k.color, "#d9a441"))) || any;
    });
    if (!any && q) rows.splice(start); else if (!open) rows.splice(childStart);

  }

  // раунд 49: ветки-справочники (приёмы, предметы, снаряжение, начало игры, отметки)
  const branch = (key, sel, label, g, list, rowOf, collapsedDefault)=>{
    const start = rows.length;
    rows.push({depth:0, sel, label, meta:`${list.length}`, glyph:g, kids:true, key});
    if (ui.collapsed[key] == null) ui.collapsed[key] = !!collapsedDefault;
    const open = q || !ui.collapsed[key];

  const ownMeta = (key, id, builtin)=> (state[key]||[]).some(x=>x.id===id) ? (builtin.some(x=>x.id===id) ? "изменено" : "своё") : "";
  if (show("story") && (!q || match("отметки счётчики флаги"))){
    const u = storyUsage();

  if (show("battle") && (!q || match("древо навыков очки ветки билд"))){
    const tn = o=> (treeOf(o)||{nodes:[]}).nodes.length;
    rows.push({depth:0, sel:{type:"skilltree"}, label:"Древо навыков", meta:`${tn("hero")} · ${tn("mage")}${treeOwn("hero")||treeOwn("mage") ? " · своё" : ""}`, glyph:glyph("skill")});
  }
  if (show("battle")){
    for (const [owner, label] of [["hero", "Приёмы героя"], ["mage", `Чары ${CompanionName}`], ["moth", `Пыльца ${MothName()}`]]){

// раунд 111: лестницы и мосты
const STAIRS_VEC = {n:[0,-1], s:[0,1], e:[1,0], w:[-1,0]};
const STAIRS_DIRS = [["auto","сама"], ["n","↑"], ["s","↓"], ["w","←"], ["e","→"]];
const BRIDGE_STYLES = [["stone","Каменный"], ["wood","Деревянный"], ["rope","Верёвочный"]];
const BRIDGE_HALF = {stone:1.8, wood:1.4, rope:1.1};
// сколько уровней лестница поднимает: до клетки, куда ведёт (как в игре, 1..4; 0 — никуда)
function stairsRise(cells, cx, cz){
  const c = cells[cellKey(cx, cz)], d = c && STAIRS_VEC[c.stairs];
  if (!d) return 0;
  const n = cells[cellKey(cx + d[0], cz + d[1])];
  const r = n ? (Number(n.elevation)||0) - (Number(c.elevation)||0) : 0;
  return r >= 1 ? Math.min(r, 4) : 0;
}
// мост вдоль X? — по той оси, где с обеих сторон опора на высоте настила (как BridgeKit.bridge_axis_x)
// раунд 112: мост бывает и НАД клеткой (over — уровень настила): по нему сверху, под ним снизу
function isBridgeCell(c){ return !!c && !!c.bridge && (!!c.chasm || c.over != null); }
function deckLevel(c){ return c.over != null ? Number(c.over)||0 : Number(c.elevation)||0; }
function bridgeFooting(cells, cx, cz, lvl){
  const c = cells[cellKey(cx, cz)];
  if (!c) return false;
  if (lvl == null) return !c.chasm || !!c.bridge;
  if (c.over != null && c.bridge) return Number(c.over) === lvl;
  const e = Number(c.elevation)||0;
  if (c.chasm) return !!c.bridge && Math.abs(e - lvl) <= 1;
  if (c.stairs){ const r = stairsRise(cells, cx, cz); return Math.abs(e - lvl) <= 1 || Math.abs(e + r - lvl) <= 1; }
  return Math.abs(e - lvl) <= 1;
}
function bridgeAxisX(cells, cx, cz){
  const lvl = deckLevel(cells[cellKey(cx, cz)] || {});
  const nx = (bridgeFooting(cells, cx-1, cz, lvl)?1:0) + (bridgeFooting(cells, cx+1, cz, lvl)?1:0);
  const nz = (bridgeFooting(cells, cx, cz-1, lvl)?1:0) + (bridgeFooting(cells, cx, cz+1, lvl)?1:0);
  return nx >= nz;
}
// кисть «Лестница»: направление — заданное или к самой высокой соседней клетке;
// клик по лестнице ещё раз — к следующей подходящей стороне
function paintStairs(cells, cx, cz, cur){
  const opts = ["n","e","s","w"].filter(dd=>{ const v = STAIRS_VEC[dd], n = cells[cellKey(cx+v[0], cz+v[1])]; return n && !n.chasm && (Number(n.elevation)||0) > (Number(cur.elevation)||0); });
  if (ui.stairsDir && ui.stairsDir !== "auto"){ cur.stairs = ui.stairsDir; delete cur.chasm; delete cur.bridge; return; }
  if (!opts.length){ toast("Лестница ведёт на клетку ВЫШЕ — поднимите соседнюю клетку (или выберите направление справа)"); return; }
  if (cur.stairs && opts.includes(cur.stairs)) cur.stairs = opts[(opts.indexOf(cur.stairs) + 1) % opts.length];
  else cur.stairs = opts.slice().sort((a, b)=>{ const va = STAIRS_VEC[a], vb = STAIRS_VEC[b]; return (Number((cells[cellKey(cx+vb[0],cz+vb[1])]||{}).elevation)||0) - (Number((cells[cellKey(cx+va[0],cz+va[1])]||{}).elevation)||0); })[0];
  delete cur.chasm; delete cur.bridge; delete cur.thicket;
}
// кисть «Мост»: над пропастью — высота клетки с берега; над обычной клеткой
// (улица, ров) — настил на высоте берега (over), под мостом можно пройти
function paintBridge(cells, cx, cz, cur){
  if (!cur.chasm){
    let lvl = null;
    for (const [dx, dz] of [[1,0],[-1,0],[0,1],[0,-1]]){ const n = cells[cellKey(cx+dx, cz+dz)]; if (n && n.over != null && n.bridge){ lvl = Number(n.over)||0; break; } }
    if (lvl === null) for (const [dx, dz] of [[1,0],[-1,0],[0,1],[0,-1]]){ const n = cells[cellKey(cx+dx, cz+dz)]; if (n && !n.chasm && n.over == null){ const e = Number(n.elevation)||0; if (lvl === null || e > lvl) lvl = e; } }
    if (lvl === null || lvl - (Number(cur.elevation)||0) < 2){ toast("Над этой клеткой мост не встанет: берег должен быть хотя бы на 2 уровня выше (иначе под мостом не пройти). Опустите клетку или нарисуйте пропасть."); return; }
    cur.bridge = ui.bridgeStyle || "stone"; cur.over = lvl; delete cur.stairs; delete cur.thicket;
    return;
  }
  cur.bridge = ui.bridgeStyle || "stone";
  let best = null;
  for (const [dx, dz] of [[1,0],[-1,0],[0,1],[0,-1]]){
    const n = cells[cellKey(cx+dx, cz+dz)];
    if (!n) continue;
    if (!n.chasm){ const e = Number(n.elevation)||0; if (best === null || e > best) best = e; }
  }
  if (best === null) for (const [dx, dz] of [[1,0],[-1,0],[0,1],[0,-1]]){ const n = cells[cellKey(cx+dx, cz+dz)]; if (n && n.chasm && n.bridge){ best = Number(n.elevation)||0; break; } }
  if (best !== null){ if (best) cur.elevation = best; else delete cur.elevation; }
}

/* ============================ вид холста ============================
   view = {cx, cz, scale} — центр в метрах и пикселей на метр. */
const svg = document.getElementById("mapSvg");
// размер холста берём из ResizeObserver (ниже): чтение getBoundingClientRect сразу
// после перерисовки панелей заставляло браузер пересчитывать всю раскладку
let _vp = null;
function vpSize(){ if (!_vp){ const r = svg.getBoundingClientRect(); if (!r.width || !r.height) return {w: Math.max(r.width, 60), h: Math.max(r.height, 60)}; _vp = {w: r.width, h: r.height}; } return {w: Math.max(_vp.w, 60), h: Math.max(_vp.h, 60)}; }
function computeFit(){
  const b = cellBounds(ctxCells());
  const x0 = (b.minCx-1)*CELL - CELL/2, x1 = (b.maxCx+1)*CELL + CELL/2;
  const z0 = (b.minCz-1)*CELL - CELL/2, z1 = (b.maxCz+1)*CELL + CELL/2;
  const s = vpSize();
  return {cx:(x0+x1)/2, cz:(z0+z1)/2, scale: clamp(Math.min(s.w/(x1-x0), s.h/(z1-z0)), 1.5, 90)};
}
function getView(){ const k = ctxKey(); if (!ui.views[k]) ui.views[k] = computeFit(); return ui.views[k]; }
function fitView(){ ui.views[ctxKey()] = computeFit(); }
function viewBox(){ const v = getView(), s = vpSize(); const w = s.w/v.scale, h = s.h/v.scale; return {x:v.cx-w/2, y:v.cz-h/2, w, h}; }
function toWorld(clientX, clientY){
  const r = svg.getBoundingClientRect(), v = getView(), vb = viewBox();
  return [vb.x + (clientX - r.left)/v.scale, vb.y + (clientY - r.top)/v.scale];
}
function zoomAt(factor, clientX, clientY){
  const v = getView();
  const r = svg.getBoundingClientRect();
  const px = clientX==null ? r.left + r.width/2 : clientX;
  const py = clientY==null ? r.top + r.height/2 : clientY;
  const [wx, wz] = toWorld(px, py);
  const ns = clamp(v.scale*factor, 1.5, 120);
  v.cx = wx - (px - r.left - r.width/2)/ns;
  v.cz = wz - (py - r.top - r.height/2)/ns;
  v.scale = ns;
  requestCanvas();
}
function focusOn(x, z){
  const v = getView(), vb = viewBox();
  const mx = vb.w*0.15, mz = vb.h*0.15;
  if (x < vb.x+mx || x > vb.x+vb.w-mx || z < vb.y+mz || z > vb.y+vb.h-mz){ v.cx = x; v.cz = z; }
}
let canvasQueued = false;
function requestCanvas(){ if (canvasQueued) return; canvasQueued = true; requestAnimationFrame(()=>{ canvasQueued = false; renderCanvas(); }); }

/* ============================ отрисовка карты ============================ */
const TERRAIN = {
  safe: "#7da36e", danger: "#9a7f5f",
  caveSafe: "#b7ad9c", caveDanger: "#978b79",
  dungSafe: "#a7a39b", dungDanger: "#88837a",

function elevShade(e){ return e>0 ? Math.min(0.09*e, 0.5) : (e<0 ? Math.max(-0.12*Math.abs(e), -0.6) : 0); }
function cellFill(cell){
  const e = (cell && cell.elevation) || 0;
  if (isFloorCtx()){
    const f = findFloor(ui.ctx.id).floor;
    let c = shade(validHex(f.floorColor, "#40352a"), elevShade(e) + 0.12);
    return c;
  }
  const m = state.worldMaps[ui.ctx.id];
  const safe = cell && cell.zone === "safe";
  let base = m.dungeon ? (safe ? TERRAIN.dungSafe : TERRAIN.dungDanger) : m.isCave ? (safe ? TERRAIN.caveSafe : TERRAIN.caveDanger) : (safe ? TERRAIN.safe : TERRAIN.danger);

  if (cell && cell.deco && DECO_COLORS[cell.deco]) base = DECO_COLORS[cell.deco];

}

      const w = Math.max(h.sizeW||3, 10*k), d = Math.max(h.sizeD||3, 10*k);
      if (h.type==="cave"){
        const lk = lookOf(h);
        const lkName = (PASSAGE_LOOKS.find(l=>l[0]===lk)||[0,""])[1];
        const pc = PASSAGE_COLORS[lk] || validHex(h.wallColor,"#66615c");
        let shape;
        if (lk === "hole") shape = `<circle class="hl" cx="${h.x}" cy="${h.z}" r="${Math.min(w,d)/2}" fill="#0c0a09" stroke="#6a5540" stroke-width="${(3*k).toFixed(3)}"/>`;
        else if (lk === "gate" || lk === "crypt") shape = `<rect class="hl" x="${h.x-w/2}" y="${h.z-d/2}" width="${w}" height="${d}" rx="${(3*k).toFixed(3)}" fill="${pc}" stroke="rgba(20,15,10,.8)" stroke-width="${(1.4*k).toFixed(3)}"/><path d="M${h.x-w*0.22} ${h.z+d/2}V${h.z+d*0.1}a${w*0.22} ${w*0.22} 0 0 1 ${w*0.44} 0V${h.z+d/2}z" fill="#141112"/>`;
        else if (lk === "stairs_up" || lk === "stairs_down") shape = `<rect class="hl" x="${h.x-w/2}" y="${h.z-d/2}" width="${w}" height="${d}" fill="${pc}" stroke="rgba(20,15,10,.8)" stroke-width="${(1.4*k).toFixed(3)}"/>` + [0,1,2,3].map(i=>`<rect x="${h.x-w*0.35}" y="${h.z-d/2+d*(0.12+i*0.2)}" width="${w*0.7}" height="${d*0.12}" fill="${lk==="stairs_up" ? shade(pc, 0.1*i) : shade(pc, -0.18*i)}"/>`).join("");
        else if (lk === "rope") shape = `<circle class="hl" cx="${h.x}" cy="${h.z}" r="${Math.max(w,d)/2}" fill="rgba(255,236,170,.55)" stroke="#b89c5a" stroke-width="${(1.4*k).toFixed(3)}"/><circle cx="${h.x}" cy="${h.z}" r="${Math.max(0.12, 2*k)}" fill="#6b4a2a"/>`;
        else shape = `<ellipse class="hl" cx="${h.x}" cy="${h.z}" rx="${w/2}" ry="${d/2}" fill="${lk==="cave_exit" ? pc : validHex(h.wallColor,"#66615c")}" stroke="rgba(20,15,10,.7)" stroke-width="${(1.4*k).toFixed(3)}"/><path d="M${h.x-w*0.22} ${h.z+d/2}V${h.z+d*0.1}a${w*0.22} ${w*0.22} 0 0 1 ${w*0.44} 0V${h.z+d/2}z" fill="${lk==="cave_exit" ? "#fff3c8" : "#141112"}"/>`;
        s += `<g class="obj" data-obj="house" data-id="${esc(h.id)}" title="${esc(lkName)}">
          ${shape}
          ${isSel(sel) ? ring(h.x, h.z, Math.max(w,d)*0.75) : ""}
          ${lab(h.x, h.z + d/2 + 13*k, h.name, 12, 700)}
          ${lab(h.x, h.z + d/2 + 26*k, `→ ${mapName(h.targetMap)}`, 10.5, 500)}
        </g>`;
      } else {
        // повёрнутый на восток/запад дом — пятно поворачивается; дверь — жёлтая метка на своей стороне
        const fc = h.facing || "south";
        const side = fc==="east" || fc==="west";
        const hw = side ? d : w, hd = side ? w : d;
        const dm = Math.max(0.45,5*k), dl = (side ? hd : hw)*0.24;
        const door = fc==="south" ? [h.x-dl/2, h.z+hd/2-dm*0.35, dl, dm] : fc==="north" ? [h.x-dl/2, h.z-hd/2-dm*0.65, dl, dm] : fc==="east" ? [h.x+hw/2-dm*0.35, h.z-dl/2, dm, dl] : [h.x-hw/2-dm*0.65, h.z-dl/2, dm, dl];
        // силуэт как в игре: свес крыши, крыльцо, круглые башни; дверь со стрелкой
        s += `<g class="obj" data-obj="house" data-id="${esc(h.id)}">
          ${houseSvg(h.style||"cottage", h.x, h.z, h.sizeW||3, h.sizeD||3, FACING_DEG[fc]||0, validHex(h.wallColor,"#7a6a52"), validHex(h.roofColor,"#4a2f22"), k, {selected: isSel(sel)})}
          ${isSel(sel) ? ring(h.x, h.z, Math.max(w,d)*0.8) : ""}
          ${lab(h.x, h.z + d/2 + 15*k, h.name, 12, 700)}
        </g>`;
      }
    });
  }

  // города (точки свитка возвращения)
  if (!floor){
    state.towns.filter(t=>t.area===ui.ctx.id).forEach(t=>{
      const sel = {type:"town", id:t.id};
      const r = minR(0.9, 10);
      s += `<g class="obj" data-obj="town" data-id="${esc(t.id)}">
        <circle class="hl" cx="${t.x}" cy="${t.z}" r="${r}" fill="rgba(232,196,108,.25)" stroke="#e0b24a" stroke-width="${(2*k).toFixed(3)}"/>
        <path d="M${t.x-r*0.6} ${t.z+r*0.45}V${t.z-r*0.05}l${r*0.3} ${-r*0.3}l${r*0.3} ${r*0.3}V${t.z+r*0.45}zM${t.x} ${t.z+r*0.45}V${t.z-r*0.2}l${r*0.3} ${-r*0.35}l${r*0.3} ${r*0.35}V${t.z+r*0.45}z" fill="#e8c46c" stroke="rgba(70,45,10,.8)" stroke-width="${k}"/>
        ${isSel(sel) ? ring(t.x, t.z, r*1.5) : ""}
        ${lab(t.x, t.z - r - 5*k, t.name, 12, 700)}
      </g>`;
    });
  }

  // раунд 122: золотые гусеницы (в игре видно только вблизи)
  (state.caterpillars||[]).filter(c=>c.area===ui.ctx.id).forEach(c=>{
    const sel = {type:"cat", id:c.id};
    const r = minR(0.45, 7);
    const sf = c.surface || "ground";
    s += `<g class="obj" data-obj="cat" data-id="${esc(c.id)}">
      <circle class="hl" cx="${c.x}" cy="${c.z}" r="${r*1.5}" fill="rgba(242,194,74,.18)" stroke="#f2c24a" stroke-width="${(1.4*k).toFixed(3)}" ${sf==="ground" ? "" : `stroke-dasharray="${(3*k).toFixed(2)}"`}/>
      ${[0,1,2,3].map(i=>`<circle cx="${(c.x - r*0.9 + i*r*0.6).toFixed(3)}" cy="${(c.z + (i%2 ? -r*0.18 : r*0.1)).toFixed(3)}" r="${(r*0.42).toFixed(3)}" fill="${i%2 ? "#f2c24a" : "#c97f22"}" stroke="rgba(70,45,10,.8)" stroke-width="${(0.6*k).toFixed(3)}"/>`).join("")}
      ${sf!=="ground" ? `<text x="${c.x + r*1.2}" y="${c.z - r*0.9}" font-size="${(10*k).toFixed(2)}" fill="#f2c24a">${sf==="wall" ? "▮" : "▲"}</text>` : ""}
      ${isSel(sel) ? ring(c.x, c.z, r*1.9) : ""}
    </g>`;
  });

  // разговоры Лиры «в месте»: круг срабатывания
  state.companionTalks.filter(t=>t.trigger==="place" && t.area===ui.ctx.id).forEach(t=>{
    const sel = {type:"talk", id:t.id};
    const rad = Math.max(Number(t.radius)||0, 0);
    const r = minR(0.7, 9);
    s += `<g class="obj" data-obj="talk" data-id="${esc(t.id)}">
      ${rad > 0 ? `<circle cx="${t.x}" cy="${t.z}" r="${rad}" fill="${CompanionColor}22" stroke="${CompanionColor}" stroke-width="${Math.max(0.1, 1.6*k).toFixed(3)}" stroke-dasharray="${Math.max(0.5,6*k).toFixed(3)} ${Math.max(0.4,4*k).toFixed(3)}"/>` : ""}
      <circle class="hl" cx="${t.x}" cy="${t.z}" r="${r}" fill="${CompanionColor}" stroke="rgba(20,10,30,.7)" stroke-width="${(1.4*k).toFixed(3)}"/>
      <text class="onfill" x="${t.x}" y="${t.z + r*0.4}" font-size="${(r*1.1).toFixed(3)}" text-anchor="middle" font-weight="700" style="fill:#fff">…</text>
      ${isSel(sel) ? ring(t.x, t.z, r*1.9) : ""}
      ${lab(t.x, t.z - r - 5*k, t.title || t.id, 11.5, 600)}
    </g>`;
  });

  // дорожки (раунд 26): лента по точкам; у выбранной — точки, их можно тянуть
  (state.paths||[]).filter(p=>p.area===ui.ctx.id).forEach(p=>{
    const sel = {type:"path", id:p.id};
    if (!p.points.length) return;
    const d = p.points.map((pt,i)=>`${i?"L":"M"}${pt.x} ${pt.z}`).join(" ");
    const col = PATH_COLORS[p.kind] || "#9a7a52";
    const w = Math.max(Number(p.width)||1.8, 4*k);
    const zc = p.zone==="safe" ? "#3fae5f" : p.zone==="danger" ? "#c9463a" : "";
    s += `<g class="obj" data-obj="path" data-id="${esc(p.id)}">
      ${zc ? `<path d="${d}" fill="none" stroke="${zc}" stroke-opacity=".85" stroke-width="${w + Math.max(0.35, 6*k)}" stroke-linecap="round" stroke-linejoin="round"/>` : ""}
      <path class="hl" d="${d}" fill="none" stroke="${col}" stroke-opacity=".9" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>
      ${p.zone==="danger" ? `<path d="${d}" fill="none" stroke="url(#pDanger)" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>` : ""}
      <path d="${d}" fill="none" stroke="rgba(0,0,0,.25)" stroke-width="${(1.2*k).toFixed(3)}" stroke-dasharray="${(4*k).toFixed(3)} ${(4*k).toFixed(3)}"/>
    </g>`;
    if (isSel(sel) || ui.pathDraw === p.id){
      p.points.forEach((pt,i)=>{ s += `<circle data-obj="pathpt" data-id="${esc(p.id)}" data-i="${i}" cx="${pt.x}" cy="${pt.z}" r="${Math.max(0.35, 5*k)}" fill="#fff" stroke="var(--accent)" stroke-width="${(2*k).toFixed(3)}" style="cursor:move"/>`; });
      s += lab(p.points[0].x, p.points[0].z - 8*k, (PATH_KINDS_MAP[p.kind]||"Дорожка") + (p.zone==="safe" ? " · безопасно" : p.zone==="danger" ? " · опасно" : ""), 11, 600);
    }
  });
  // выбранный житель: где бродит / маршрут
  if (ui.sel && ui.sel.type==="npc"){
    const n = state.npcs.find(x=>x.id===ui.sel.id);
    const bh = n && n.behavior;
    if (n && n.area===ui.ctx.id && bh){
      if (bh.mode==="wander") s += `<circle cx="${n.x}" cy="${n.z}" r="${Number(bh.radius)||4}" fill="rgba(90,160,230,.10)" stroke="#4d86e8" stroke-width="${(1.6*k).toFixed(3)}" stroke-dasharray="${(5*k).toFixed(3)} ${(4*k).toFixed(3)}"/>`;
      if (bh.mode==="patrol" && (bh.points||[]).length){
        const pts = bh.points;
        s += `<path d="${pts.map((pt,i)=>`${i?"L":"M"}${pt.x} ${pt.z}`).join(" ")} Z" fill="none" stroke="#4d86e8" stroke-width="${(2*k).toFixed(3)}" stroke-dasharray="${(6*k).toFixed(3)} ${(4*k).toFixed(3)}"/>`;
        pts.forEach((pt,i)=>{ s += `<circle data-obj="routept" data-id="${esc(n.id)}" data-i="${i}" cx="${pt.x}" cy="${pt.z}" r="${Math.max(0.35, 6*k)}" fill="#4d86e8" stroke="#fff" stroke-width="${(1.5*k).toFixed(3)}" style="cursor:move"/>` + (ui.showLabels ? `<text x="${pt.x}" y="${pt.z + 3.5*k}" font-size="${fs(9)}" text-anchor="middle" fill="#fff" style="stroke-width:0" pointer-events="none">${i+1}</text>` : ""); });
      }
    }
  }
  // декор: деревья, камни, мебель (контур — твёрдое пятно в игре)
  state.props.filter(o=>o.area===ui.ctx.id).forEach(o=>{
    const sel = {type:"prop", id:o.id};
    const t = PROP_TYPES.find(x=>x[0]===o.type) || ["", "", "", 0.6, 0.6];
    const sc = Number(o.scale)||1;
    const pw = Math.max(Number(t[3])*sc, 6*k), pd = Math.max(Number(t[4])*sc, 6*k);
    const tree = /tree|cactus|bush|hedge|mushroom/.test(o.type);
    const grp = t[2] || "";
    const col = tree ? (o.type==="cactus" ? "#6a9a4a" : (o.type==="mushroom_giant" ? "#8a55c0" : "#3f7a3a"))
      : (/rock|well|stone|ruin|menhir|obelisk|statue|gate|fountain/.test(o.type) ? "#8d877d"
      : (/bone|skull|ribcage/.test(o.type) ? "#e6dcc4" : (o.type==="crystal" ? "#8fc8ff" : (grp.startsWith("Дома") ? "#b0785a" : "#a07a4a"))));
    if (grp.startsWith("Дома")){
      const st = HOUSE_STYLES.find(x=>x[0]===o.type.replace("house_","")) || HOUSE_STYLES[0];
      s += `<g class="obj" data-obj="prop" data-id="${esc(o.id)}">
        ${houseSvg(st[0], o.x, o.z, Number(t[3])*sc, Number(t[4])*sc, Number(o.rot)||0, st[2], st[3], k, {deco:true})}
        ${isSel(sel) ? ring(o.x, o.z, Math.max(pw,pd)*0.8 + 0.3) : ""}
        ${isSel(sel) ? lab(o.x, o.z - Math.max(pw,pd)/2 - 8*k, propName(o.type) + " · декорация, войти нельзя", 11, 600) : ""}
      </g>`;
      return;
    }
    s += `<g class="obj" data-obj="prop" data-id="${esc(o.id)}">
      ${propSvg(o, k)}
      ${isSel(sel) ? ring(o.x, o.z, Math.max(pw,pd)*0.9 + 0.3) : ""}
      ${isSel(sel) ? lab(o.x, o.z - Math.max(pw,pd)/2 - 6*k, propName(o.type), 11, 600) : ""}
    </g>`;
  });

  // механизмы (раунд 45): клетки ловушек/дверей, значки, связи рычаг → цель
  { const here = (state.mechs||[]).filter(m=>m.area===ui.ctx.id);
    const selMech = ui.sel && ui.sel.type==="mech" ? here.find(m=>m.id===ui.sel.id) : null;
    // связи: пунктир от рычага/плиты к двери/мосту/ловушке
    here.forEach(t=>{ (t.needs||[]).forEach((n, i)=>{
      const src = here.find(m=>m.id===n); if (!src) return;
      const [ax, az] = mechPos(src), [bx, bz] = mechPos(t);
      const hot = selMech && (selMech===t || selMech===src);
      const col = MECH_TRAPS.includes(t.type) ? "#6ac04a" : "#d9a441";
      s += `<g style="pointer-events:none"><line x1="${ax}" y1="${az}" x2="${bx}" y2="${bz}" stroke="${col}" stroke-opacity="${hot?0.95:0.4}" stroke-width="${Math.max(0.08,(hot?2.4:1.3)*k).toFixed(3)}" stroke-dasharray="${Math.max(0.4,5*k).toFixed(3)} ${Math.max(0.3,3*k).toFixed(3)}"/>
        ${t.mode==="order" && hot ? `<text x="${(ax+bx)/2}" y="${(az+bz)/2}" font-size="${fs(12)}" text-anchor="middle" font-weight="800" style="fill:${col};stroke-width:${(3*k).toFixed(3)}px">${i+1}</text>` : ""}</g>`;
    }); });
    here.forEach(m=>{
      const sel = {type:"mech", id:m.id}, col = MECH_COLORS[m.type] || "#888";
      const [x, z] = mechPos(m);
      const r = minR(0.5, 7), sw = (1.3*k).toFixed(3);
      let body = "";
      const cellRect = (fill, stroke, dash)=> `<rect x="${x-CELL/2+0.25}" y="${z-CELL/2+0.25}" width="${CELL-0.5}" height="${CELL-0.5}" fill="${fill}" stroke="${stroke}" stroke-width="${Math.max(0.08,1.4*k).toFixed(3)}" ${dash?`stroke-dasharray="${Math.max(0.4,4*k).toFixed(3)} ${Math.max(0.3,3*k).toFixed(3)}"`:""}/>`;
      switch (m.type){
        case "door": {
          const [cx, cz] = cellOf(m.x, m.z), cells = ctxCells();
          const ew = !!(cells[cellKey(cx-1,cz)] || cells[cellKey(cx+1,cz)]), ns = !!(cells[cellKey(cx,cz-1)] || cells[cellKey(cx,cz+1)]);
          const acrossX = m.axis==="x" ? true : m.axis==="z" ? false : !(ew && !ns);
          const dc = m.style==="door" ? "#7a5230" : m.style==="stone" ? "#8a8680" : "#55565e";
          body = acrossX ? `<rect class="hl" x="${x-CELL/2}" y="${z-0.45}" width="${CELL}" height="0.9" fill="${dc}" stroke="#fff" stroke-width="${sw}"/>`
                         : `<rect class="hl" x="${x-0.45}" y="${z-CELL/2}" width="0.9" height="${CELL}" fill="${dc}" stroke="#fff" stroke-width="${sw}"/>`;
          if (m.lock==="key"){ const kc = validHex(((state.keys||[]).find(q=>q.id===m.keyId)||{}).color, "#d9a441"); body += `<circle cx="${x}" cy="${z}" r="${r*0.8}" fill="${kc}" stroke="#1b1720" stroke-width="${sw}"/>`; }
          break;
        }
        case "lift": {
          const up = Number(m.up)||0, rideL = m.control === "ride";
          body = cellRect(rideL ? "rgba(140,100,60,.35)" : "rgba(106,208,255,.14)", "#6ad0ff", rideL) + `<rect class="hl" x="${x-CELL/2+0.9}" y="${z-CELL/2+0.9}" width="${CELL-1.8}" height="${CELL-1.8}" fill="none" stroke="#6ad0ff" stroke-width="${Math.max(0.1,2*k).toFixed(3)}"/>`
            + `<text x="${x}" y="${z + r*0.45}" font-size="${(r*1.3).toFixed(3)}" text-anchor="middle" font-weight="800" style="fill:#dff4ff">${up >= 0 ? "▲" : "▼"}${Math.abs(up)}</text>`;
          break;
        }
        case "bridge": body = (m.collapse ? cellRect("rgba(200,60,40,.18)", "#e05545", true) : (ctxCells()[cellKey(...cellOf(m.x, m.z))]||{}).chasm ? "" : cellRect("rgba(0,0,0,.72)", "#7a5a3a")) + `<rect class="hl" x="${x-1.2}" y="${z-CELL/2+0.3}" width="2.4" height="${CELL-0.6}" fill="none" stroke="#c8a070" stroke-width="${Math.max(0.08,1.6*k).toFixed(3)}" stroke-dasharray="${Math.max(0.3,3*k).toFixed(3)} ${Math.max(0.3,2*k).toFixed(3)}"/>`; break;
        case "spikes": body = cellRect("rgba(200,200,210,.18)", "#c0c0c8") + [...Array(9)].map((_,i)=>`<path d="M${x-1.6+(i%3)*1.6-0.35} ${z-1.6+Math.floor(i/3)*1.6+0.3}l0.35-0.7 0.35 0.7z" fill="#e0e0e8"/>`).join("") + `<circle class="hl" cx="${x}" cy="${z}" r="${r*0.2}" fill="none"/>`; break;
        case "rocks": body = cellRect("rgba(140,100,70,.16)", "#8a6a4a", true) + `<circle class="hl" cx="${x}" cy="${z}" r="${r}" fill="#8a6a4a" stroke="#fff" stroke-width="${sw}"/><circle cx="${x-r*0.25}" cy="${z-r*0.2}" r="${r*0.35}" fill="#5a4636"/>`; break;
        case "poison": body = cellRect("rgba(106,192,74,.3)", "#6ac04a") + `<circle class="hl" cx="${x}" cy="${z}" r="${r}" fill="#6ac04a" stroke="#fff" stroke-width="${sw}"/>`; break;
        case "secret": body = cellRect("rgba(40,34,30,.85)", "#b0a090", true) + `<text class="hl" x="${x}" y="${z + r*0.5}" font-size="${(r*1.6).toFixed(3)}" text-anchor="middle" font-weight="800" style="fill:#e8c46c">?</text>`; break;
        case "plate": body = `<rect class="hl" x="${x-1}" y="${z-1}" width="2" height="2" rx="0.2" fill="#3a4a5a" stroke="${col}" stroke-width="${Math.max(0.1,2*k).toFixed(3)}"/><rect x="${x-0.45}" y="${z-0.45}" width="0.9" height="0.9" transform="rotate(45 ${x} ${z})" fill="${col}"/>`; break;
        case "block": body = `<rect class="hl" x="${x-1.1}" y="${z-1.1}" width="2.2" height="2.2" fill="#8a8680" stroke="#fff" stroke-width="${sw}"/><rect x="${x-0.35}" y="${z-0.35}" width="0.7" height="0.7" transform="rotate(45 ${x} ${z})" fill="#6ab0e8"/>`; break;
        case "arrows": {
          const dv = {south:[0,1], north:[0,-1], east:[1,0], west:[-1,0]}[m.dir||"south"] || [0,1];
          const len = (Number(m.range)||5) * CELL;
          body = `<line x1="${x}" y1="${z}" x2="${x+dv[0]*len}" y2="${z+dv[1]*len}" stroke="#e05545" stroke-opacity=".55" stroke-width="${Math.max(0.08,1.4*k).toFixed(3)}" stroke-dasharray="${Math.max(0.5,6*k).toFixed(3)} ${Math.max(0.3,3*k).toFixed(3)}"/>
            <rect class="hl" x="${x-0.6}" y="${z-0.6}" width="1.2" height="1.2" fill="${col}" stroke="#fff" stroke-width="${sw}"/><path d="M${x+dv[0]*0.3-dv[1]*0.3} ${z+dv[1]*0.3+dv[0]*0.3}L${x+dv[0]*1.2} ${z+dv[1]*1.2}L${x+dv[0]*0.3+dv[1]*0.3} ${z+dv[1]*0.3-dv[0]*0.3}" fill="#fff"/>`;
          break;
        }
        case "lever": { const on = false; body = `<circle class="hl" cx="${x}" cy="${z}" r="${r}" fill="#3a3530" stroke="${col}" stroke-width="${Math.max(0.1,2*k).toFixed(3)}"/><path d="M${x} ${z+r*0.4}L${x+r*0.5} ${z-r*0.6}" stroke="${col}" stroke-width="${(r*0.28).toFixed(3)}" stroke-linecap="round"/><circle cx="${x+r*0.5}" cy="${z-r*0.6}" r="${r*0.3}" fill="#e05545"/>`; break; }
        case "stash": body = `<path class="hl" d="M${x} ${z-r}L${x+r*0.3} ${z-r*0.3}L${x+r} ${z}L${x+r*0.3} ${z+r*0.3}L${x} ${z+r}L${x-r*0.3} ${z+r*0.3}L${x-r} ${z}L${x-r*0.3} ${z-r*0.3}z" fill="${col}" stroke="#5a3b12" stroke-width="${sw}"/>`; break;

  const cells = ctxCells(), key = cellKey(cx,cz), cur = cells[key], floor = isFloorCtx();
  switch (mode){
    case "land": if (!cur) cells[key] = floor ? {elevation:0} : {}; break;
    case "erase":
      if (cur){
        delete cells[key];
        if (ui.sel && ui.sel.type==="transition" && ui.sel.map===ui.ctx.id && ui.sel.key===key) ui.sel = null;
      }
      break;
    case "raise": if (cur) cur.elevation = clamp((cur.elevation||0)+(ui.raiseStep||1), -50, 50); break;
    case "lower": if (cur) cur.elevation = clamp((cur.elevation||0)-(ui.raiseStep||1), -50, 50); break;
    case "level": if (cur) cur.elevation = ui.levelValue; break;
    case "safe": if (cur){ if (floor) delete cur.zone; else cur.zone = "safe"; } break;
    case "danger": if (cur) cur.zone = "danger"; break;
    case "deco": if (cur){ const d = ui.decoType == null ? "path" : ui.decoType; if (d) cur.deco = d; else delete cur.deco; } break;
    case "undeco": if (cur) delete cur.deco; break;
    case "clear": if (cur && !floor) cur.clear = true; break;
    case "unclear": if (cur) delete cur.clear; break;
    case "cliff": if (cur && !floor) cur.cliff = true; break;
    case "uncliff": if (cur) delete cur.cliff; break;
    case "thicket": if (cur && !floor) cur.thicket = true; break;
    case "unthicket": if (cur) delete cur.thicket; break;
    case "chasm": if (cur && !floor){ cur.chasm = true; delete cur.thicket; delete cur.stairs; } break;
    case "unchasm": if (cur){ delete cur.chasm; delete cur.bridge; } break;
    case "stairs": if (cur && !floor) paintStairs(cells, cx, cz, cur); break;
    case "unstairs": if (cur) delete cur.stairs; break;
    case "bridge": if (cur && !floor) paintBridge(cells, cx, cz, cur); break;
    case "unbridge": if (cur){ delete cur.bridge; delete cur.over; } break;
  }
}

function placeAt(x, z, cx, cz, keep){
  const area = ui.ctx.id;
  const sx = snap(x), sz = snap(z);
  let sel = null, note = "";
  switch (ui.place){
    case "npc": sel = addNpc(sx, sz, area); break;
    case "house": sel = addHouse(sx, sz, area); note = "Дом создан. Двойной клик по нему — зайти внутрь и нарисовать комнаты."; break;
    case "cave": { sel = addCave(sx, sz, area); const h = getSelObj(sel); note = `Создана карта «${mapName(h.targetMap)}» с выходом обратно. Двойной клик по пещере — перейти туда.`; break; }
    case "dungeon": { sel = addDungeon(sx, sz, area, ui.dungeonLook || "gate"); const h = getSelObj(sel); note = `Создано подземелье «${mapName(h.targetMap)}» с выходом обратно. Вид входа — справа, двойной клик — внутрь.`; break; }
    case "chest": case "pot": sel = addContainer(sx, sz, area, ui.place); break;
    case "exit": sel = addExit(sx, sz, area); break;
    case "cat": sel = addCat(Math.round(x*10)/10, Math.round(z*10)/10, area); note = "Золотая гусеница спрятана. В игре её видно только вблизи. Справа — где она сидит: на земле, на стене или высоко."; break;
    case "town": sel = addTown(sx, sz, area); note = "Город создан. Свиток возвращения переносит в ближайший город (по переходам между картами)."; break;
    case "battle": sel = addBattle(cellCenter(cx,cz)[0], cellCenter(cx,cz)[1], area); note = "Заготовленный бой: справа выберите монстров и награду. Игрок вступит в бой, как только зайдёт на эту клетку (или в круг)."; break;
    case "prop": sel = addProp(sx, sz, area); keep = true; break;
    case "mech": {
      const mt = ui.mechType || "lever";
      if (mechIsCell(mt) && !ctxCells()[cellKey(cx, cz)]){ toast("Этот механизм ставится на клетку земли — сначала нарисуйте её"); return; }
      sel = addMech(sx, sz, area, mt); keep = true;
      if (["door","bridge"].includes(mt)) note = "Справа выберите, чем он открывается: ключом или рычагами/плитами (галочки).";
      break;
    }
    case "path": {
      let pth = ui.pathDraw && (state.paths||[]).find(p=>p.id===ui.pathDraw && p.area===area);
      if (!pth){
        const id = uid("path");
        pth = {id, area, kind: ui.pathKind || "dirt", width: ui.pathWidth || 1.8, points: []};
        state.paths.push(pth);
        ui.pathDraw = id;
        note = "Кликайте дальше — точки дорожки. Enter или Esc — закончить, Backspace — убрать последнюю точку.";
      }
      pth.points.push({x: round2(x), z: round2(z)});
      sel = {type:"path", id:pth.id};
      keep = true;
      break;
    }
    case "transition": {
      const key = cellKey(cx, cz);
      if (!ctxCells()[key]){ toast("Переход ставится на клетку земли — сначала нарисуйте её"); return; }
      if (Object.keys(state.worldMaps).length < 2){ toast("Сначала создайте вторую карту (+ Карта слева) — переходу некуда вести"); return; }
      sel = addTransition(area, key);
      note = "Переход создан. Справа выберите, куда он ведёт, и укажите точку появления.";
      break;
    }
  }
  if (!sel) return;
  commit();
  if (!keep) ui.tool = "select";
  ui.sel = sel;
  render();
  if (note) toast(note);
}

// режим "укажи точку на карте" (точка появления у перехода/пещеры)
function startPick(label, ctx, apply){
  ui.pick = {label, apply, back: deepCopy(ui.ctx), sel: ui.sel ? deepCopy(ui.sel) : null, area: ctx.id};
  openCtx(ctx, {remember:false});
  render();
}
function pickAt(x, z){
  const p = ui.pick;
  const sx = snap(x), sz = snap(z);
  if (!onCells(p.area, sx, sz)){ toast("Там вода или стена — укажите клетку, на которой можно стоять"); return; }
  ui.pick = null;
  p.apply(sx, sz);
  commit();
  ui.ctx = p.back; ui.sel = p.sel;
  render();
  toast("Точка появления задана");
}
function cancelPick(){
  if (!ui.pick) return;
  const p = ui.pick; ui.pick = null;
  ui.ctx = p.back; ui.sel = p.sel;
  render();
}

// двойной клик / "зайти": дом → первый этаж, пещера/переход → карта назначения
function enterSel(sel){
  const o = getSelObj(sel); if (!o) return;
  if (sel.type==="house" && o.type!=="cave"){
    const fid = (o.floors||[]).some(f=>f.id===o.enterFloor) ? o.enterFloor : (o.floors[0]||{}).id;
    if (!fid) return;
    openCtx({kind:"floor", id:fid}); ui.sel = {type:"floor", id:fid}; render(); return;
  }
  let tm = null, tx = 0, tz = 0;
  if (sel.type==="house"){ tm = o.targetMap; tx = o.targetSpawnX||0; tz = o.targetSpawnZ||0; }
  if (sel.type==="transition"){ tm = o.portal.targetMap; tx = o.portal.targetSpawnX||0; tz = o.portal.targetSpawnZ||0; }
  if (sel.type==="exit"){
    const ff = findFloor(sel.floor);
    if (o.target==="world"){ select({type:"house", id:ff.house.id}); return; }
    openCtx({kind:"floor", id:o.target}); ui.sel = {type:"floor", id:o.target}; render(); return;
  }
  if (!tm) return;
  if (tm===BACK){ toast("Этот выход ведёт туда, откуда игрок пришёл — конкретной карты у него нет"); return; }
  if (!state.worldMaps[tm]){ toast("Карта назначения не найдена"); return; }
  openCtx({kind:"map", id:tm});
  focusOn(tx, tz);
  render();
}

svg.addEventListener("pointerdown", ev=>{
  const [x, z] = toWorld(ev.clientX, ev.clientY);
  const [cx, cz] = cellOf(x, z);
  const objEl = ev.target.closest("[data-obj]");
  const arrEl = ev.target.closest("[data-arrival]");
  svg.setPointerCapture(ev.pointerId);
  const base = {sx: ev.clientX, sy: ev.clientY, lx: ev.clientX, ly: ev.clientY, moved:false};
  if (ev.button===1 || ev.button===2 || (ev.button===0 && spaceDown)){
    gesture = Object.assign(base, {kind:"pan"}); svg.classList.add("panning"); ev.preventDefault(); return;
  }
  if (ev.button !== 0) return;
  if (ui.pick){ pickAt(x, z); return; }
  // маршрут жителя: каждый клик — точка
  if (ui.routeFor){
    const n = state.npcs.find(q=>q.id===ui.routeFor);
    if (n){ n.behavior = n.behavior || {mode:"patrol"}; n.behavior.points = n.behavior.points || []; n.behavior.points.push({x: snap(x), z: snap(z)}); commit(); renderCanvas(); renderInspector(); }
    return;
  }
  // точка дорожки / маршрута — тянуть
  const ptEl = ev.target.closest("[data-obj=pathpt],[data-obj=routept]");
  if (ptEl){
    gesture = Object.assign(base, {kind:"pt", what: ptEl.dataset.obj, id: ptEl.dataset.id, i: Number(ptEl.dataset.i)});
    if (ptEl.dataset.obj==="pathpt") ui.sel = {type:"path", id: ptEl.dataset.id};
    return;
  }
  if (ui.tool==="place"){ placeAt(x, z, cx, cz, ev.shiftKey); return; }
  if (ui.tool==="brush"){
    if (ev.altKey){
      const c = ctxCells()[cellKey(cx,cz)];
      if (c){ ui.levelValue = c.elevation||0; ui.brush = "level"; saveUi(); renderToolbar(); toast(`Высота для «Выровнять»: ${ui.levelValue}`); }
      return;
    }
    const mode = ev.shiftKey ? INVERT[ui.brush] : ui.brush;
    if (ui.brushShape==="rect"){
      gesture = Object.assign(base, {kind:"rect", mode});
      rectPreview = {a:[cx,cz], b:[cx,cz]}; renderOverlay();
      return;
    }
    gesture = Object.assign(base, {kind:"paint", mode, done:new Set(), cx, cz});
    paintAt(cx, cz);
    // выше/ниже: пока кнопка зажата — клетка под кистью продолжает подниматься
    // (раньше за один мазок клетка менялась только на 1 уровень, и казалось,
    // что выше +1 поднять нельзя)
    if (mode === "raise" || mode === "lower"){
      const g = gesture;
      g.repeat = setInterval(()=>{ if (gesture !== g){ clearInterval(g.repeat); return; } if (performance.now() - (g.lastCellT||0) < 600) return; paintAt(g.cx, g.cz, true); renderStatus(); }, 420);   // держишь на месте — выше; вернулся мазком — клетка не поднимается снова
    }
    return;
  }
  // выбор (Shift — добавить к выделению, выделенные тянутся вместе)
  if (objEl){
    const sel = selFromEl(objEl);
    if (ev.shiftKey && MULTI_TYPES.includes(sel.type)){ toggleMulti(sel); render(); return; }
    if (inMulti(sel) && ui.multi.length > 1){ ui.sel = sel; gesture = Object.assign(base, {kind:"gdrag", last:[x, z]}); renderInspector(); return; }
    ui.multi = [];
    const p = selPos(sel);
    ui.sel = sel;
    gesture = Object.assign(base, {kind:"drag", sel, off: p ? [p[0]-x, p[1]-z] : [0,0], lastW: [x, z]});
    render();
    return;
  }
  if (arrEl){ select(JSON.parse(arrEl.dataset.arrival)); return; }
  if (ev.shiftKey){ gesture = Object.assign(base, {kind:"box"}); boxSel = {a:[x, z], b:[x, z]}; renderOverlay(); return; }
  gesture = Object.assign(base, {kind:"panclick"});
});

// Мазок кистью: каждая клетка — один раз за мазок (вернулся на уже поднятое —
// не поднимается снова). Удержание кнопки НА МЕСТЕ поднимает дальше (force).
function paintAt(cx, cz, force){
  let changed = false;
  brushFootprint(cx, cz).forEach(([x,z])=>{
    const k = cellKey(x,z);
    if (gesture.done.has(k) && !force) return;
    gesture.done.add(k);
    applyBrushCell(x, z, gesture.mode);
    changed = true;
  });
  if (changed){
    // только земля (canvas); объекты и SVG — в конце мазка. В снимке земли
    // дорисовываются лишь эти клетки с соседями (patchTerrainCache).
    const before = cellsRev;
    cellsRev++;
    patchTerrainCache(brushFootprint(cx, cz).map(([x, z])=> cellKey(x, z)), before);
    const v = getView();
    drawTerrain(v, viewBox(), 1 / v.scale);
  }
}

svg.addEventListener("pointermove", ev=>{
  const [x, z] = toWorld(ev.clientX, ev.clientY);
  const [cx, cz] = cellOf(x, z);
  const objEl = ev.target.closest("[data-obj]");
  hover = {x, z, cx, cz, key: cellKey(cx, cz), label: objEl ? objLabel(selFromEl(objEl)) : ""};
  if (!gesture){ renderOverlay(); renderStatus(); return; }
  const dx = ev.clientX - gesture.lx, dy = ev.clientY - gesture.ly;
  if (Math.abs(ev.clientX-gesture.sx) + Math.abs(ev.clientY-gesture.sy) > 3) gesture.moved = true;
  gesture.lx = ev.clientX; gesture.ly = ev.clientY;
  switch (gesture.kind){
    case "pan": case "panclick": {
      if (!gesture.moved) break;
      const v = getView();
      v.cx -= dx / v.scale; v.cz -= dy / v.scale;
      svg.classList.add("panning");
      requestPan();
      break;
    }
    case "drag": {
      if (!gesture.moved) break;
      const sel = gesture.sel, o = getSelObj(sel);
      if (!o) break;
      if (sel.type==="transition"){
        gesture.target = cellKey(cx, cz);
        rectPreview = {a:[cx,cz], b:[cx,cz]};
        requestCanvas();
        break;
      }
      if (sel.type==="path"){
        // дорожка целиком: сдвиг всех точек
        const lx = gesture.lastW ? gesture.lastW[0] : x - (ev.movementX||0), lz = gesture.lastW ? gesture.lastW[1] : z;
        o.points.forEach(p=>{ p.x = round2(p.x + (x - lx)); p.z = round2(p.z + (z - lz)); });
        gesture.lastW = [x, z];
        requestCanvas();
        break;
      }
      const nx = x + gesture.off[0], nz = z + gesture.off[1];
      o.x = ev.altKey ? round2(nx) : snap(nx);
      o.z = ev.altKey ? round2(nz) : snap(nz);
      requestCanvas();
      break;
    }
    case "paint": if (gesture.cx !== cx || gesture.cz !== cz) gesture.lastCellT = performance.now(); gesture.cx = cx; gesture.cz = cz; paintAt(cx, cz); break;
    case "gdrag": {
      if (!gesture.moved) break;
      const ddx = x - gesture.last[0], ddz = z - gesture.last[1];
      gesture.last = [x, z];
      selList().forEach(sl=> moveSelBy(sl, ddx, ddz));
      requestCanvas();
      break;
    }
    case "box": boxSel.b = [x, z]; renderOverlay(); break;
    case "pt": {
      if (!gesture.moved) break;
      let pts = null;
      if (gesture.what==="pathpt"){ const p = state.paths.find(q=>q.id===gesture.id); pts = p && p.points; }
      else { const n = state.npcs.find(q=>q.id===gesture.id); pts = n && n.behavior && n.behavior.points; }
      if (pts && pts[gesture.i]){ pts[gesture.i].x = ev.altKey ? round2(x) : snap(x); pts[gesture.i].z = ev.altKey ? round2(z) : snap(z); requestCanvas(); }
      break;
    }
    case "rect": rectPreview.b = [cx, cz]; renderOverlay(); break;
  }
  renderStatus();
});

function endGesture(){
  const g = gesture; gesture = null;
  svg.classList.remove("panning");
  if (!g) return;
  switch (g.kind){
    case "panclick":
      if (!g.moved){ ui.multi = []; ui.sel = {type: ui.ctx.kind, id: ui.ctx.id}; render(); }
      break;
    case "gdrag":
      if (g.moved){ commit(); }
      render();
      break;
    case "box": {
      const a = boxSel.a, b = boxSel.b; boxSel = null;
      const found = objectsInRect(Math.min(a[0],b[0]), Math.min(a[1],b[1]), Math.max(a[0],b[0]), Math.max(a[1],b[1]));
      const merged = selList().concat(found.filter(f=>!selList().some(q=>sameSel(q, f))));
      setMulti(merged);
      render();
      if (found.length) toast(`Выделено: ${merged.length}. Тяните любой — поедут все; Ctrl+C — копировать, Delete — удалить`);
      break;
    }
    case "drag":
      if (g.sel.type==="transition" && g.moved && g.target && g.target !== g.sel.key){
        const cells = state.worldMaps[g.sel.map].cells;
        const dst = cells[g.target];
        if (!dst) toast("Переход можно перенести только на клетку земли");
        else if (dst.portal) toast("На этой клетке уже есть переход");
        else { dst.portal = cells[g.sel.key].portal; delete cells[g.sel.key].portal; ui.sel = {type:"transition", map:g.sel.map, key:g.target}; }
      }
      rectPreview = null;
      commit(); render();
      break;
    case "pt":
      if (g.moved){ commit(); render(); }
      break;
    case "paint":
      if (g.repeat) clearInterval(g.repeat);
      commit(); render();
      break;
    case "rect": {
      const [a, b] = [rectPreview.a, rectPreview.b];
      for (let x=Math.min(a[0],b[0]); x<=Math.max(a[0],b[0]); x++)
        for (let z=Math.min(a[1],b[1]); z<=Math.max(a[1],b[1]); z++) applyBrushCell(x, z, g.mode);
      rectPreview = null;
      commit(); render();
      break;
    }
  }
}
svg.addEventListener("pointerup", endGesture);
svg.addEventListener("pointercancel", endGesture);
svg.addEventListener("pointerleave", ()=>{ if (!gesture){ hover = null; renderOverlay(); renderStatus(); } });
svg.addEventListener("contextmenu", ev=> ev.preventDefault());
svg.addEventListener("dblclick", ev=>{
  if (ui.tool !== "select" || ui.pick) return;
  const objEl = ev.target.closest("[data-obj]");
  if (objEl) enterSel(selFromEl(objEl));
});
let wheelBusyUntil = 0, wheelDeclutterT = null;
svg.addEventListener("wheel", ev=>{
  ev.preventDefault();
  wheelBusyUntil = performance.now() + 160;
  zoomAt(ev.deltaY > 0 ? 1/1.15 : 1.15, ev.clientX, ev.clientY);
}, {passive:false});
document.getElementById("zoomIn").onclick = ()=> zoomAt(1.35);
document.getElementById("zoomOut").onclick = ()=> zoomAt(1/1.35);
document.getElementById("zoomFit").onclick = ()=>{ fitView(); renderCanvas(); };
new ResizeObserver(()=>{ _vp = null; requestCanvas(); }).observe(document.getElementById("viewport"));
/* ============================ инспектор: основа ============================
   Форма собирается строкой HTML, а обработчики регистрируются рядом (binds)
   и навешиваются после вставки. Ввод текста/чисел меняет данные сразу
   (холст и дерево обновляются, фокус не теряется), завершение правки
   (change) закрепляет шаг отмены и перерисовывает всё. */
// ввод текста/ползунок: перерисовка не чаще раза за кадр (раунд 28 — раньше
// каждое нажатие клавиши синхронно пересобирало карту и дерево)
let softQueued = false;
function softRefresh(){
  _probCache = null; scheduleSave();
  if (softQueued) return; softQueued = true;
  requestAnimationFrame(()=>{ softQueued = false; renderCanvas(); renderOutliner(); renderTopbar(); });
}
function makeForm(prefix){
  let n = 0;
  const binds = [];
  const nid = ()=> `${prefix}_${n++}`;
  const wrap = (label, control, hint, forId)=> `<div class="field">${label ? `<label for="${forId}">${label}</label>` : ""}${control}${hint ? `<span class="hint">${hint}</span>` : ""}</div>`;
  const f = {
    binds,
    text(label, value, set, o={}){
      const id = nid();
      binds.push(()=>{
        const el = document.getElementById(id);
        if (!o.lazy) el.addEventListener("input", ()=>{ set(el.value); softRefresh(); });
        el.addEventListener("change", ()=>{ set(el.value); commit(); render(); });
      });
      return wrap(label, `<input type="text" id="${id}" value="${esc(value)}" ${o.mono?'class="mono"':""} placeholder="${esc(o.placeholder||"")}" spellcheck="${o.mono?"false":"true"}" ${o.list?`list="${o.list}"`:""}>`, o.hint, id);
    },
    area(label, value, set, o={}){
      const id = nid();
      binds.push(()=>{
        const el = document.getElementById(id);
        el.addEventListener("input", ()=>{ set(el.value); softRefresh(); });
        el.addEventListener("change", ()=>{ commit(); render(); });
      });
      return wrap(label, `<textarea id="${id}" rows="${o.rows||3}" placeholder="${esc(o.placeholder||"")}">${esc(value)}</textarea>`, o.hint, id);
    },
    num(label, value, set, o={}){
      const id = nid();
      const parse = (v)=>{ let x = o.int ? parseInt(v) : parseFloat(v); if (isNaN(x)) return null; if (o.min!=null) x = Math.max(o.min, x); if (o.max!=null) x = Math.min(o.max, x); return x; };
      binds.push(()=>{
        const el = document.getElementById(id);
        el.addEventListener("input", ()=>{ const x = parse(el.value); if (x!=null){ set(x); softRefresh(); } });
        el.addEventListener("change", ()=>{ const x = parse(el.value); if (x!=null) set(x); else if (o.allowEmpty && el.value === "") set(""); commit(); render(); });
      });
      return wrap(label, `<input type="number" id="${id}" value="${value}" step="${o.step||1}" ${o.min!=null?`min="${o.min}"`:""} ${o.max!=null?`max="${o.max}"`:""} ${o.placeholder?`placeholder="${esc(o.placeholder)}"`:""}>`, o.hint, id);
    },
    slider(label, value, set, o){
      const id = nid(), out = nid();
      binds.push(()=>{
        const el = document.getElementById(id), lab = document.getElementById(out);
        el.addEventListener("input", ()=>{ const x = parseFloat(el.value); set(x); lab.textContent = o.fmt(x); softRefresh(); });
        el.addEventListener("change", ()=>{ commit(); render(); });
      });
      return wrap(`${label}: <b id="${out}">${o.fmt(value)}</b>`, `<input type="range" id="${id}" min="${o.min}" max="${o.max}" step="${o.step}" value="${value}">`, o.hint, id);
    },
    select(label, value, options, set, o={}){
      const id = nid();
      binds.push(()=>{ const el = document.getElementById(id); el.addEventListener("change", ()=>{ set(el.value); commit(); render(); }); });
      const opt = (v,l)=> `<option value="${esc(v)}" ${String(v)===String(value)?"selected":""}>${esc(l)}</option>`;
      const html = options.map(x=> x.group ? `<optgroup label="${esc(x.group)}">${x.items.map(([v,l])=>opt(v,l)).join("")}</optgroup>` : opt(x[0], x[1])).join("");
      return wrap(label, `<select id="${id}">${html}</select>`, o.hint, id);
    },
    color(label, value, set){
      const id = nid(), hx = nid();
      binds.push(()=>{
        const el = document.getElementById(id), t = document.getElementById(hx);
        el.addEventListener("input", ()=>{ set(el.value); t.textContent = el.value; softRefresh(); });
        el.addEventListener("change", ()=>{ commit(); render(); });
      });
      return wrap(label, `<div class="colorrow"><input type="color" id="${id}" value="${validHex(value,"#888888")}"><span class="mono" id="${hx}">${esc(value)}</span></div>`, "", id);
    },
    check(label, value, set, hint){
      const id = nid();
      binds.push(()=>{ const el = document.getElementById(id); el.addEventListener("change", ()=>{ set(el.checked); commit(); render(); }); });
      return `<label class="check" for="${id}"><input type="checkbox" id="${id}" ${value?"checked":""}><span>${label}${hint?`<br><span class="hint">${hint}</span>`:""}</span></label>`;
    },
    button(label, fn, cls=""){
      const id = nid();
      binds.push(()=>{ document.getElementById(id).addEventListener("click", fn); });
      return `<button class="btn small ${cls}" id="${id}">${label}</button>`;
    },
    on(id, ev, fn){ binds.push(()=>{ const el = document.getElementById(id); if (el) el.addEventListener(ev, fn); }); },
    id: nid,
  };
  return f;
}

      ${F.button("Показать", ()=>{ openCtx({kind:"map", id:tm}); focusOn(x, z); render(); })}

}

// уровень монстров карты/этажа: 0 = подстраивается под героя
function monsterLevelFields(F, holder){
  const lo = Number(holder.levelMin)||0, hi = Number(holder.levelMax)||0;
  let txt;
  if (!lo && !hi) txt = "<span style=\"color:var(--warn)\">Сейчас: <b>по уровню героя</b> (от −2 до +2 к его уровню) — мир «растёт» вместе с героем. Задайте уровень, чтобы места были слабее или сильнее.</span>";
  else {
    // как в игре (BattleMonster.make_random_party): «до» не меньше «от»
    const a = Math.max(lo, 1), b = Math.max(hi || a, a);
    txt = a===b ? `Сейчас: всегда <b>${a}</b> уровень.` : `Сейчас: <b>${a}–${b}</b> уровень.`;
  }
  return `<div class="grid2">
      ${F.num("Уровень от", lo, v=>holder.levelMin=v, {int:true, min:0, max:99})}
      ${F.num("до", hi, v=>holder.levelMax=v, {int:true, min:0, max:99})}
    </div>
    <p class="hint">${txt} 0 — по уровню героя. Монстр выше героя на 3+ уровня — очень опасен, ниже на 3+ — слабый и даёт мало опыта. В игре диапазон пишется рядом с названием места.</p>`;
}

// встречи места (игра: core/encounters.gd): бой через N шагов по опасной
// земле, кто водится, размер группы
function encounterFields(F, holder){
  const lo = Number(holder.stepsMin)||0, hi = Number(holder.stepsMax)||0;
  const mons = Array.isArray(holder.monsters) ? holder.monsters : [];
  const vis = holder.encounterMode !== "steps";
  let html = F.select("Как встречаются монстры", vis ? "visible" : "steps", [["visible","Видны на карте: бродят, замечают, гонятся"],["steps","Невидимые засады через N шагов (по-старому)"]], v=>{ if (v === "visible") delete holder.encounterMode; else holder.encounterMode = v; });
  if (vis) html += F.slider("Сколько групп бродит", holder.fieldDensity==null ? 1 : Number(holder.fieldDensity), v=>{ if (Number(v) === 1) delete holder.fieldDensity; else holder.fieldDensity = v; }, {min:0, max:3, step:0.25, fmt:v=>`×${v}`, hint:"Монстры живут вокруг героя: примерно одна группа на 9 клеток опасной земли в радиусе ~60 м от героя, умножить на это число (не больше 10 одновременно). Появляются вне кадра, отставшие далеко позади уходят — на огромной карте монстры встречаются везде одинаково часто. 0 — здесь никто не бродит. В безопасную землю монстры не заходят. Удар мечом (Пробел) по монстру — бой с преимуществом, догнал со спины — засада."});
  html += vis ? `<div style="display:none">` : `<div>`;
  html += `<div class="grid2">
      ${F.num("Бой через шагов: от", lo, v=>holder.stepsMin=v, {int:true, min:0, max:500})}
      ${F.num("до", hi, v=>holder.stepsMax=v, {int:true, min:0, max:500})}
    </div>
    <p class="hint">${lo||hi ? `Бой случится через <b>${Math.max(lo,1)}–${Math.max(hi||lo, lo, 1)}</b> шагов по опасной земле (шаг ≈ 1,2 м; клетка — примерно 4 шага).` : "0 — как обычно: 60–110 шагов."} Счётчик начинается заново после каждого боя.</p></div>
    <div class="grid2">
      ${F.num("Монстров в группе: от", Number(holder.partyMin)||1, v=>holder.partyMin=v, {int:true, min:1, max:4})}
      ${F.num("до", Number(holder.partyMax)||4, v=>holder.partyMax=v, {int:true, min:1, max:4})}
    </div>
    ${F.slider("Шанс элиты в засаде", holder.eliteChance==null ? ELITE_DEFAULT : Number(holder.eliteChance), v=>{ if (Number(v) === ELITE_DEFAULT) delete holder.eliteChance; else holder.eliteChance = v; }, {min:0, max:100, step:1, fmt:v=>`${Math.round(v)}%`, hint:"Элита — один монстр засады со свойствами (Быстрый, Вампир, Бронированный…): крепче, даёт вдвое больше опыта и больше добычи. 0 — элит здесь нет."})}
    <div class="hint" style="margin-top:6px">Кто здесь водится <span class="pill">${mons.length ? mons.length + " вид." : "все базовые"}</span></div>
    <div class="checkgrid">`;
  wildMonsterTypes().forEach(([id, name])=>{
    html += F.check(name, mons.includes(id), v=>{
      holder.monsters = (Array.isArray(holder.monsters) ? holder.monsters : []).filter(x=>x!==id);
      if (v) holder.monsters.push(id);
      else if (holder.monsterChance) delete holder.monsterChance[id];
    });
  });
  html += `</div>`;
  // шанс встречи (раунд 25): 100% — обычный, меньше — редкий
  if (mons.length){
    const ch = holder.monsterChance || {};
    const regular = mons.filter(id=>(ch[id]==null ? 100 : ch[id]) >= 100);
    html += `<div class="hint" style="margin-top:4px">Шанс встречи: 100% — обычный монстр; меньше — редкий: попадает в засаду только с этим шансом (например, 10% — примерно в каждом десятом бою). «Когда» — водится всегда, только днём или только ночью (ночь — с 20:30 до 4:30).</div>`;
    const mt = holder.monsterTime || {};
    mons.forEach(id=>{
      const c = ch[id]==null ? 100 : ch[id];
      const share = c >= 100 && regular.length ? `≈ ${Math.round(100/regular.length)}% мест` : (c >= 100 ? "" : `редкий`);
      html += `<div class="lootrow" style="grid-template-columns:minmax(0,1fr) 70px 112px 80px;align-items:center"><span style="font-size:12.5px">${esc(monsterName(id))}</span>
        ${F.num("", c, v=>{ holder.monsterChance = Object.assign({}, holder.monsterChance||{}); if (v >= 100) delete holder.monsterChance[id]; else holder.monsterChance[id] = v; if (!Object.keys(holder.monsterChance).length) delete holder.monsterChance; }, {int:true, min:1, max:100})}
        ${F.select("", mt[id] || "", [["","всегда"],["day","☀ только днём"],["night","☾ только ночью"]], v=>{ holder.monsterTime = Object.assign({}, holder.monsterTime||{}); if (v) holder.monsterTime[id] = v; else delete holder.monsterTime[id]; if (!Object.keys(holder.monsterTime).length) delete holder.monsterTime; })}
        <span class="hint">${share}</span></div>`;
    });
    if (mons.every(id=>mt[id] === "night")) html += `<p class="hint warn">Все отмеченные водятся только ночью — днём здесь пусто.</p>`;
    else if (mons.every(id=>mt[id] === "day")) html += `<p class="hint warn">Все отмеченные водятся только днём — ночью здесь пусто.</p>`;
    if (!regular.length) html += `<p class="hint warn">Все отмеченные — редкие: если ни один не выпал, нападёт один из них по шансам.</p>`;
  }
  html += `<p class="hint">Ничего не отмечено — зверь, лев и голем. Особые монстры погоды (буря, ливень…) добавляются сами, пока идёт непогода. Ночью под открытым небом монстры быстрее, замечают дальше и дольше гонятся, а шанс элиты ×2,5.</p>`;
  return html;
}

// биом карты (игра: core/biomes.gd) + редактор своих биомов прямо здесь

    meadow: "Луг: зелёная трава, цветы. Погоды нет.",

    desert: "Пустыня: песок, кактусы, редкая сухая трава. Погода: песчаная буря — идти на 30% медленнее, песок в воздухе, скорпионы, дюнные големы и палачи.",
    snow: "Снега: белая земля и ели. Погода: метель — медленнее шаг, зеркальные рыцари и гарпии.",

  ed += F.select("Вода в озёрах", own.water == null ? "" : own.water, [["", "как у основы"], ["fresh", "обычная"], ["mana", "мана-озеро (светится, своя рыба)"]], v=>{ if (v) own.water = v; else delete own.water; });

    </div>`;

    <p class="hint">Награда выдаётся ТОЛЬКО за победу, сверх обычной добычи с монстров. Убежал — бой снова ждёт на этом месте.</p>`;

    ${F.slider("Круг срабатывания", Number(b.radius)||0, v=>b.radius=v, {min:0, max:25, step:0.5, fmt:v=> v>0 ? `${v} м` : "одна клетка", hint:"0 — только клетка, на которой стоит отметка; больше — круг такого радиуса (большая зона)"})}

}

/* ---------- находки (раунд 77; игра: core/touch_world.gd) ----------
   Удар мечом (Пробел) по траве, кусту, дереву: каждая строка — свой шанс за
   удар. m.forage {grass, tallgrass, bush, tree}: нет ключа — обычные
   (FORAGE_DEFAULT — копия TouchWorld.FORAGE_DEFAULT), [] — ничего. */
const FORAGE_DEFAULT = {
  grass: [{itemId:"gold", chance:3, min:1, max:3}, {itemId:"berry", chance:1.5, min:1, max:1}, {itemId:"herb_mint", chance:1, min:1, max:1}],
  tallgrass: [{itemId:"gold", chance:8, min:1, max:4}, {itemId:"berry", chance:5, min:1, max:1}, {itemId:"herb_mint", chance:4, min:1, max:1}, {itemId:"herb_sun", chance:3, min:1, max:1}],
  bush: [{itemId:"berry", chance:30, min:1, max:2}, {itemId:"herb_moon", chance:5, min:1, max:1}, {itemId:"gold", chance:5, min:2, max:6}],
  tree: [{itemId:"gold", chance:6, min:3, max:8}, {itemId:"berry", chance:8, min:1, max:2}, {itemId:"herb_sun", chance:4, min:1, max:1}],
};
const FORAGE_KINDS = [["grass","Трава","скосил мечом траву (с одного места — раз, пока не отрастёт)"], ["tallgrass","Высокая трава и цветочные поляны","клетки с украшением «высокая трава» или «цветы»"],
  ["bush","Кусты","ударил по кусту (у каждого куста — раз в 2 минуты)"], ["tree","Деревья","ударил по дереву (раз в 2 минуты)"]];
function forageSection(F, m){
  let html = `<p class="hint">Удар мечом (Пробел) по траве, кусту или дереву иногда выбивает находку: она выпрыгивает и сама летит к герою. Каждая строка — свой шанс за удар.</p>`;
  FORAGE_KINDS.forEach(([k, title, note])=>{
    const own = m.forage && Array.isArray(m.forage[k]);
    const list = own ? m.forage[k] : FORAGE_DEFAULT[k];
    let body = `<div class="hint">${esc(note)}</div>`;
    if (!own){
      body += `<div class="hint">Как обычно: ${list.map(it=>`${esc(itemName(it.itemId))} ${it.chance}%`).join(", ")}</div>`;
      body += `<div style="display:flex;gap:6px;flex-wrap:wrap">${F.button("Изменить", ()=>{ m.forage = m.forage || {}; m.forage[k] = deepCopy(FORAGE_DEFAULT[k]); commit(); render(); })}${F.button("Ничего не падает", ()=>{ m.forage = m.forage || {}; m.forage[k] = []; commit(); render(); })}</div>`;
    } else {
      list.forEach((it, i)=>{
        body += `<div class="lootrow" style="grid-template-columns:minmax(0,1fr) 62px 48px 48px auto;align-items:end">
          ${F.select("", it.itemId, itemOptions(it.itemId), v=>it.itemId=v)}
          ${F.num("шанс %", it.chance==null?5:it.chance, v=>it.chance=v, {min:0, max:100, step:0.5})}
          ${F.num("от", it.min||1, v=>it.min=v, {int:true, min:1, max:99})}
          ${F.num("до", it.max||it.min||1, v=>it.max=v, {int:true, min:1, max:99})}
          ${F.button("✕", ()=>{ list.splice(i, 1); commit(); render(); }, "danger")}</div>`;
      });
      if (!list.length) body += `<p class="hint">Ничего не падает.</p>`;

/* ---------- рыбалка (раунд 90; игра: core/fishing.gd) ----------
   m.fishing [{itemId, chance %, min, max, rings}] — что клюёт в воде карты.
   Нет — по воде биома (FISH_DEFAULT — копия Fishing.WATER_FISH). rings —
   кругов в мини-игре (0/пусто — по предмету: рыба своё, вещи — редкость). */
const FISH_DEFAULT = {
  "": [{itemId:"fish_perch", chance:30}, {itemId:"fish_carp", chance:24}, {itemId:"fish_trout", chance:14}, {itemId:"fish_pike", chance:8}, {itemId:"fish_goldcarp", chance:3}, {itemId:"fish_lake_king", chance:1},
    {itemId:"old_boot", chance:10}, {itemId:"potion_hp", chance:5}, {itemId:"gold", chance:5, min:5, max:25}],
  mana: [{itemId:"fish_mana_minnow", chance:32}, {itemId:"fish_glowfin", chance:22}, {itemId:"fish_spore_eel", chance:12}, {itemId:"fish_astral_koi", chance:4}, {itemId:"fish_source_keeper", chance:1},
    {itemId:"herb_glowcap", chance:10}, {itemId:"shimmer_dust", chance:8}, {itemId:"potion_sp", chance:6}, {itemId:"gold", chance:5, min:10, max:40}],
};
function mapWaterKind(m){
  const own = (state.biomes||[]).find(b=>b.id===m.biome);
  if (own && own.water) return own.water === "fresh" ? "" : own.water;
  const base = own ? (own.base||"meadow") : (m.biome||"meadow");
  return base === "mushroom" ? "mana" : "";
}
function fishRingsOf(id){
  const d = itemDefs().find(x=>x.id===id);
  if (d && d.fish) return d.fish;
  if (equipDefs().some(x=>x.id===id)) return "по редкости";
  return d && d.rare ? 4 : 2;
}

/* ---------- осмотр декора (раунд 76; игра: core/examine.gd) ----------
   Что скажет герой по E «Осмотреть»: свой текст объекта (o.look.text) →
   общий для вида (state.examine[вид].text) → встроенный (EXAMINE_DEFAULTS —
   копия core/examine_texts.json, обновлять tools/sync_examine.py). off —
   осматривать нельзя (у объекта или у всего вида). */
function propAction(type){
  if (String(type).startsWith("herb_")) return "сорвать траву";
  const a = {board:"доска объявлений", cauldron:"алхимия", anvil:"кузница", forge:"кузница"}[type];
  if (a) return a;
  const t = PROP_TYPES.find(x=>x[0]===type);
  return t && t[5] ? "сесть" : "";
}
function examineText(o){
  if (propAction(o.type)) return "";
  const look = o.look || {}, tl = (state.examine||{})[o.type] || {};
  if (look.off || tl.off) return "";
  return (look.text||"").trim() || (tl.text||"").trim() || (EXAMINE_DEFAULTS[o.type]||"").trim();
}
function examineSection(F, o){
  const act = propAction(o.type);
  if (act) return `<p class="hint">У этого объекта своё действие по E — «${esc(act)}», поэтому осмотра нет.</p>`;
  const name = propName(o.type).replace(/\s*\(.*\)\s*$/, "");
  const look = o.look || {};
  const ex = state.examine || {};
  const tl = ex[o.type] || {};
  const def = EXAMINE_DEFAULTS[o.type] || "";
  const L = ()=> (o.look = o.look || {});
  const T = ()=>{ state.examine = state.examine || {}; return (state.examine[o.type] = state.examine[o.type] || {}); };
  const tidy = ()=>{
    if (o.look && !o.look.off && !(o.look.text||"").trim()) delete o.look;
    if (state.examine && state.examine[o.type] && !state.examine[o.type].off && !(state.examine[o.type].text||"").trim()) delete state.examine[o.type];
    if (state.examine && !Object.keys(state.examine).length) delete state.examine;
  };
  let html = "";
  if (tl.off){
    html += `<p class="hint warn">Все «${esc(name)}» сейчас нельзя осмотреть.</p>`;
    html += F.button(`Разрешить осмотр всех «${esc(name)}»`, ()=>{ T().off = false; tidy(); commit(); render(); });
    return html;
  }
  html += F.check("Этот объект можно осмотреть (E)", !look.off, v=>{ L().off = !v; tidy(); }, "Герой подходит, жмёт E и говорит, что видит");
  if (look.off) return html;
  html += F.area("Что скажет герой — только здесь", look.text || "", v=>{ L().text = v; tidy(); }, {rows:4,
    placeholder: (tl.text||"").trim() || def || "пусто — как у всех такого вида",
    hint:"Свой текст именно для этого объекта. Пусто — общий текст вида (ниже)."});
  html += F.area(`Что скажет герой — все «${name}»`, tl.text || "", v=>{ T().text = v; tidy(); }, {rows:3,
    placeholder: def || "встроенного текста нет — напишите свой",
    hint:"Для всех объектов этого вида во всём мире. Пусто — встроенный текст."});
  html += F.check(`Все «${name}» нельзя осмотреть`, false, v=>{ if (v){ T().off = true; tidy(); } });
  const cur = examineText(o);
  html += `<p class="hint">Пустая строка — новая страница. Строка <code>---</code> — другой вариант при следующем осмотре. <code>{имя}</code> — имя героя.</p>`;
  html += cur ? `<div class="card" style="white-space:pre-wrap;font-size:12.5px"><b>${esc(name)}:</b> ${esc(cur.split(/\n---\n/)[0])}</div>`
              : `<p class="hint warn">Текста нет — в игре осмотра не будет.</p>`;
  return html;
}

  st += `<div class="grid2">${F.text("Нужна отметка", q.needFlag||"", v=>q.needFlag=v, {mono:true, lazy:true})}${F.num("С уровня", q.minLevel||0, v=>q.minLevel=v, {int:true, min:0, max:99})}</div>`;
  const users = [];
  state.npcs.forEach(n=> n.nodes.forEach(nd=> nd.choices.forEach(c=>{ if (c.action==="quest:"+q.id) users.push(n.name); })));
  if (users.length) st += `<p class="hint good">Выдаётся ответом в разговоре: ${users.map(esc).join(", ")}.</p>`;
  html += sec("quest_start", "Как получить", st);
  // что говорит житель: предлагая задание, после согласия, при сдаче
  html += sec("quest_talk", "Что говорит житель", `
    ${F.area("Предлагая задание", q.offerText||"", v=>q.offerText=v, {rows:3, placeholder:"пусто — прочитает описание", hint:"Пустая строка — новая страница. Звучит, когда игрок выбирает ответ «✦ Задание: …»"})}
    <div class="grid2">${F.text("Ответ «согласен»", q.acceptChoice||"", v=>q.acceptChoice=v, {lazy:true, placeholder:"Возьмусь!"})}${F.text("Ответ «отказ»", q.declineChoice||"", v=>q.declineChoice=v, {lazy:true, placeholder:"Не сейчас"})}</div>
    ${F.area("Когда игрок согласился", q.acceptText||"", v=>q.acceptText=v, {rows:2, placeholder:"Спасибо! Буду ждать хороших вестей."})}
    ${F.area("Когда задание сдают", q.doneText||"", v=>q.doneText=v, {rows:3, placeholder:"Спасибо тебе! Вот, держи — ты это заслужил.", hint:"Для последнего этапа. На промежуточных этапах — поле «Что скажет» у цели «Сдать жителю» (пусто — текст следующего этапа)."})}
    <p class="hint">Если в разговоре жителя уже есть ваш ответ с действием «взять задание», эти реплики не нужны — задание выдаст ваш ответ.</p>`);
  // этапы
  let stg = "";
  q.stages.forEach((s, si)=>{
    let objs = "";
    s.objectives.forEach((o, oi)=>{
      let f = `<div class="lootrow" style="grid-template-columns:minmax(0,1fr) auto">${F.select("", o.type, QUEST_OBJ_TYPES, v=>{ s.objectives[oi] = Object.assign(newObjective(v), {text:o.text||""}); })}${F.button("✕", ()=>{ s.objectives.splice(oi,1); commit(); render(); }, "danger")}</div>`;
      switch (o.type){
        case "kill":
          f += `<div class="lootrow2">${F.select("Кого", o.target||"any", [["any","любых монстров"]].concat(monsterTypes()), v=>o.target=v)}${F.num("Сколько", o.count||1, v=>o.count=v, {int:true, min:1, max:99})}</div>`; break;
        case "collect":
          f += `<div class="lootrow2">${F.select("Что", o.target, itemOptions(o.target), v=>o.target=v)}${F.num("Сколько", o.count||1, v=>o.count=v, {int:true, min:1, max:99})}</div>${F.check("Забрать при сдаче", o.take!==false, v=>o.take=v)}`; break;
        case "talk": case "turnin":
          f += F.select(o.type==="talk" ? "С кем поговорить" : "Кому сдать", o.target||"", npcOpts, v=>o.target=v, {hint: o.type==="turnin" ? "в разговоре с ним появится ответ «Сдать задание», когда остальные цели этапа выполнены" : ""});
          if (o.type==="turnin") f += F.area("Что скажет, когда сдают этап", o.say||"", v=>o.say=v, {rows:2, placeholder:"пусто — «Когда задание сдают» (последний этап) или текст следующего этапа"});
          break;
        case "reach":
          f += `${F.select("Место", o.area||"overworld", areaOptions(), v=>o.area=v)}<div class="grid2">${F.num("X", o.x||0, v=>o.x=v, {step:0.5})}${F.num("Z", o.z||0, v=>o.z=v, {step:0.5})}</div>
            ${F.button("Указать на карте", ()=> startPick("место цели задания", areaCtx(o.area||"overworld") || ui.ctx, (x,z)=>{ o.x = snap(x); o.z = snap(z); }))}
            ${F.slider("Радиус", Number(o.radius)||4, v=>o.radius=v, {min:1, max:25, step:0.5, fmt:v=>`${v} м`})}`; break;
        case "battle":
          f += F.select("Какой бой", o.target||"", [["","— выберите"]].concat((state.battles||[]).map(b=>[b.id, b.name + (b.monsters.some(m=>isBossType(m.type)) ? " ★ босс" : "")])), v=>o.target=v); break;
        case "flag":
          f += F.text("Отметка", o.target||"", v=>o.target=v, {mono:true, lazy:true, hint:"ставят ответы, сцены, победа в бою"}); break;
      }
      f += F.text("Текст цели (пусто — само)", o.text||"", v=>o.text=v, {lazy:true});
      objs += `<div class="card">${f}</div>`;
    });
    stg += `<div class="card"><div class="lootrow" style="grid-template-columns:auto minmax(0,1fr) auto auto auto"><span class="pill">${si+1}</span>${F.text("", s.title||"", v=>s.title=v, {lazy:true, placeholder:"Название этапа"})}
      ${si>0 ? F.button("↑", ()=>{ q.stages.splice(si-1, 0, q.stages.splice(si,1)[0]); commit(); render(); }) : "<span></span>"}
      ${si<q.stages.length-1 ? F.button("↓", ()=>{ q.stages.splice(si+1, 0, q.stages.splice(si,1)[0]); commit(); render(); }) : "<span></span>"}
      ${q.stages.length>1 ? F.button("✕", ()=>{ q.stages.splice(si,1); commit(); render(); }, "danger") : "<span></span>"}</div>
      ${F.area("Что происходит (в журнале)", s.text||"", v=>s.text=v, {rows:2})}
      <div class="list">${objs}</div>${F.button("+ Цель", ()=>{ s.objectives.push(newObjective("kill")); commit(); render(); })}</div>`;
  });
  stg += `${F.button("+ Этап", ()=>{ q.stages.push({title:"Новый этап", text:"", objectives:[newObjective("turnin")]}); commit(); render(); })}
    <p class="hint">Этап закрыт, когда выполнены ВСЕ его цели — тогда начинается следующий. Последний этап — задание выполнено, награда выдана. Простое «принеси-подай» — один этап: «Собрать» + «Сдать жителю».</p>`;
  html += sec("quest_stages", `Этапы (${q.stages.length})`, stg);
  // награда
  const r = q.reward;
  let rew = `<div class="grid2">${F.num("Золото", r.gold||0, v=>r.gold=v, {int:true, min:0, max:99999})}${F.num("Опыт", r.xp||0, v=>r.xp=v, {int:true, min:0, max:99999})}</div><div class="list">`;
  (r.items||[]).forEach((it, i)=>{
    const eq = isEquipment(it.itemId);
    rew += `<div class="card"><div class="lootrow" style="grid-template-columns:minmax(0,1fr) 70px auto">${F.select("", it.itemId, itemOptions(it.itemId), v=>it.itemId=v)}${F.num("", it.qty||1, v=>it.qty=v, {int:true, min:1, max:99})}${F.button("✕", ()=>{ r.items.splice(i,1); commit(); render(); }, "danger")}</div>
      ${eq ? `<div class="lootrow2">${F.select("Редкость", it.rarity||0, RARITIES.map((x,ri)=>[ri, x]), v=>it.rarity=Number(v))}${F.num("Уровень", it.level||0, v=>it.level=v, {int:true, min:0, max:99, hint:"0 — по уровню героя"})}</div>` : ""}</div>`;
  });
  rew += `</div>${F.button("+ Предмет", ()=>{ r.items.push({itemId:"potion_hp", qty:1, rarity:0, level:0}); commit(); render(); })}
    <div class="grid2">${F.num(`Симпатия ${CompanionName}`, r.relation||0, v=>r.relation=v, {int:true, min:-100, max:100})}${F.text("Поставить отметку", r.setFlag||"", v=>r.setFlag=v, {mono:true, lazy:true})}</div>
    <p class="hint">Отметка — чтобы открыть следующее задание, сцену или новые ответы в разговорах.</p>`;
  html += sec("quest_reward", "Награда", rew);
  html += sec("quest_adv", "Дополнительно", F.text("id задания", q.id, v=>{ const nid = renameSimpleId(state.quests, q, v); state.npcs.forEach(n=> n.nodes.forEach(nd=> nd.choices.forEach(c=>{ if (c.action==="quest:"+sel.id) c.action = "quest:"+nid; }))); ui.sel = {type:"quest", id:nid}; }, {mono:true, lazy:true}), false);
  return html;
}
