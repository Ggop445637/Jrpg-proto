<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapwright</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23b9812f'/%3E%3Cpath d='M3 12V4l3 4 2-3 2 3 3-4v8' fill='none' stroke='%23fff' stroke-width='1.6' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#efeadf;
  --panel:#fbf9f4;
  --panel-2:#f3efe5;
  --panel-3:#e9e3d5;
  --ink:#241f18;
  --muted:#6f6656;
  --faint:#a39a87;
  --line:#ddd5c3;
  --accent:#b9812f;
  --accent-soft:rgba(185,129,47,.16);
  --accent-ink:#3d2805;
  --good:#3f8f62;
  --warn:#b7791f;
  --bad:#b6473c;
  --halo:rgba(251,249,244,.92);
  --shadow:0 1px 2px rgba(40,30,10,.06), 0 8px 24px -12px rgba(40,30,10,.25);
  --water:#b9cdd6;
  --water-2:#a7bfca;
  --rock:#4f4944;
  --rock-2:#57514b;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111418;
    --panel:#181c22;
    --panel-2:#1f242c;
    --panel-3:#282e38;
    --ink:#ebe6da;
    --muted:#98a0ae;
    --faint:#646c7a;
    --line:#2c323d;
    --accent:#d9a955;
    --accent-soft:rgba(217,169,85,.18);
    --accent-ink:#1c1406;
    --good:#62b182;
    --warn:#d9a441;
    --bad:#d4705f;
    --halo:rgba(17,20,24,.88);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 30px -12px rgba(0,0,0,.6);
    --water:#1d3340;
    --water-2:#233d4b;
    --rock:#3a3733;
    --rock-2:#44403b;
  }
}
:root[data-theme="dark"]{
  --bg:#111418;
  --panel:#181c22;
  --panel-2:#1f242c;
  --panel-3:#282e38;
  --ink:#ebe6da;
  --muted:#98a0ae;
  --faint:#646c7a;
  --line:#2c323d;
  --accent:#d9a955;
  --accent-soft:rgba(217,169,85,.18);
  --accent-ink:#1c1406;
  --good:#62b182;
  --warn:#d9a441;
  --bad:#d4705f;
  --halo:rgba(17,20,24,.88);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 30px -12px rgba(0,0,0,.6);
  --water:#1d3340;
  --water-2:#233d4b;
  --rock:#3a3733;
  --rock-2:#44403b;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'IBM Plex Sans',system-ui,sans-serif;
  font-size:13.5px;
  line-height:1.45;
}
.disp,h1,h2,h3{
  font-family:'Big Shoulders Display','Arial Narrow',sans-serif;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.04em;
  text-wrap:balance;
  margin:0;
}
.mono,code{font-family:'IBM Plex Mono',ui-monospace,monospace;}
code{font-size:.92em;background:var(--panel-3);padding:1px 5px;border-radius:4px;}
button,input,select,textarea{font:inherit;color:inherit;}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
[hidden]{display:none!important;}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important;} }

/* ---------- каркас ---------- */
#app{height:100%;display:flex;flex-direction:column;padding-inline:12px;padding-block:10px;gap:10px;}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:6px;}
.brand h1{font-size:22px;letter-spacing:.03em;}
.brand .sub{font-size:11px;color:var(--muted);}
.topbar .grow{flex:1 1 auto;}
.main{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:270px minmax(0,1fr) 350px;gap:10px;}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);min-height:0;display:flex;flex-direction:column;}
.pane-head{padding:10px 12px 8px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;}
.pane-head h2{font-size:14px;color:var(--muted);}
.pane-body{padding:10px 12px;overflow:auto;min-height:0;flex:1 1 auto;}
@media (max-width:1100px){
  #app{height:auto;min-height:100%;}
  .main{grid-template-columns:230px minmax(0,1fr);}
  .stage{height:78vh;}
  #outlinerPane{height:78vh;}
  #inspectorPane{grid-column:1 / -1;}
}
@media (max-width:760px){
  .main{grid-template-columns:1fr;}
  .stage{height:70vh;}
  #outlinerPane{height:auto;max-height:40vh;}
}

/* ---------- кнопки ---------- */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  font-weight:600;font-size:12.5px;
  padding:6px 11px;border-radius:7px;
  border:1px solid var(--line);background:var(--panel-2);
  cursor:pointer;white-space:nowrap;
}
.btn:hover{border-color:var(--accent);}
.btn:disabled{opacity:.45;cursor:default;border-color:var(--line);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
.btn.ghost{background:transparent;border-color:transparent;}
.btn.ghost:hover{background:var(--panel-2);border-color:var(--line);}
.btn.danger{color:var(--bad);}
.btn.small{padding:4px 8px;font-size:11.5px;border-radius:6px;}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);}
.btn .k{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--faint);font-weight:500;}
.btn svg.g{width:15px;height:15px;flex:0 0 auto;}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel-2);}
.seg .btn{border:0;border-radius:0;background:transparent;}
.seg .btn + .btn{border-left:1px solid var(--line);}
.seg .btn.on{background:var(--accent-soft);color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent);}

.savebox{display:flex;align-items:center;gap:8px;}
.savestate{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block;flex:0 0 auto;}
.dot.dirty{background:var(--warn);}
.savestate .dot{width:8px;height:8px;box-shadow:none;}
.problems-btn.has-err{color:var(--bad);border-color:color-mix(in srgb, var(--bad) 50%, var(--line));}
.problems-btn.has-warn{color:var(--warn);}

/* меню */
.menu-wrap{position:relative;}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:30;min-width:260px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;}
.menu button{display:flex;width:100%;text-align:left;gap:10px;align-items:baseline;padding:8px 10px;border:0;background:transparent;border-radius:6px;cursor:pointer;}
.menu button:hover{background:var(--panel-2);}
.menu button small{color:var(--muted);display:block;font-size:11px;}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 4px;}
.menu .danger{color:var(--bad);}

/* ---------- дерево ---------- */
.search{width:100%;padding:6px 9px;border-radius:7px;border:1px solid var(--line);background:var(--panel-2);}
.tree{display:flex;flex-direction:column;gap:1px;}
.row{
  display:flex;align-items:center;gap:6px;min-height:28px;
  padding:3px 6px;border-radius:6px;cursor:pointer;
  border:1px solid transparent;
}
.row:hover{background:var(--panel-2);}
.row.sel{background:var(--accent-soft);border-color:color-mix(in srgb, var(--accent) 45%, transparent);}
.row.ctx:not(.sel) .lbl{font-weight:600;}
.row.world{margin-top:6px;border-top:1px solid var(--line, rgba(255,255,255,.08));}
.row.world .lbl{font-weight:700;letter-spacing:.02em;}
.crworld{background:var(--panel-2);color:inherit;border:1px solid var(--line, rgba(255,255,255,.15));border-radius:6px;padding:3px 6px;font:inherit;font-size:12px;margin-right:6px;max-width:180px;}
.row .caret{width:16px;height:16px;display:grid;place-items:center;color:var(--faint);flex:0 0 auto;border-radius:4px;border:0;background:transparent;padding:0;cursor:pointer;}
.row .caret:hover{color:var(--ink);background:var(--panel-3);}
.row .caret.none{visibility:hidden;}
.row .lbl{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row .meta{color:var(--faint);font-size:11px;white-space:nowrap;}
.row .pdot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;}
.row .pdot.error{background:var(--bad);}
.row .pdot.warn{background:var(--warn);}
.row svg.g{width:16px;height:16px;flex:0 0 auto;}
.tree-group{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:600;padding:10px 6px 3px;}
.tree-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
.ttabs{display:flex;gap:2px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:2px;}
.ttab{flex:1 1 0;min-width:0;border:0;background:transparent;border-radius:6px;padding:5px 2px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ttab:hover{color:var(--ink);}
.ttab.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12);}
.node.flow{border-left:3px solid var(--accent);}
.utable{width:100%;border-collapse:collapse;font-size:12.5px;}
.utable td{border-top:1px solid var(--line);padding:5px 4px;vertical-align:top;}
.utable a{color:var(--accent);cursor:pointer;text-decoration:underline dotted;}

/* ---------- сцена ---------- */
.stage{min-height:0;display:flex;flex-direction:column;}
.crumbs{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.crumbs .c{border:0;background:transparent;padding:2px 4px;border-radius:5px;cursor:pointer;font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);}
.crumbs .c:hover{color:var(--ink);background:var(--panel-2);}
.crumbs .c.last{color:var(--ink);cursor:default;background:transparent;}
.crumbs .sep{color:var(--faint);}
.crumbs .grow{flex:1 1 auto;}
.toolbar{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.toolbar .lab{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:600;}
.toolbar .vr{width:1px;align-self:stretch;background:var(--line);margin:0 2px;}
.toolbar .grow{flex:1 1 auto;}
.toolbar .seg{flex-wrap:wrap;max-width:100%;}
.toolbar .seg .btn + .btn{border-left:0;box-shadow:-1px 0 0 var(--line);}
.toolbar .seg .btn.on{box-shadow:-1px 0 0 var(--line), inset 0 -2px 0 var(--accent);}
.place-grp{display:inline-flex;flex-direction:column;gap:2px;}
.sc-par{margin:-4px 0 6px 18px;padding:2px 10px;border-left:3px solid var(--accent);color:var(--accent);font-size:12px;font-weight:600;}
.place-grp .pg-lab{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);padding-left:3px;}
.toolbar input[type=number]{width:52px;padding:4px 6px;border-radius:6px;border:1px solid var(--line);background:var(--panel-2);}
.viewport{position:relative;flex:1 1 auto;min-height:280px;overflow:hidden;background:var(--panel-2);}
#mapSvg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;}
#terrainCv{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;}
#mapSvg.t-brush,#mapSvg.t-place,#mapSvg.t-pick{cursor:crosshair;}
#mapSvg.panning{cursor:grabbing;}
#mapSvg .obj{cursor:pointer;}
#mapSvg.t-brush .obj,#mapSvg.t-place .obj{cursor:crosshair;}
#mapSvg .obj:hover .hl{stroke:var(--accent);stroke-opacity:.8;}
#mapSvg text{font-family:'IBM Plex Sans',sans-serif;paint-order:stroke;stroke:var(--halo);stroke-width:0;stroke-linejoin:round;fill:var(--ink);pointer-events:none;}
#mapSvg text.onfill{stroke:none;}
.float-zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:4px;}
.float-zoom .btn{justify-content:center;width:34px;padding:6px 0;background:var(--panel);box-shadow:var(--shadow);}
.banner{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:8px;box-shadow:var(--shadow);font-weight:600;display:flex;gap:10px;align-items:center;max-width:calc(100% - 24px);}
.legend{position:absolute;left:10px;bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:11px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;box-shadow:var(--shadow);max-width:calc(100% - 70px);}
.view-opts{position:absolute;right:10px;top:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:11.5px;color:var(--muted);display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);opacity:.88;transition:opacity .12s;}
.view-opts:hover{opacity:1;}
.view-opts .check{gap:5px;align-items:center;}
.view-opts .check input{margin:0;}
.view-opts .vo-lab{color:var(--faint);}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;}
.statusbar{display:flex;gap:14px;align-items:center;padding:6px 10px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);min-height:30px;flex-wrap:wrap;}
.statusbar b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;}
.statusbar .hint{margin-left:auto;}

/* ---------- инспектор ---------- */
.ins-head{display:flex;align-items:center;gap:10px;padding:12px 12px 10px;border-bottom:1px solid var(--line);}
.ins-head .badge{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--panel-2);border:1px solid var(--line);flex:0 0 auto;}
.ins-head .badge svg{width:20px;height:20px;}
.ins-head .kind{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:600;}
.ins-head input.title{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:20px;text-transform:none;letter-spacing:.02em;border:1px solid transparent;background:transparent;padding:1px 4px;margin-left:-5px;border-radius:5px;width:100%;}
.ins-head input.title:hover{border-color:var(--line);}
.ins-head input.title:focus{border-color:var(--accent);background:var(--panel-2);}
.ins-head .titles{flex:1 1 auto;min-width:0;}
.ins-actions{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line);}
details.sec{border-bottom:1px solid var(--line);}
details.sec > summary{list-style:none;cursor:pointer;padding:9px 12px;display:flex;align-items:center;gap:8px;font-family:'Big Shoulders Display',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:13.5px;color:var(--muted);}
details.sec > summary::-webkit-details-marker{display:none;}
details.sec > summary::before{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .15s;margin-right:2px;}
details.sec[open] > summary::before{transform:rotate(45deg);}
details.sec > summary:hover{color:var(--ink);}
.sec-body{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px;}
.field{display:flex;flex-direction:column;gap:4px;}
.field > label, .field > span{font-size:11px;color:var(--muted);font-weight:600;}
.hint{font-size:11.5px;color:var(--muted);}
/* подсказки «?» (раунд 52) */
.tip{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;margin-left:5px;border-radius:50%;font:700 10px/1 'IBM Plex Sans',sans-serif;
  color:var(--accent);border:1px solid color-mix(in srgb, var(--accent) 55%, transparent);background:var(--accent-soft);cursor:help;vertical-align:1px;flex:0 0 auto;text-transform:none;letter-spacing:0;}
.tip:hover,.tip:focus{background:var(--accent);color:var(--accent-ink);outline:none;}
.tip.static{cursor:default;}
#tipBox{position:fixed;z-index:200;max-width:340px;padding:9px 12px;border-radius:9px;background:var(--ink);color:var(--panel);font-size:12.5px;line-height:1.45;
  box-shadow:var(--shadow);white-space:pre-line;pointer-events:none;}
details.shelp{margin-top:6px;}
details.shelp > summary{cursor:pointer;font-size:12px;color:var(--accent);list-style:none;}
details.shelp > summary::-webkit-details-marker{display:none;}
details.shelp > div{margin-top:5px;padding:8px 10px;border-radius:8px;background:var(--accent-soft);font-size:12.5px;line-height:1.5;white-space:pre-line;}
details.guide{margin:0 0 10px;border:1px dashed color-mix(in srgb, var(--accent) 50%, var(--line));border-radius:10px;padding:8px 10px;}
details.guide > summary{cursor:pointer;font-weight:600;}
.guide-body{font-size:12.5px;line-height:1.5;margin-top:6px;}
.guide-body p{margin:0 0 6px;}
.guide-tree{font-family:'IBM Plex Mono',monospace;font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;white-space:pre;overflow:auto;}
.hint.warn{color:var(--warn);}
.hint.bad{color:var(--bad);}
.hint.good{color:var(--good);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.checkgrid{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;margin:4px 0 6px;}
.checkgrid .check{font-size:12.5px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
input[type=text],input[type=number],select,textarea{
  width:100%;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--panel-2);min-width:0;
}
textarea{resize:vertical;min-height:70px;line-height:1.45;}
input[type=color]{width:44px;height:30px;padding:2px;border-radius:6px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;flex:0 0 auto;}
input[type=range]{width:100%;accent-color:var(--accent);}
.colorrow{display:flex;align-items:center;gap:8px;}
.colorrow .mono{font-size:11px;color:var(--muted);}
.check{display:flex;gap:8px;align-items:flex-start;cursor:pointer;}
.check input{margin-top:3px;accent-color:var(--accent);}
.list{display:flex;flex-direction:column;gap:4px;}
.li{display:flex;align-items:center;gap:8px;padding:5px 7px;border:1px solid var(--line);border-radius:7px;background:var(--panel-2);}
.li .lbl{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.li svg.g{width:15px;height:15px;flex:0 0 auto;}
.li .star{color:var(--accent);font-weight:700;}
.card{border:1px solid var(--line);border-radius:8px;padding:9px;background:var(--panel-2);display:flex;flex-direction:column;gap:8px;}
.card.accent{border-color:color-mix(in srgb, var(--accent) 55%, var(--line));}
.lootrow{display:grid;grid-template-columns:minmax(0,1fr) 58px auto;gap:6px;align-items:center;}
.lootrow2{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.pill{display:inline-block;padding:1px 7px;border-radius:99px;font-size:10.5px;font-weight:600;background:var(--panel-3);color:var(--muted);}
.pill.good{background:color-mix(in srgb, var(--good) 18%, transparent);color:var(--good);}
.pill.bad{background:color-mix(in srgb, var(--bad) 16%, transparent);color:var(--bad);}
.pill.acc{background:var(--accent-soft);color:var(--ink);}
.empty{color:var(--muted);text-align:center;padding:28px 10px;}
.stat{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);}
.stat b{color:var(--ink);font-variant-numeric:tabular-nums;}
.plist .p{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line);font-size:12px;}
.plist .p:last-child{border-bottom:0;}

/* ---------- модальные окна ---------- */
.modal{position:fixed;inset:0;z-index:50;background:rgba(15,12,6,.45);display:flex;align-items:center;justify-content:center;padding:16px;}
.modal-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);width:min(1180px,100%);max-height:100%;display:flex;flex-direction:column;min-height:0;}
.modal-box.narrow{width:min(620px,100%);}
.modal-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);}
.modal-head h2{font-size:20px;}
.modal-head .grow{flex:1 1 auto;}
.modal-body{overflow:auto;min-height:0;padding:14px 16px;}

.mon-body{padding:0;display:flex;min-height:0;flex:1;overflow:hidden;}
.mon-grid{display:grid;grid-template-columns:250px minmax(0,1fr) 360px;gap:0;flex:1;min-height:0;}
.mon-list,.mon-form,.mon-side{overflow:auto;min-height:0;padding:12px;}
.mon-list{border-right:1px solid var(--line);}
.mon-side{border-radius:0;border:0;border-left:1px solid var(--line);position:static;}
.mon-form{display:flex;flex-direction:column;gap:10px;}
.mon-form details.sec{border:1px solid var(--line);border-radius:10px;background:var(--panel-2);}
.mon-form details.sec > summary{padding:9px 12px;}
.mon-group{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:700;margin:10px 0 4px;}
.mon-row{display:flex;align-items:center;gap:7px;padding:5px 7px;border-radius:6px;cursor:pointer;font-size:13px;}
.mon-row:hover{background:var(--panel-2);}
.mon-row.sel{background:var(--accent-soft);}
.mon-row .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mon-row .meta{font-size:10.5px;color:var(--faint);}
.dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);}
.dot.big{width:34px;height:34px;}
.mon-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.mon-head .field input{font-size:18px;font-weight:700;}
.ring-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.ringpick svg{display:block;color:var(--ink);}
.ringsvg text{font-family:inherit;}
.mon-table{border-collapse:collapse;font-size:12px;width:100%;}
.mon-table th,.mon-table td{border:1px solid var(--line);padding:2px 6px;text-align:center;}
.mon-table th{color:var(--muted);font-weight:600;}
@keyframes mwShake{0%{transform:translate(0,0)}25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,1px)}100%{transform:translate(0,0)}}
@media (max-width:1100px){ .mon-grid{grid-template-columns:190px minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;} .mon-list{grid-row:1 / span 2;} .mon-side{grid-column:2;border-left:0;border-top:1px solid var(--line);max-height:46vh;display:grid;grid-template-columns:1fr 1fr;gap:0;align-content:start;} .mon-side .pv-top{grid-column:1 / -1;} }
.dlg{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start;}
@media (max-width:860px){ .dlg{grid-template-columns:1fr;} }
.node{border:1px solid var(--line);border-radius:10px;background:var(--panel-2);padding:10px;margin-bottom:10px;}
.node.start{border-color:var(--accent);}
.node.live{box-shadow:0 0 0 2px var(--accent-soft);}
.node-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.node-head .nid{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);}
.node-head .grow{flex:1 1 auto;}
.choice{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:6px;align-items:center;margin-top:6px;}
.choice .arrow{color:var(--faint);}
.choice-extra{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:6px;margin-top:4px;}
.fx{margin:4px 0 10px;border:1px dashed var(--line);border-radius:8px;background:var(--panel);}
.fx>summary{cursor:pointer;padding:6px 10px;font-size:12px;color:var(--muted);list-style:none;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.fx>summary::-webkit-details-marker{display:none;}
.fx>summary:hover{color:var(--ink);}
.fx-body{padding:4px 10px 10px;display:flex;flex-direction:column;gap:8px;}
.fx-body .lab{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.04em;}
.fx-row{display:grid;grid-template-columns:minmax(0,1fr) 70px auto;gap:6px;align-items:center;}
.fx-row.eq{grid-template-columns:minmax(0,1fr) 70px minmax(0,110px) 70px auto;}
.preview{position:sticky;top:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#15131a;color:#efeaf6;}
.preview .pv-top{padding:8px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#a9a3b8;display:flex;justify-content:space-between;align-items:center;}
.preview .pv-box{margin:0 10px 10px;border-radius:8px;background:#0e0d13;border:1px solid #2a2735;padding:12px;}
.preview .pv-name{display:inline-block;background:#35c7e6;color:#071116;font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:14px;padding:2px 10px;letter-spacing:.05em;text-transform:uppercase;transform:skewX(-8deg);margin-bottom:8px;}
.preview .pv-text{min-height:60px;white-space:pre-wrap;}
.preview .pv-choices{display:flex;flex-direction:column;gap:6px;margin-top:10px;}
.preview .pv-choice{text-align:left;border:1px solid #33304a;background:#1c1a26;color:#efeaf6;border-radius:6px;padding:7px 10px;cursor:pointer;}
.preview .pv-choice:hover{border-color:#35c7e6;}
.preview .pv-end{color:#a9a3b8;font-size:12px;margin-top:10px;}
.preview .btn{background:#1c1a26;border-color:#33304a;color:#efeaf6;}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:baseline;}
.kbd{font-family:'IBM Plex Mono',monospace;font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--panel-2);white-space:nowrap;}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;}

.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--panel);padding:9px 14px;border-radius:9px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);}
/* ---------- удобства раскладки: ширина и скрытие боковых панелей ---------- */
.pane{position:relative;}
.resizer{position:absolute;top:8px;bottom:8px;width:10px;cursor:col-resize;z-index:5;touch-action:none;}
#outlinerPane > .resizer{right:-10px;}
#inspectorPane > .resizer{left:-10px;}
.resizer::after{content:"";position:absolute;top:50%;left:3px;width:4px;height:42px;margin-top:-21px;border-radius:3px;background:var(--line);opacity:0;transition:opacity .12s;}
.resizer:hover::after,.resizer.drag::after{opacity:1;background:var(--accent);}
body.resizing{cursor:col-resize;user-select:none;}
@media (min-width:1101px){

  .main.no-right{grid-template-columns:var(--lw,270px) minmax(0,1fr);}
  .main.no-left.no-right{grid-template-columns:minmax(0,1fr);}

// предметы/снаряжение/приёмы с правками мира: запись state.* с тем же id заменяет встроенную
function mergedDefs(builtin, custom){ const cs = Array.isArray(custom) ? custom : []; const out = builtin.map(d=> cs.find(c=>c.id===d.id) || d); cs.forEach(c=>{ if (!builtin.some(d=>d.id===c.id)) out.push(c); }); return out; }
function itemDefs(){ return mergedDefs(GAME_ITEM_DEFS, state && state.items); }
function equipDefs(){ return mergedDefs(GAME_EQUIP_DEFS, state && state.equipment); }
function skillDefs(){ const cs = (state && state.skills) || []; const out = GAME_SKILLS.map(d=>{ const o = cs.find(c=>c.id===d.id); return o ? Object.assign({}, d, o, {builtin:true}) : Object.assign({}, d, {builtin:true}); }); cs.forEach(c=>{ if (!GAME_SKILLS.some(d=>d.id===c.id)) out.push(c); }); return out; }
const CLS_RU = {warrior:"воин", mage:"маг", any:""};
const CLASSED = ["weapon","armor","helmet"];
function equipCatalog(){ return equipDefs().filter(e=>!e.hidden).map(e=>({id:e.id, name:(e.name||e.id) + (CLASSED.includes(e.category) && CLS_RU[e.cls] ? " · " + CLS_RU[e.cls] : ""), category:e.category})); }
function itemCatalog(){
  const out = [{id:"gold", name:"Золото (монеты)", category:"gold"}];
  itemDefs().forEach(i=> out.push({id:i.id, name:(i.name||i.id) + (i.rare ? " (редкое)" : ""), category:i.kind||"consumable"}));
  (state && state.keys || []).forEach(k=> out.push({id:"key:" + k.id, name:(k.name||k.id) + " · ключ", category:"key"}));
  (state && state.materials || []).forEach(m=> out.push({id:m.id, name:(m.name||m.id) + (m.rare ? " (редкое)" : "") + " · своё", category:"material"}));
  // раунд 79: чертежи кузницы — в сундук, лавку, награду; попав в сумку, изучаются сразу
  if (typeof DEFAULT_FORGE !== "undefined") craftList("forge").forEach(r=>{ if (!r.known) out.push({id:"blueprint:" + r.id, name:"Чертёж: " + craftResultName("forge", r.result), category:"blueprint"}); });
  return out.concat(equipCatalog());
}

// ВЫНОСЛИВОСТЬ и ПОДГОТОВКА (раунд 44) — зеркало AttackDB.stamina_cost / is_prep
const STAM_MAX = 100;
function atkStamAuto(d){
  if (!d) return 20;
  if (Number(d.tired)>0) return STAM_MAX;
  const k = d.kind || "hit", mult = d.mult==null ? 1 : Number(d.mult);
  if (k === "series") return 22 + 8 * Math.max((d.hits||[]).length, 1) + Math.floor(Math.max(mult-1, 0) * 30);
  if (k === "throw") return 24;
  if (k === "buff") return ["summon","heal","charge","take_off"].includes(d.effect) ? 20 : 12;
  let n = (d.cells||[0]).length;
  const r = d.rand;
  if (Array.isArray(r) && r.length) n += Math.round((Number(r[0]) + Number(r[r.length-1])) / 2);
  else if (typeof r === "number") n += r;
  if (d.area === "all" || d.area === "all_but") n = 3;
  return Math.max(10, Math.min(60, 14 + 6*n + Math.floor(Math.max(mult-1, 0) * 35)));
}
function atkPrepAuto(d){
  if (!d) return false;
  const k = d.kind || "hit";
  if (k === "series" || k === "throw" || d.unavoidable) return true;
  if (k === "buff") return ["summon","heal","charge","take_off","rage"].includes(d.effect);
  return d.area === "all" || d.area === "all_but" || Number(d.mult||1) >= 1.4;
}

function supportAuto(d){
  const out = ["shot"];
  (d.pool||[]).forEach(e=>{ const ef = (attackDef(e.t)||{}).effect;
    if (ef === "heal" && !out.includes("heal")) out.push("heal");

    else if ((ef === "haste" || ef === "rage") && !out.includes("rally")) out.push("rally"); });
  return out;
}

let saveTimer = null;
let lastWorkT = 0;
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveWorkNow, 800);
  scheduleGameAutosave();
}
function saveWorkNow(){
  saveTimer = null;
  const json = JSON.stringify(state);
  lastWorkT = Date.now();
  idbWork("put", "state", {json, t:lastWorkT});
  if (json.length < 3000000) lsSet(LS_STATE, json);
  lsSet(LS_STATE + "_t", String(lastWorkT));
  saveUi();
  maybeBackup(json);
}
// хранилище «work»: {state, bak:<время>}
async function idbWork(op, key, val){
  try{
    const db = await idb();
    return await new Promise(r=>{
      const tx = db.transaction("work", op==="get" || op==="keys" ? "readonly" : "readwrite");
      const st = tx.objectStore("work");
      const q = op==="get" ? st.get(key) : op==="keys" ? st.getAllKeys() : op==="del" ? st.delete(key) : st.put(val, key);
      q.onsuccess = ()=> r(op==="get" || op==="keys" ? (q.result ?? null) : true);
      q.onerror = ()=> r(null);
    });
  }catch(e){ return null; }
}
// резервная копия раз в 10 минут работы (и перед каждой записью в игру), хранится 20 последних
const BACKUP_EVERY = 10 * 60 * 1000, BACKUP_KEEP = 20;
let lastBackupT = 0, lastBackupHash = "";
async function maybeBackup(json, force){
  const now = Date.now();
  if (!force && now - lastBackupT < BACKUP_EVERY) return;
  const h = hashStr(json);
  if (h === lastBackupHash) return;
  lastBackupT = now; lastBackupHash = h;
  await idbWork("put", "bak:" + now, {json, t:now, maps:Object.keys(state.worldMaps).length, size:json.length});
  const keys = ((await idbWork("keys")) || []).filter(k=>String(k).startsWith("bak:")).sort();
  for (const k of keys.slice(0, Math.max(0, keys.length - BACKUP_KEEP))) await idbWork("del", k);
}
async function openBackups(){
  const keys = ((await idbWork("keys")) || []).filter(k=>String(k).startsWith("bak:")).sort().reverse();
  const recs = [];
  for (const k of keys){ const r = await idbWork("get", k); if (r) recs.push([k, r]); }
  const fmt = (t)=>{ const d = new Date(t); return d.toLocaleString("ru-RU", {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"}); };
  openSimpleModal("Резервные копии", recs.length ? `<p class="hint">Редактор сам сохраняет копию мира раз в 10 минут работы и перед каждой записью в игру (последние ${BACKUP_KEEP}). «Вернуть» заменяет мир в редакторе — отменить можно через Ctrl+Z.</p>
    <div class="list">${recs.map(([k, r])=>`<div class="li"><span class="lbl">${fmt(r.t)}</span><span class="pill">${Math.round((r.size||r.json.length)/1024)} КБ</span><button class="btn small" data-bak="${esc(k)}">Вернуть</button><button class="btn small" data-bakdl="${esc(k)}">Скачать</button></div>`).join("")}</div>`
    : `<p class="hint">Пока нет копий — первая появится через 10 минут работы или при записи в игру.</p>`, (root, close)=>{
      root.querySelectorAll("[data-bak]").forEach(b=> b.onclick = async ()=>{ const r = await idbWork("get", b.dataset.bak); if (!r) return; close(); loadState(JSON.parse(r.json), "копия от " + fmt(r.t)); });
      root.querySelectorAll("[data-bakdl]").forEach(b=> b.onclick = async ()=>{ const r = await idbWork("get", b.dataset.bakdl); if (r) downloadText(`mapwright-backup_${new Date(r.t).toISOString().slice(0,16).replace(/[:T]/g,"-")}.json`, r.json); });
    });
}
// АВТОЗАПИСЬ В ИГРУ: файл world_data.json выбран и браузер разрешил запись —
// через 4 с после правки мир сам уходит в игру (перезапустите игру, чтобы увидеть).
let gameAutoTimer = null, gameAutoBusy = false;
function scheduleGameAutosave(){
  if (!ui.autoGame || !fileHandle) return;
  clearTimeout(gameAutoTimer);
  gameAutoTimer = setTimeout(gameAutosaveNow, 4000);
}
async function gameAutosaveNow(){
  if (!ui.autoGame || !fileHandle || gameAutoBusy) return;
  if (!isGameDirty()) return;
  try{
    if ((await fileHandle.queryPermission({mode:"readwrite"})) !== "granted"){ ui.autoGameBlocked = true; renderTopbar(); return; }
    gameAutoBusy = true;
    const w = await fileHandle.createWritable();
    await w.write(stateText());
    await w.close();
    ui.autoGameBlocked = false;
    markSaved();
  }catch(e){ ui.autoGameBlocked = true; renderTopbar(); }
  finally{ gameAutoBusy = false; }
}
async function toggleAutoGame(){

  saveUi();
  if (ui.autoGame){
    if (!fileHandle){ await saveToGame(true); if (!fileHandle){ ui.autoGame = false; saveUi(); renderTopbar(); return; } }
    try{ if ((await fileHandle.queryPermission({mode:"readwrite"})) !== "granted") await fileHandle.requestPermission({mode:"readwrite"}); }catch(e){}
    ui.autoGameBlocked = false;
    toast(`Автозапись в игру включена: правки уходят в ${fileHandle.name} сами через несколько секунд`);
    gameAutosaveNow();

}

/* ======================= история (отмена/повтор) ======================
   baseline — снимок последнего "закреплённого" состояния. commit() после
   любого законченного действия; мелкие правки (ввод текста, перетаскивание,
   кисть) закрепляются одним шагом по окончании. */
let baseline = "";
let undoStack = [];
let redoStack = [];
const HISTORY_MAX = 150;
// История — полные снимки мира. На большом мире 150 снимков — сотни мегабайт и
// вкладка падает; держим не больше ~250 МБ (но не меньше 20 шагов отмены).
const HISTORY_BUDGET = 120e6;   // символов (≈ 2 байта каждый)
function trimHistory(stack){
  let total = 0;
  for (const x of stack) total += x.length;
  while (stack.length > 20 && total > HISTORY_BUDGET) total -= stack.shift().length;
}
let craftDraft = null;   // раунд 46: рецепты, открытые в инспекторе, но ещё не скопированные в мир
let defDraft = null;     // раунд 49: встроенный предмет/вещь/приём, открытый в инспекторе ({key, obj, orig})
// Запись для правки: своя из state[key] или копия встроенной (попадёт в мир только после первой правки)
function defEdit(key, builtin, id, pick){
  const list = Array.isArray(state[key]) ? state[key] : [];
  const own = list.find(x=>x.id===id);
  if (own) return own;
  if (defDraft && defDraft.key===key && defDraft.obj.id===id) return defDraft.obj;
  const b = builtin.find(x=>x.id===id);
  if (!b) return null;
  const o = deepCopy(pick ? pick(b) : b);
  defDraft = {key, obj:o, orig:JSON.stringify(o)};
  return o;
}
function commit(){
  if (defDraft && JSON.stringify(defDraft.obj) !== defDraft.orig){
    const L = state[defDraft.key] = Array.isArray(state[defDraft.key]) ? state[defDraft.key] : [];
    if (!L.includes(defDraft.obj) && !L.some(x=>x.id===defDraft.obj.id)) L.push(defDraft.obj);
    defDraft = null;
  }
  // правка встроенного рецепта — только теперь копируем встроенные в мир
  if (craftDraft && !Array.isArray(state[craftDraft.kind]) && JSON.stringify(craftDraft.list) !== craftDraft.orig) state[craftDraft.kind] = craftDraft.list;
  const cur = JSON.stringify(state);
  if (cur === baseline) return false;
  cellsRev++;
  undoStack.push(baseline);
  if (undoStack.length > HISTORY_MAX) undoStack.shift();
  trimHistory(undoStack);
  redoStack = [];
  baseline = cur;
  scheduleSave();
  return true;
}
function undo(){
  commit();
  if (!undoStack.length){ toast("Отменять нечего"); return; }
  redoStack.push(baseline);
  baseline = undoStack.pop();
  state = JSON.parse(baseline);
  afterHistoryJump();
  toast("Отменено");
}
function redo(){
  commit();
  if (!redoStack.length){ toast("Повторять нечего"); return; }
  undoStack.push(baseline);
  baseline = redoStack.pop();
  state = JSON.parse(baseline);
  afterHistoryJump();
  toast("Повторено");
}
function afterHistoryJump(){
  cellsRev++;
  syncCustomProps();
  if (ui.sel && !selExists(ui.sel)) ui.sel = null;
  if (!ctxExists(ui.ctx)) ui.ctx = {kind:"map", id:firstMapId()};
  scheduleSave();
  render();
}

/* ============================ утилиты ============================ */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function clamp(n,a,b){ return Math.max(a, Math.min(b, n)); }
function round2(n){ return Math.round(n*100)/100; }
function snap(n){ return Math.round(n*2)/2; }
function sanitizeId(s){ const v = String(s||"").trim().replace(/[^a-zA-Z0-9_]/g,"_"); return v || "id"; }
function hashStr(s){ let h = 5381; for (let i=0;i<s.length;i++) h = ((h<<5)+h + s.charCodeAt(i))|0; return String(h>>>0); }
function deepCopy(o){ return JSON.parse(JSON.stringify(o)); }
function plural(n, one, few, many){ const m10=n%10, m100=n%100; if (m10===1 && m100!==11) return one; if (m10>=2 && m10<=4 && (m100<10||m100>=20)) return few; return many; }

function cellOf(x,z){ return [Math.floor((x + CELL/2)/CELL), Math.floor((z + CELL/2)/CELL)]; }
function cellKey(cx,cz){ return `${cx},${cz}`; }
function parseKey(k){ return k.split(",").map(Number); }
function cellCenter(cx,cz){ return [cx*CELL, cz*CELL]; }
function cellBounds(cells){
  const keys = Object.keys(cells||{});
  if (!keys.length) return {minCx:-1,maxCx:1,minCz:-1,maxCz:1,empty:true};
  let a=Infinity,b=-Infinity,c=Infinity,d=-Infinity;
  keys.forEach(k=>{ const [x,z]=parseKey(k); a=Math.min(a,x); b=Math.max(b,x); c=Math.min(c,z); d=Math.max(d,z); });
  return {minCx:a,maxCx:b,minCz:c,maxCz:d,empty:false};
}
function shade(hex, amt){
  let r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  const f = amt>=0 ? (v=>v+(255-v)*amt) : (v=>v*(1+amt));
  return "#"+[r,g,b].map(v=>clamp(Math.round(f(v)),0,255).toString(16).padStart(2,"0")).join("");
}
function validHex(h, fallback){ return /^#[0-9a-fA-F]{6}$/.test(String(h||"")) ? h : fallback; }

/* ============================ модель ============================ */
function firstMapId(){ return state.worldMaps.overworld ? "overworld" : (Object.keys(state.worldMaps)[0] || "overworld"); }
function mapName(id){ if (id===BACK) return "туда, откуда пришли"; const m = state.worldMaps[id]; return m ? (m.name||id) : `«${id}» (нет такой карты)`; }
function allFloors(){ const out=[]; state.houses.forEach(h=>{ if (h.type!=="cave") (h.floors||[]).forEach(f=>out.push({house:h, floor:f})); }); return out; }
function findFloor(fid){ for (const h of state.houses){ if (h.type==="cave") continue; for (const f of (h.floors||[])) if (f.id===fid) return {house:h, floor:f}; } return null; }
function areaExists(area){ return !!state.worldMaps[area] || !!findFloor(area); }
function areaCtx(area){ if (state.worldMaps[area]) return {kind:"map", id:area}; if (findFloor(area)) return {kind:"floor", id:area}; return null; }
function areaLabel(area){
  if (state.worldMaps[area]) return mapName(area);
  const ff = findFloor(area); if (ff) return `${ff.house.name} › ${ff.floor.name}`;
  return `«${area}» (не найдено)`;
}
function areaCells(area){ if (state.worldMaps[area]) return state.worldMaps[area].cells; const ff=findFloor(area); return ff ? (ff.floor.cells||{}) : {}; }
function onCells(area, x, z){ const [cx,cz]=cellOf(x,z); return !!areaCells(area)[cellKey(cx,cz)]; }
function firstCellPos(cells){
  const keys = Object.keys(cells||{});
  if (!keys.length) return [0,0];
  // клетка, ближайшая к центру нарисованного
  const b = cellBounds(cells); const mx=(b.minCx+b.maxCx)/2, mz=(b.minCz+b.maxCz)/2;
  let best=keys[0], bd=Infinity;
  keys.forEach(k=>{ const [x,z]=parseKey(k); const d=(x-mx)**2+(z-mz)**2; if (d<bd){bd=d;best=k;} });
  const [x,z]=parseKey(best); return cellCenter(x,z);
}
function ctxExists(c){ return c && (c.kind==="map" ? !!state.worldMaps[c.id] : !!findFloor(c.id)); }
function ctxKey(c){ c=c||ui.ctx; return c.kind+":"+c.id; }
function ctxCells(){ return ui.ctx.kind==="map" ? state.worldMaps[ui.ctx.id].cells : (findFloor(ui.ctx.id).floor.cells ||= {}); }
function isFloorCtx(){ return ui.ctx.kind==="floor"; }

function allIds(){
  const s = new Set();
  state.npcs.forEach(x=>s.add(x.id));
  state.houses.forEach(h=>{ s.add(h.id); (h.floors||[]).forEach(f=>s.add(f.id)); });
  Object.keys(state.worldMaps).forEach(k=>s.add(k));
  state.containers.forEach(c=>s.add(c.id));
  (state.battles||[]).forEach(b=>s.add(b.id));
  (state.props||[]).forEach(p=>s.add(p.id));
  (state.paths||[]).forEach(p=>s.add(p.id));
  (state.mechs||[]).forEach(p=>s.add(p.id));
  (state.towns||[]).forEach(t=>s.add(t.id));
  (state.caterpillars||[]).forEach(t=>s.add(t.id));
  (state.companionTalks||[]).forEach(t=>s.add(t.id));
  (state.cutscenes||[]).forEach(t=>s.add(t.id));
  (state.quests||[]).forEach(t=>s.add(t.id));
  return s;
}
function uid(prefix){ const ex = allIds(); let n=1; while (ex.has(prefix+"_"+n)) n++; return prefix+"_"+n; }
function uidIn(list, prefix){ const ex = new Set(list.map(x=>x.id)); let n=1; while (ex.has(prefix+"_"+n)) n++; return prefix+"_"+n; }

// направление перехода — к соседу, которого нет на карте (как world.gd::_exit_dir)
function exitDir(cells, cx, cz){
  for (const [dx,dz] of [[0,-1],[1,0],[-1,0],[0,1]]) if (!cells[cellKey(cx+dx,cz+dz)]) return [dx,dz];
  return [0,-1];
}

// все переходы (порталы клеток) всех карт
let _trCache = null;
function allTransitions(){
  if (_trCache && _trCache.rev === cellsRev && _trCache.state === state) return _trCache.out;
  const out = [];
  Object.keys(state.worldMaps).forEach(mid=>{
    const cells = state.worldMaps[mid].cells;
    Object.keys(cells).forEach(k=>{ if (cells[k] && cells[k].portal) out.push({map:mid, key:k, portal:cells[k].portal}); });
  });
  _trCache = {rev: cellsRev, state, out};
  return out;
}

/* выделение: {type, id} | {type:"transition", map, key} | {type:"exit", floor, id}
   | {type:"map", id} | {type:"floor", id} */
function getSelObj(sel){
  sel = sel || ui.sel;
  if (!sel) return null;
  switch (sel.type){
    case "npc": return state.npcs.find(x=>x.id===sel.id) || null;
    case "house": return state.houses.find(x=>x.id===sel.id) || null;
    case "container": return state.containers.find(x=>x.id===sel.id) || null;
    case "town": return state.towns.find(x=>x.id===sel.id) || null;
    case "cat": return (state.caterpillars||[]).find(x=>x.id===sel.id) || null;
    case "cats": return state;
    case "battle": return (state.battles||[]).find(x=>x.id===sel.id) || null;
    case "prop": return (state.props||[]).find(x=>x.id===sel.id) || null;
    case "path": return (state.paths||[]).find(x=>x.id===sel.id) || null;
    case "mech": return (state.mechs||[]).find(x=>x.id===sel.id) || null;
    case "key": return (state.keys||[]).find(x=>x.id===sel.id) || null;
    case "keys": return state;
    case "crafts_alchemy": case "crafts_forge": return state;
    case "recipe": { const [kind, rid] = String(sel.id).split(":"); return craftList(kind).find(r=>r.id===rid) || null; }
    case "scene": return (state.cutscenes||[]).find(x=>x.id===sel.id) || null;
    case "quest": return (state.quests||[]).find(x=>x.id===sel.id) || null;
    case "quests": return state;
    case "monsters": return state;
    case "item": return itemDefs().find(x=>x.id===sel.id) || null;
    case "equip": return equipDefs().find(x=>x.id===sel.id) || null;
    case "skill": return skillDefs().find(x=>x.id===sel.id) || null;
    case "items": case "equips": case "skills": case "gamestart": case "flags": case "skilltree": case "tutorial": return state;
    case "scenes": return sel.id==="lira" ? state.companionStart : state;   // значок «Лира ждёт» двигает её место
    case "start": return state.playerStart || null;
    case "talk": return state.companionTalks.find(x=>x.id===sel.id) || null;
    case "map": return state.worldMaps[sel.id] || null;
    case "floor": { const ff=findFloor(sel.id); return ff ? ff.floor : null; }
    case "exit": { const ff=findFloor(sel.floor); return ff ? (ff.floor.exits.find(e=>e.id===sel.id)||null) : null; }
    case "transition": { const m=state.worldMaps[sel.map]; const c=m && m.cells[sel.key]; return c && c.portal ? c : null; }
  }
  return null;
}
function selExists(sel){ return !!getSelObj(sel); }
function sameSel(a,b){ return !!a && !!b && a.type===b.type && a.id===b.id && a.key===b.key && a.map===b.map && a.floor===b.floor; }
function selCtx(sel){
  const o = getSelObj(sel);
  if (!o) return null;
  switch (sel.type){
    case "npc": case "container": case "town": case "battle": case "prop": case "path": case "mech": case "cat": return areaCtx(o.area);
    case "talk": return o.trigger==="place" ? areaCtx(o.area) : null;
    case "scene": return o.trigger==="zone" ? areaCtx(o.area) : null;
    case "scenes": return sel.id==="lira" ? areaCtx(o.area) : null;
    case "start": return {kind:"map", id:o.area};
    case "house": return areaCtx(o.area);
    case "map": return {kind:"map", id:sel.id};
    case "floor": return {kind:"floor", id:sel.id};
    case "exit": return {kind:"floor", id:sel.floor};
    case "transition": return {kind:"map", id:sel.map};
  }
  return null;
}
function selPos(sel){
  const o = getSelObj(sel);
  if (!o) return null;
  if (sel.type==="transition"){ const [cx,cz]=parseKey(sel.key); return cellCenter(cx,cz); }
  if (sel.type==="talk" && o.trigger!=="place") return null;
  if (sel.type==="scene" && o.trigger!=="zone") return null;
  if (sel.type==="quest" || sel.type==="quests") return null;
  if (sel.type==="scenes") return sel.id==="lira" ? [o.x, o.z] : null;
  if ("x" in o && "z" in o) return [o.x, o.z];
  return null;
}
/* ============================ навигация ============================ */
function openCtx(ctx, opts={}){

}
function navBack(){

  }

// Выбрать объект: открыть его карту/этаж, выделить, показать на холсте
const TREE_TABS = [["world","Миры"],["story","Сюжет"],["battle","Бой"],["items","Вещи"],["game","Игра"]];
function tabOfSel(sel){
  const t = sel && sel.type;

  if (["monsters","skill","skills","skilltree"].includes(t)) return "battle";

/* ============================ миры и вложенные карты (раунд 57) ============================ */
// m.parent: нет поля — авто (пещера — под картой, откуда в неё вход; обычная
// карта — отдельный мир); "" — отдельный мир (регион); "<id>" — внутри карты.
// Только для удобства редактора: игра это поле не читает.
function autoMapParent(mid){
  const h = state.houses.find(h=> h.type==="cave" && h.targetMap===mid && h.area!==mid && state.worldMaps[h.area]);
  if (h) return h.area;
  const t = allTransitions().find(t=> t.portal.targetMap===mid && t.map!==mid && state.worldMaps[t.map]);
  return t ? t.map : "";
}
function rawMapParent(mid){
  const m = state.worldMaps[mid];
  if (!m) return "";
  if (m.parent !== undefined && m.parent !== null) return m.parent;
  return m.isCave ? autoMapParent(mid) : "";
}
function mapParent(mid){
  const p = rawMapParent(mid);
  if (!p || p === mid || !state.worldMaps[p]) return "";
  // без циклов: если, поднимаясь, вернулись к себе — это отдельный мир
  const seen = new Set([mid]);
  let cur = p;
  while (cur){
    if (seen.has(cur)) return "";
    seen.add(cur);
    cur = state.worldMaps[cur] ? rawMapParent(cur) : "";
  }
  return p;
}
function mapChain(mid){   // [мир, …, карта]
  const out = [mid];
  let cur = mapParent(mid);
  while (cur && out.length < 20){ out.unshift(cur); cur = mapParent(cur); }
  return out;
}
function mapRoots(){
  return Object.keys(state.worldMaps).filter(id=> !mapParent(id)).sort((a,b)=> (a==="overworld"?-1:b==="overworld"?1:0));
}
function mapKids(pid){
  return Object.keys(state.worldMaps).filter(id=> id !== pid && mapParent(id) === pid);
}
function isMapInside(mid, ancestor){   // mid лежит внутри ancestor (на любой глубине)
  let cur = mapParent(mid), n = 0;
  while (cur && n++ < 30){ if (cur === ancestor) return true; cur = mapParent(cur); }
  return false;
}
function currentMapId(){

function beamPath(m){
  const cells = ctxCells(), here = (state.mechs||[]).filter(x=>x.area===m.area);
  let [cx, cz] = cellOf(m.x, m.z);
  let d = ({south:[0,1], north:[0,-1], east:[1,0], west:[-1,0]})[m.dir||"east"] || [1,0];
  const pts = [cellCenter(cx, cz)], e0 = Number((cells[cellKey(cx,cz)]||{}).elevation)||0, seen = new Set();
  const solid = ["block","secret","door","beam","mirror","receiver","dial","arrows"];
  for (let i = 0; i < 60; i++){
    const nx = cx + d[0], nz = cz + d[1], nc = cells[cellKey(nx, nz)], cc = cellCenter(cx, cz);
    const edge = [cc[0] + d[0]*CELL/2, cc[1] + d[1]*CELL/2];
    if (!nc || (Number(nc.elevation)||0) > e0){ pts.push(edge); return pts; }
    const key = nx+","+nz+","+d; if (seen.has(key)) return pts; seen.add(key);
    const o = here.find(x=>x!==m && solid.includes(x.type) && (()=>{ const c = cellOf(x.x, x.z); return c[0]===nx && c[1]===nz; })());
    const ncc = cellCenter(nx, nz);
    if (o){
      if (o.type==="mirror"){ pts.push(ncc); d = (Number(o.turn)||0)===0 ? [-d[1], -d[0]] : [d[1], d[0]]; }
      else if (o.type==="receiver"){ pts.push(ncc); pts.hit = o.id; return pts; }
      else if (o.type==="door" || o.type==="secret"){ pts.push(edge); return pts; }
      else { pts.push([ncc[0] - d[0]*1.2, ncc[1] - d[1]*1.2]); return pts; }
    }
    cx = nx; cz = nz;
  }
  return pts;
}

    nf.exits[0].x = px + 1.5; nf.exits[0].z = pz;
  }
  return fid;
}
const EXIT_LOOKS = [["","круг на полу (как раньше)"],["stairs_up","лестница вверх"],["stairs_down","лестница вниз (проём в полу)"],["spiral","винтовая лестница"],["ladder","приставная лестница"]];

/* ============================ удаление ============================ */
function deleteSel(sel, quiet){
  sel = sel || ui.sel;
  const o = getSelObj(sel);
  if (!o) return;
  if (sel.type==="start"){ if (!quiet) toast("Старт игрока удалить нельзя — перетащите его или укажите новое место"); return; }
  let what = "";
  switch (sel.type){
    case "npc":
      state.npcs = state.npcs.filter(x=>x!==o); what = `«${o.name}»`; break;
    case "container":
      state.containers = state.containers.filter(x=>x!==o); what = `«${o.name}»`; break;
    case "town":
      state.towns = state.towns.filter(x=>x!==o); what = `город «${o.name}»`; break;
    case "cat":
      state.caterpillars = state.caterpillars.filter(x=>x!==o); what = "золотую гусеницу"; break;
    case "battle":
      state.battles = state.battles.filter(x=>x!==o); what = `бой «${o.name}»`; break;
    case "prop":
      state.props = state.props.filter(x=>x!==o); what = `«${propName(o.type)}»`; break;
    case "mech":
      state.mechs = state.mechs.filter(x=>x!==o);
      state.mechs.forEach(m=>{ if (Array.isArray(m.needs)) m.needs = m.needs.filter(n=>n!==o.id); });
      what = `«${mechName(o)}»`; break;
    case "key":
      state.keys = state.keys.filter(x=>x!==o); what = `ключ «${o.name}»`; break;
    case "path":
      state.paths = state.paths.filter(x=>x!==o); what = `«${PATH_KINDS_MAP[o.kind]||"дорожку"}»`; if (ui.pathDraw===o.id) ui.pathDraw = null; break;
    case "talk":
      state.companionTalks = state.companionTalks.filter(x=>x!==o); what = `разговор «${o.title||o.id}»`; break;
    case "scene":
      state.cutscenes = state.cutscenes.filter(x=>x!==o); what = `сцену «${o.name||o.id}»`; break;
    case "quest":
      state.quests = state.quests.filter(x=>x!==o); what = `задание «${o.name||o.id}»`; break;
    case "house": {
      const fids = new Set((o.type!=="cave" ? o.floors||[] : []).map(f=>f.id));
      const lost = state.npcs.filter(n=>fids.has(n.area)).length + state.containers.filter(c=>fids.has(c.area)).length;
      state.npcs = state.npcs.filter(n=>!fids.has(n.area));
      state.containers = state.containers.filter(c=>!fids.has(c.area));
      state.props = state.props.filter(c=>!fids.has(c.area));
      state.mechs = state.mechs.filter(c=>!fids.has(c.area));
      state.battles = state.battles.filter(c=>!fids.has(c.area));
      state.houses = state.houses.filter(x=>x!==o);
      what = `«${o.name}»` + (lost ? ` и ${lost} ${plural(lost,"объект","объекта","объектов")} внутри` : "");
      break;
    }
    case "transition":
      delete o.portal; what = "переход"; break;
    case "exit": {
      const f = findFloor(sel.floor).floor;
      f.exits = f.exits.filter(e=>e!==o); what = `выход «${o.label}»`; break;
    }
    case "floor": {
      const ff = findFloor(sel.id);
      if (ff.house.floors.length <= 1){ toast("У дома должен остаться хотя бы один этаж"); return; }
      const h = ff.house;
      h.floors = h.floors.filter(f=>f!==ff.floor);
      h.floors.forEach(f=> f.exits.forEach(e=>{ if (e.target===sel.id){ e.target="world"; e.targetSpawn=""; } }));
      if (h.enterFloor===sel.id){ h.enterFloor = h.floors[0].id; h.enterSpawn = (h.floors[0].exits[0]||{}).id || ""; }
      state.npcs = state.npcs.filter(n=>n.area!==sel.id);
      state.containers = state.containers.filter(c=>c.area!==sel.id);
      state.props = state.props.filter(c=>c.area!==sel.id);
      state.mechs = state.mechs.filter(c=>c.area!==sel.id);
      state.battles = state.battles.filter(c=>c.area!==sel.id);
      what = `этаж «${ff.floor.name}»`;
      ui.ctx = {kind:"map", id:h.area};
      ui.sel = {type:"house", id:h.id};
      break;
    }
    case "map": {
      if (sel.id === "overworld"){ toast("Главную карту «Мир» удалить нельзя"); return; }
      const mid = sel.id;
      const doomedHouses = state.houses.filter(h=>h.area===mid);
      const fids = new Set(); doomedHouses.forEach(h=> (h.floors||[]).forEach(f=>fids.add(f.id)));
      state.houses = state.houses.filter(h=>h.area!==mid);
      state.npcs = state.npcs.filter(n=>n.area!==mid && !fids.has(n.area));
      state.containers = state.containers.filter(c=>c.area!==mid && !fids.has(c.area));
      state.towns = state.towns.filter(t=>t.area!==mid);
      state.caterpillars = (state.caterpillars||[]).filter(c=>c.area!==mid && !fids.has(c.area));
      state.props = state.props.filter(c=>c.area!==mid && !fids.has(c.area));
      state.mechs = state.mechs.filter(c=>c.area!==mid && !fids.has(c.area));
      state.battles = state.battles.filter(c=>c.area!==mid && !fids.has(c.area));
      // карты внутри удалённой — не пропадают: встают туда, где была она
      const up = rawMapParent(mid);
      Object.values(state.worldMaps).forEach(x=>{ if (x.parent === mid){ if (up) x.parent = up; else delete x.parent; } });
      delete state.worldMaps[mid];
      what = `карту «${o.name||mid}»`;
      ui.ctx = {kind:"map", id:firstMapId()};
      break;
    }
  }
  if (ui.sel && sameSel(ui.sel, sel)) ui.sel = null;
  if (quiet) return what;
  commit();
  render();
  toast(`Удалено: ${what}`, "Отменить", undo);
}

function duplicateSel(){
  const sel = ui.sel, o = getSelObj(sel);
  if (!o) return;
  let ns = null;
  if (sel.type==="npc"){
    const c = deepCopy(o); c.id = uid("npc"); c.name = o.name + " (копия)"; c.x += 1.5; state.npcs.push(c); ns = {type:"npc", id:c.id};
  } else if (sel.type==="talk"){
    const c = deepCopy(o); c.id = uid("talk"); c.title = (o.title||o.id) + " (копия)"; state.companionTalks.push(c); ns = {type:"talk", id:c.id};
  } else if (sel.type==="container"){
    const c = deepCopy(o); c.id = uid(o.type==="chest"?"chest":"pot"); c.x += 1.5; state.containers.push(c); ns = {type:"container", id:c.id};
  } else if (sel.type==="scene"){
    const c = deepCopy(o); c.id = uid("scene"); c.name = (o.name||o.id) + " (копия)"; state.cutscenes.push(c); ns = {type:"scene", id:c.id};
  } else if (sel.type==="quest"){
    const c = deepCopy(o); c.id = uidIn(state.quests, "quest"); c.name = (o.name||o.id) + " (копия)"; state.quests.push(c); ns = {type:"quest", id:c.id};
  } else if (sel.type==="mech"){
    const c = deepCopy(o); c.id = uid(o.type); c.x += mechIsCell(o.type) ? CELL : 1.5; state.mechs.push(c); ns = {type:"mech", id:c.id};
  } else if (sel.type==="prop"){
    const c = deepCopy(o); c.id = uid("prop"); c.x += 1.5; state.props.push(c); ns = {type:"prop", id:c.id};
  } else if (sel.type==="path"){
    const c = deepCopy(o); c.id = uid("path"); c.points.forEach(p=>{ p.x += 2; }); state.paths.push(c); ns = {type:"path", id:c.id};
  } else if (sel.type==="battle"){
    const c = deepCopy(o); c.id = uid("battle"); c.name = o.name + " (копия)"; c.x += 5; state.battles.push(c); ns = {type:"battle", id:c.id};
  } else if (sel.type==="house"){
    const c = deepCopy(o); c.id = uid(o.type==="cave"?"cave":"house"); c.name = o.name + " (копия)"; c.x += 4;
    if (c.type !== "cave"){
      const remap = {};
      const used = allIds();
      (c.floors||[]).forEach(f=>{
        let n = 1; while (used.has("floor_"+n)) n++;
        const nid = "floor_"+n; used.add(nid);
        remap[f.id] = nid; f.id = nid;
      });
      (c.floors||[]).forEach(f=> f.exits.forEach(e=>{ if (remap[e.target]) e.target = remap[e.target]; }));
      c.enterFloor = remap[c.enterFloor] || c.enterFloor;
    }
    state.houses.push(c); ns = {type:"house", id:c.id};
  } else {
    toast("Этот объект нельзя скопировать"); return;
  }
  commit();
  select(ns);
  toast("Скопировано");
}

function moveToArea(o, area){
  o.area = area;

}

  state.houses.forEach(h=>{ if (h.area===oldId) h.area=nid; if (h.targetMap===oldId) h.targetMap=nid; });
  state.npcs.forEach(n=>{ if (n.area===oldId) n.area=nid; });
  state.containers.forEach(c=>{ if (c.area===oldId) c.area=nid; });

  return nid;

/* ============================ проверка ============================
   Каждая проблема знает, где её показать (sel). level: error — в игре
   что-то не сработает; warn — скорее всего ошибка. */
function problems(){
  const out = [];
  const add = (level, text, sel)=> out.push({level, text, sel});
  // монстры и атаки (раунд 24): только свои и изменённые — встроенные проверены в игре
  (state.monsterTypes||[]).forEach(m=> monProblems(m.id).forEach(t=> add("warn", `Монстр «${m.name||m.id}»: ${t}`, {type:"monsters"})));
  (state.monsterAttacks||[]).forEach(a=> atkProblems(a.id).forEach(t=> add("warn", `Атака «${a.name||a.id}»: ${t}`, {type:"monsters"})));
  { const ps = state.playerStart;
    if (ps && !onCells(ps.area, ps.x, ps.z)) add("error", "Старт игрока стоит в воде — герой появится вне карты", {type:"start", id:"player"}); }
  const dup = (arr, what)=>{ const m=new Map(); arr.forEach(x=>m.set(x.id,(m.get(x.id)||0)+1)); m.forEach((n,id)=>{ if (n>1) add("error", `${what}: id «${id}» встречается ${n} раза — игра увидит только первый`, null); }); };
  dup(state.npcs, "Жители"); dup(state.houses, "Здания"); dup(state.containers, "Сундуки"); dup(allFloors().map(x=>x.floor), "Этажи");

  state.npcs.forEach(n=>{
    const sel = {type:"npc", id:n.id};
    if (!areaExists(n.area)) add("error", `«${n.name}» стоит в несуществующем месте «${n.area}»`, sel);
    else if (!onCells(n.area, n.x, n.z)) add("warn", `«${n.name}» стоит вне нарисованной земли — до него не дойти`, sel);
    const ids = new Set(n.nodes.map(x=>x.id));
    if (!ids.has(n.start)) add("error", `«${n.name}»: нет стартовой реплики`, sel);
    const reach = new Set([n.start]);
    n.nodes.forEach(nd=> nd.choices.forEach(c=>{ if (c.next) reach.add(c.next); }));
    n.nodes.forEach(nd=>{ if (!reach.has(nd.id)) add("warn", `«${n.name}»: реплика «${short(nd.text)}» никогда не прозвучит — на неё не ведёт ни один ответ`, sel); });
    n.nodes.forEach(nd=> nd.choices.forEach(c=>{ if (c.next && !ids.has(c.next)) add("error", `«${n.name}»: ответ «${short(c.text)}» ведёт на удалённую реплику`, sel); }));
  });

  state.houses.forEach(h=>{
    const sel = {type:"house", id:h.id};
    if (!state.worldMaps[h.area]){ add("error", `«${h.name}» стоит на несуществующей карте «${h.area}»`, sel); return; }
    if (!onCells(h.area, h.x, h.z)) add("warn", `«${h.name}» стоит вне нарисованной земли — к нему не подойти`, sel);
    if (h.type==="cave"){
      if (h.targetMap===BACK) return;
      if (!state.worldMaps[h.targetMap]) add("error", `«${h.name}» ведёт на несуществующую карту`, sel);
      else if (!onCells(h.targetMap, h.targetSpawnX||0, h.targetSpawnZ||0)) add("error", `«${h.name}»: игрок появится в воде/стене на карте «${mapName(h.targetMap)}» — укажите точку появления`, sel);
      return;
    }
    const floors = h.floors||[];
    const ef = floors.find(f=>f.id===h.enterFloor);
    if (!ef) add("error", `«${h.name}»: не выбран этаж, на который попадают снаружи`, sel);
    else if (!ef.exits.find(e=>e.id===h.enterSpawn)) add("error", `«${h.name}»: не выбрано, у какого выхода появляется игрок при входе`, sel);
    if (!floors.some(f=>f.exits.some(e=>e.target==="world"))) add("error", `«${h.name}»: ни один выход не ведёт на улицу — из дома не выйти`, sel);
    floors.forEach(f=>{
      const fsel = {type:"floor", id:f.id};
      if (!Object.keys(f.cells||{}).length) add("warn", `«${h.name} › ${f.name}»: пол не нарисован`, fsel);
      f.exits.forEach(e=>{
        const esel = {type:"exit", floor:f.id, id:e.id};
        if (!onCells(f.id, e.x, e.z)) add("warn", `«${h.name} › ${f.name}»: выход «${e.label}» стоит вне пола — к нему не подойти`, esel);
        if (e.target!=="world"){
          const tf = floors.find(x=>x.id===e.target);
          if (!tf) add("error", `«${h.name} › ${f.name}»: выход «${e.label}» ведёт на удалённый этаж`, esel);
          else if (e.targetSpawn && !tf.exits.find(x=>x.id===e.targetSpawn)) add("error", `«${h.name} › ${f.name}»: выход «${e.label}» — точка появления на «${tf.name}» удалена`, esel);
        }
      });
    });
  });

  const reach = new Set(["overworld"]);
  state.houses.forEach(h=>{ if (h.type==="cave" && h.targetMap!==BACK) reach.add(h.targetMap); });
  allTransitions().forEach(t=>{
    const sel = {type:"transition", map:t.map, key:t.key};
    const p = t.portal;
    if (p.targetMap===BACK) return;
    reach.add(p.targetMap);
    if (!state.worldMaps[p.targetMap]) add("error", `Переход на «${mapName(t.map)}» ведёт на несуществующую карту`, sel);
    else if (!onCells(p.targetMap, p.targetSpawnX||0, p.targetSpawnZ||0)) add("error", `Переход «${mapName(t.map)} → ${mapName(p.targetMap)}»: игрок появится в воде — укажите точку появления`, sel);
  });
  Object.keys(state.worldMaps).forEach(id=>{
    const m = state.worldMaps[id], sel = {type:"map", id};
    if (!cellCount(m.cells)) add("warn", `Карта «${m.name||id}» пустая — нарисуйте землю`, sel);
    if (!reach.has(id)) add("warn", `На карту «${m.name||id}» не ведёт ни один переход или пещера — в игре туда не попасть`, sel);
    // раунд 111: лестницы и мосты
    const {badStairs, badBridge, lowBridge} = cellMemo("stairsBridge", m.cells, cells=> stairsBridgeStats(cells));
    if (badStairs) add("warn", `«${m.name||id}»: лестниц, ведущих не вверх, — ${badStairs} (красные). Ступени ведут на соседнюю клетку ВЫШЕ — поднимите её или поверните лестницу`, sel);
    if (badBridge) add("warn", `«${m.name||id}»: мост ни к чему не примыкает (${badBridge} кл.) — проведите его от берега до берега`, sel);
    if (lowBridge) add("warn", `«${m.name||id}»: мост и берег на разной высоте (разница больше 1) — с моста не сойти. Выровняйте мост кистью «Выровнять»`, sel);
  });
  function stairsBridgeStats(cells){
    const m = {cells};
    let badStairs = 0, badBridge = 0, lowBridge = 0;
    for (const key in m.cells){
      const c = m.cells[key]; if (!c.stairs && !c.bridge) continue;
      const i = key.indexOf(","), cx = +key.slice(0, i), cz = +key.slice(i + 1);
      if (c.stairs && !c.chasm && !stairsRise(m.cells, cx, cz)) badStairs++;
      if (isBridgeCell(c)){
        const ax = bridgeAxisX(m.cells, cx, cz), e = deckLevel(c);
        const ends = ax ? [[cx-1,cz],[cx+1,cz]] : [[cx,cz-1],[cx,cz+1]];
        if (!ends.some(([a,b])=>bridgeFooting(m.cells, a, b, e))) badBridge++;
        ends.forEach(([a,b])=>{ const n = m.cells[cellKey(a,b)]; if (n && !n.chasm && !isBridgeCell(n) && Math.abs((Number(n.elevation)||0) - e) > 1) lowBridge++; });
        if (c.over != null && !c.chasm && Number(c.over) - (Number(c.elevation)||0) < 2) lowBridge++;
      }
    }
    return {badStairs, badBridge, lowBridge};
  }

  state.containers.forEach(c=>{
    const sel = {type:"container", id:c.id};
    if (!areaExists(c.area)) add("error", `«${c.name}» стоит в несуществующем месте`, sel);
    else if (!onCells(c.area, c.x, c.z)) add("warn", `«${c.name}» стоит вне нарисованной земли`, sel);
    const empty = c.lootMode==="pool" ? !(c.pool && c.pool.entries && c.pool.entries.length) : !(c.fixedItems && c.fixedItems.length);

        (st.options||[]).forEach(o=>{ if (bad(o.goto)) add("error", `Сцена «${nm}», шаг ${i+1}: ответ «${short(o.text)}» ведёт к удалённой метке`, sel); if (!String(o.text||"").trim()) add("warn", `Сцена «${nm}», шаг ${i+1}: пустой ответ`, sel); });
      }
      if (st.type==="mech" && !(state.mechs||[]).some(x=>x.id===st.mech)) add("error", `Сцена «${nm}», шаг ${i+1}: механизм не выбран или удалён`, sel);
      if (st.type==="var" && !st.name) add("warn", `Сцена «${nm}», шаг ${i+1}: у счётчика нет имени`, sel);
    });
    const dup = labs.filter((l, k)=> labs.indexOf(l) !== k);
    if (dup.length) add("error", `Сцена «${nm}»: метка «${dup[0]}» встречается дважды`, sel);
  });
  itemDefs().forEach(it=>{
    const sel = {type:"item", id:it.id};
    if (!String(it.name||"").trim()) add("warn", `Предмет ${it.id}: без названия`, sel);
    if ((it.kind||"consumable")==="consumable" && !(Number(it.healPct) || Number(it.healMin) || Number(it.spPct) || Number(it.spMin) || (it.cure||[]).length || Number(it.ward) || Number(it.power) || Number(it.guard) || it.bomb || Number(it.revive) || it.teleport || it.chum))
      add("warn", `Расходник «${it.name||it.id}» ничего не делает — задайте лечение, лекарство или усиление`, sel);
  });
  equipDefs().forEach(e=>{
    if (!["attack","defense","critChance","critMult","maxHp","maxSp"].some(k=>Number(e[k]))) add("warn", `Снаряжение «${e.name||e.id}» не даёт ни одной характеристики`, {type:"equip", id:e.id});
  });
  skillDefs().forEach(s=>{
    if (s.builtin) return;
    const sel = {type:"skill", id:s.id};
    if ((s.kind==="strike" || s.kind==="spell" || s.kind==="heal") && !(Number(s.base) || Number(s.scale))) add("warn", `Приём «${s.name||s.id}»: сила 0 — он ничего не сделает`, sel);
  });
  {
    const g = state.gameStart || {};
    (g.items||[]).forEach(it=>{ if (it.itemId && !itemCatalog().some(x=>x.id===it.itemId)) add("error", `Начало игры: неизвестный предмет ${it.itemId}`, {type:"gamestart"}); });
    const intro = (state.cutscenes||[]).filter(s=>s.trigger==="event" && s.event==="new_game");
    if (intro.length > 1) add("warn", `В начале игры срабатывают ${intro.length} сцены сразу — оставьте одну вступительную`, {type:"gamestart"});
  }
  return out;
}

// Где какие отметки и счётчики ставятся и проверяются (раунд 49): {flags: {имя: {set:[где], need:[где]}}, vars: {...}}
function storyUsage(){
  const flags = {}, vars = {};
  const rec = (map, name, kind, where)=>{ if (!name) return; const e = map[name] = map[name] || {set:[], need:[]}; if (!e[kind].some(w=>w.text===where.text)) e[kind].push(where); };
  const walk = (o, where)=>{
    if (Array.isArray(o)){ o.forEach(x=>walk(x, where)); return; }
    if (!o || typeof o !== "object") return;
    if (o.setFlag) rec(flags, o.setFlag, "set", where);
    if (o.clearFlag) rec(flags, o.clearFlag, "set", where);
    if (o.needFlag) rec(flags, o.needFlag, "need", where);
    if (o.noFlag) rec(flags, o.noFlag, "need", where);
    if (o.type==="flag" && o.flag) rec(flags, o.flag, "set", where);
    if (o.type==="flag" && o.target) rec(flags, o.target, "need", where);
    if (o.trigger==="flag" && o.flag) rec(flags, o.flag, "need", where);
    if (o.type==="join") rec(flags, o.member==="moth" ? "moth_joined" : "lira_joined", "set", where);
    if (o.type==="var" && o.name) rec(vars, o.name, "set", where);
    if (o.varOpName) rec(vars, o.varOpName, "set", where);
    if (o.varName) rec(vars, o.varName, "need", where);
    for (const k in o){ const v = o[k]; if (v && typeof v === "object") walk(v, where); }
  };
  (state.npcs||[]).forEach(n=> walk(n, {text:`житель «${n.name}»`, sel:{type:"npc", id:n.id}}));
  (state.companionTalks||[]).forEach(t=> walk(t, {text:`разговор ${CompanionName} «${t.title||t.id}»`, sel:{type:"talk", id:t.id}}));
  (state.cutscenes||[]).forEach(s=>{ walk(s, {text:`сцена «${s.name||s.id}»`, sel:{type:"scene", id:s.id}}); rec(flags, "scene_done:" + s.id, "set", {text:`сцена «${s.name||s.id}» (сыграна)`, sel:{type:"scene", id:s.id}}); });
  (state.quests||[]).forEach(q=> walk(q, {text:`задание «${q.name||q.id}»`, sel:{type:"quest", id:q.id}}));
  (state.battles||[]).forEach(b=>{ walk(b, {text:`бой «${b.name}»`, sel:{type:"battle", id:b.id}}); rec(flags, "battle_done:" + b.id, "set", {text:`бой «${b.name}» (победа)`, sel:{type:"battle", id:b.id}}); });
  (state.mechs||[]).forEach(x=> walk(x, {text:`механизм «${mechName(x)}»`, sel:{type:"mech", id:x.id}}));
  return {flags, vars};
}

function selGlyph(sel){

    case "start": return glyph("start");
    case "cat": case "cats": return glyph("cat");
    case "quest": return glyph("quest", o && o.kind==="main" ? "#e8c46c" : null);
    case "quests": return glyph("quest");
    case "monsters": return glyph("battle");
    case "item": case "items": return glyph("potion", o && o.color ? validHex(o.color, null) : null);
    case "equip": case "equips": return glyph("sword");

    case "gamestart": return glyph("game");

function cycleTheme(){

document.querySelectorAll(".resizer").forEach(h=>{
  const side = h.dataset.side;
  h.addEventListener("pointerdown", ev=>{
    if (ev.button !== 0) return;
    ev.preventDefault();
    h.setPointerCapture(ev.pointerId);
    h.classList.add("drag"); document.body.classList.add("resizing");
    const r = h.parentElement.getBoundingClientRect();
    const move = (e)=>{
      const [, mn, mx] = PANE_W[side];
      const w = Math.round(clamp(side === "left" ? e.clientX - r.left : r.right - e.clientX, mn, mx));
      if (side === "left") ui.lw = w; else ui.rw = w;
      applyLayout();
    };
    const up = ()=>{
      h.removeEventListener("pointermove", move); h.removeEventListener("pointerup", up); h.removeEventListener("pointercancel", up);
      h.classList.remove("drag"); document.body.classList.remove("resizing");
      saveUi(); requestCanvas();
    };
    h.addEventListener("pointermove", move); h.addEventListener("pointerup", up); h.addEventListener("pointercancel", up);
  });
  h.addEventListener("dblclick", ()=>{ if (side === "left") ui.lw = null; else ui.rw = null; applyLayout(); saveUi(); requestCanvas(); });
});
