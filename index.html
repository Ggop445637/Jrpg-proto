    <p class="hint">На карте — фиолетовый значок «${esc(CompanionName)} ждёт». Встроенная сцена «Встреча с Лирой» срабатывает рядом с ней.</p>`}`);

function insScene(F, sel){
  const s = getSelObj(sel);
  let html = insHead(sel, "Катсцена", s.name, v=>s.name=v, F);
  html += objProblems(sel);
  html += actionsBar(F, [["Редактор сцены", ()=> openScene(s.id), "primary"], ["Копия", duplicateSel], ["Удалить", ()=> deleteSel(sel), "danger"]]);
  let trig = F.select("Когда начинается", s.trigger, SCENE_TRIGGERS, v=>s.trigger=v);
  if (s.trigger==="zone"){
    trig += `${F.select("Карта / этаж", s.area, areaOptions(), v=>{ s.area = v; if (!onCells(v, s.x, s.z)){ const [x,z] = firstCellPos(areaCells(v)); s.x = x; s.z = z; } ui.ctx = areaCtx(v) || ui.ctx; })}
      ${positionFields(F, s)}
      ${F.slider("Радиус круга", Number(s.radius)||4, v=>s.radius=v, {min:1, max:25, step:0.5, fmt:v=>`${v} м`})}
      <p class="hint">Круг виден на карте. Его можно двигать, перетаскивая значок сцены.</p>`;
  } else if (s.trigger==="talk"){
    const who = s.talkTo || "lira";
    trig += F.select("С кем заговорить", who, [["lira", `${CompanionName} (до встречи или уже в отряде)`], ["moth", `${MothName()} — лунный мотылёк (когда он в отряде)`]].concat(state.npcs.map(n=>[n.id, `${n.name} — житель`])), v=>s.talkTo=v);
    trig += `<p class="hint">Игрок подходит и нажимает E «Поговорить» — вместо обычного разговора начинается сцена. Над ${who==="lira" ? "ожидающей " + CompanionName + "ой" : "жителем"} горит «!». Когда сцена «только один раз» сыграна, дальше разговоры обычные.</p>`;
  } else if (s.trigger==="event"){
    if (!s.event) s.event = "new_game";   // раунд 52: список показывал new_game, но не записывал его
    trig += F.select("Событие", s.event, SCENE_EVENTS, v=>s.event=v);
  } else if (s.trigger==="flag"){
    trig += F.text("Отметка", s.flag||"", v=>s.flag=v, {mono:true, lazy:true, hint:"сцена начнётся, как только эта отметка появится (ответ в диалоге, победа в бою, другая сцена)"});
  } else if (s.trigger==="dialogue"){
    const users = [];
    state.npcs.forEach(n=> n.nodes.forEach(nd=> nd.choices.forEach(c=>{ if (c.action==="scene:"+s.id) users.push(n.name); })));
    trig += users.length ? `<p class="hint good">Запускается из разговора: ${users.map(esc).join(", ")}.</p>` : `<p class="hint warn">Ни один ответ пока не запускает эту сцену. В редакторе диалога у ответа выберите действие «запустить сцену «${esc(s.name)}»».</p>`;
  }
  if (s.trigger !== "zone") trig += F.select("Где разыгрывается (для проверки и координат)", s.area, areaOptions(), v=>s.area=v);
  trig += F.check("Только один раз", s.once !== false, v=>s.once=v);
  trig += `<div class="grid2">${F.text("Нужна отметка", s.needFlag||"", v=>s.needFlag=v, {mono:true, lazy:true})}${F.text("Нет отметки", s.noFlag||"", v=>s.noFlag=v, {mono:true, lazy:true})}</div>`;
  html += sec("scene_trig", "Запуск", trig);
  html += sec("scene_steps", `Шаги (${s.steps.length})`, `<ol class="steps hint">${s.steps.slice(0, 12).map(st=>`<li>${esc(stepSummary(st, s))}</li>`).join("")}${s.steps.length>12?"<li>…</li>":""}</ol>${F.button("Открыть редактор сцены", ()=> openScene(s.id), "primary")}`);
  html += sec("scene_adv", "Дополнительно", F.text("id сцены", s.id, v=>{ const nid = renameSimpleId(state.cutscenes, s, v); state.npcs.forEach(n=> n.nodes.forEach(nd=> nd.choices.forEach(c=>{ if (c.action==="scene:"+sel.id) c.action = "scene:"+nid; }))); ui.sel = {type:"scene", id:nid}; }, {mono:true, lazy:true}), false);
  return html;
}

/* ---------- атмосфера (свет, туман, ветер) ---------- */
// Раздел общий для карты и этажа: пресет настроения + необязательные правки.
// Пустое поле = «как в пресете» (в игре — core/lighting.gd::resolve).
function lightingSection(F, holder, kind){
  holder.lighting = holder.lighting || {};
  const L = holder.lighting;
  let def = kind === "cave" ? "cave" : (kind === "floor" ? "interior" : "day");
  if (def === "day" && holder.biome){ const own0 = (state.biomes||[]).find(b=>b.id===holder.biome); if (holder.biome === "mushroom" || (own0 && own0.base === "mushroom")) def = "mushroom"; }
  if (def === "day" && holder.biome){ const own = (state.biomes||[]).find(b=>b.id===holder.biome); const dry = own ? (own.dry != null ? own.dry : (own.base === "desert" ? 1 : 0)) : (holder.biome === "desert" ? 1 : 0); if (dry >= 0.8) def = "desert"; }
  const cur = LIGHT_PRESETS.find(p=>p[0]===L.preset) || LIGHT_PRESETS.find(p=>p[0]===def);
  let html = F.select("Настроение", L.preset || def, LIGHT_PRESETS.map(([v,n])=>[v,n]), v=>L.preset=v);
  html += `<p class="hint">${esc(cur[2])}</p>`;
  // раунд 73: время суток — только открытые карты с дневным настроением
  if (kind !== "cave" && kind !== "floor"){
    const p = L.preset || def;
    const globalOn = !(state.gameStart && state.gameStart.dayCycle === false);
    if (p === "day" || p === "desert"){
      html += F.check("Время суток меняется", holder.dayCycle !== false, v=>{ if (v) delete holder.dayCycle; else holder.dayCycle = false; }, globalOn ? "день → закат → ночь → рассвет; выключить — здесь всегда день" : "смена дня и ночи выключена для всей игры (Игра → Начало игры)");
    } else {
      html += `<p class="hint">Время суток здесь не меняется: у карты своё настроение. Чтобы свет шёл по часам — выберите «День» или «Пустыня».</p>`;
    }
  }
  const tuned = LIGHT_TUNE.filter(([k])=>L[k] != null).length + LIGHT_COLORS.filter(([k])=>L[k]).length;
  let tune = "";
  LIGHT_TUNE.forEach(([key, label, step, hint])=>{
    tune += F.text(label, L[key] == null ? "" : String(L[key]), v=>{
      const s = String(v).trim().replace(",", ".");
      if (s === "") delete L[key]; else L[key] = Math.max(0, Number(s) || 0);
    }, {lazy:true, hint: hint || "пусто — как в пресете"});
  });
  LIGHT_COLORS.forEach(([key, label])=>{
    if (L[key]){
      tune += `<div class="grid2">${F.color(label, L[key], v=>L[key]=v)}${F.button("Вернуть цвет пресета", ()=>{ delete L[key]; commit(); render(); })}</div>`;
    } else {
      tune += F.button(`Задать «${label.toLowerCase()}»`, ()=>{ L[key] = key==="sunColor" ? "#ffeecc" : (key==="ambientColor" ? "#556688" : "#9fb0c0"); commit(); render(); });
    }
  });
  tune += F.button("Сбросить все правки", ()=>{ holder.lighting = {preset: L.preset || def}; commit(); render(); }, "danger");
  html += sec(kind === "floor" ? "floor_light_tune" : "map_light_tune", `Тонкая настройка${tuned ? ` · ${tuned}` : ""}`, tune, false);
  html += `<p class="hint">Качество света в игре переключается клавишей F7 (тени, объёмные лучи, трава). В бою берётся настроение того места, где случилась засада.</p>`;
  return html;
}

/* ---------- разговор напарницы ---------- */
// поле «от/до» для симпатии: пусто — без ограничения
function relField(F, label, value, set, hint){
  return F.text(label, value == null ? "" : String(value), v=>{
    const s = String(v).trim().replace(",", ".");
    set(s === "" ? null : Math.max(-100, Math.min(100, Math.round(Number(s)) || 0)));
  }, {lazy:true, hint});
}
function talkFirstText(t){ const nd = (t.nodes||[]).find(x=>x.id===t.start) || (t.nodes||[])[0]; return nd ? nd.text : ""; }
function insTalk(F, sel){
  const t = getSelObj(sel);
  let html = insHead(sel, `Разговор · ${t.who==="moth" ? MothName() : CompanionName}`, t.title || t.id, v=>t.title=v, F);

    ["Редактор разговора", ()=> openDialogue("talk", t.id), "primary"],
    ["Копия", duplicateSel],
    ["Удалить", ()=> deleteSel(sel), "danger"],
  ]);
  let when = F.select("Кто заводит разговор", t.who||"", [["", CompanionName], ["moth", `${MothName()} — лунный мотылёк (говорит стрекотом; смысл — в ремарках)`]], v=>{ if (v) t.who = v; else delete t.who; });
  when += F.select("Когда случается", t.trigger, [
    ["random", "Случайно в пути"],
    ["event", "После события"],
    ["place", "В определённом месте"],
  ], v=>{ t.trigger = v; if (v==="place" && !state.worldMaps[t.area]) { t.area = firstMapId(); const [x,z]=firstCellPos(state.worldMaps[t.area].cells); t.x=x; t.z=z; } });
  if (t.trigger === "event"){
    if (!t.event) t.event = TALK_EVENTS[0][0];   // что показано в списке — то и записано
    when += F.select("Событие", t.event, TALK_EVENTS, v=>t.event=v);
    when += F.slider("Шанс", Math.round(Number(t.chance)||0), v=>t.chance=v, {min:0, max:100, step:5, fmt:v=>`${Math.round(v)}%`, hint:"100% — заговорит обязательно"});
  } else if (t.trigger === "place"){
    const ok = state.worldMaps[t.area] ? onCells(t.area, t.x, t.z) : false;
    when += F.select("Карта", t.area || firstMapId(), areaOptions(true, true), v=>{ t.area = v; if (!onCells(v, t.x, t.z)){ const [x,z]=firstCellPos(areaCells(v)); t.x=x; t.z=z; } ui.ctx = areaCtx(v) || ui.ctx; });
    when += `<div class="card ${ok?"":"accent"}">
      <div>Круг с центром <span class="mono">x ${t.x} · z ${t.z}</span></div>

function catRewardsEdit(){

function catRewardSummary(r){
  const parts = [];
  if (r.companion==="moth") parts.push(`${MothName()} — новый спутник`);
  if (Number(r.gold) > 0) parts.push(`${r.gold} золота`);
  if (Number(r.points) > 0) parts.push(`+${r.points} очк. навыков каждому`);
  (r.equip||[]).forEach(e=> parts.push((equipDefs().find(x=>x.id===e.id)||{name:e.id}).name));
  (r.blueprints||[]).forEach(b=> parts.push("чертёж " + b));
  (r.items||[]).forEach(it=> parts.push(`${(itemCatalog().find(x=>x.id===it.itemId)||{name:it.itemId}).name} ×${it.qty||1}`));
  return parts.join(", ") || "ничего";
}

    ${!m.isCave ? F.select("За краем карты", m.edge || "water", [["water","Море (вода)"],["abyss","Бездонная пропасть"]], v=>{ if (v === "water") delete m.edge; else m.edge = v; }, {hint: m.edge === "abyss" ? "Земля обрывается в темноту — стёртые клетки (и дыры внутри карты) становятся пропастью" : "Всё, что не нарисовано, — вода"}) : ""}
    ${F.check("Плавные скосы между уровнями", !!m.slopes, v=>m.slopes=v, "Соседние клетки с разницей в 1 уровень сливаются в склон — лес и холмы вместо набора плит. Перепад 2 и больше — обрыв. Кисть «Уступ» оставляет стенку в нужных местах")}
    <div class="grid2">
      ${F.num("Кустов с ягодами", m.bushCount||0, v=>m.bushCount=v, {int:true, min:0, max:60, hint:"растут на опасных клетках"})}
      ${F.num("Созревание, сек", m.bushRespawn||45, v=>m.bushRespawn=v, {min:1, step:5})}
    </div>`);
  if (!m.isCave) html += sec("map_biome", "Биом и погода", biomeSection(F, m));

  if (!m.isCave && m.edge !== "abyss") html += sec("map_fish", "Рыбалка", fishingSection(F, m));
  html += sec("map_stats", "Сводка", `
    <div class="stat"><span>Клеток земли</span><b>${cells.length}</b></div>
    <div class="stat"><span>Безопасных / опасных</span><b>${safe} / ${cells.length-safe}</b></div>

    ${incoming===0 && sel.id!=="overworld" ? `<p class="hint warn">Сюда пока не ведёт ни один переход или пещера. Добавьте «Переход» на другой карте и выберите эту карту целью.</p>` : ""}`);
  html += sec("map_how", "Как рисовать", `
    <ol class="steps hint">
      <li><b>Кисть → Земля</b>: нарисуйте форму карты. Всё, что не нарисовано, — ${m.isCave ? "камень" : "вода"}.</li>
      <li><b>Выше / Ниже</b>: холмы и низины. Перепад больше одного уровня — обрыв (тёмная линия), по нему не пройти.</li>
      <li><b>Безопасно / Опасно</b>: где не бывает засад, а где бродят монстры.</li>
      <li><b>Добавить → Переход</b>: клетка-выход на другую карту.</li>
    </ol>`, false);
  html += sec("map_adv", "Дополнительно", `
    ${F.text("id карты (для игры)", sel.id, v=>{ const nid = renameMapId(sel.id, v); ui.sel = {type:"map", id:nid}; }, {mono:true, lazy:true, hint: sel.id==="overworld" ? "главная карта, с неё начинается игра" : "латиница, цифры и _"})}`, false);

}

  html += objProblems(sel);
  html += actionsBar(F, [
    ["← На карту к зданию", ()=> select({type:"house", id:h.id})],
    ["+ Этаж сверху", ()=>{ const fid = addFloor(h, f); commit(); openCtx({kind:"floor", id:fid}); ui.sel = {type:"floor", id:fid}; render(); toast("Этаж добавлен: лестница вверх здесь и вниз там — перетащите их на нужные места"); }],
    ["+ Подвал снизу", ()=>{ const fid = addFloor(h, f, true); commit(); openCtx({kind:"floor", id:fid}); ui.sel = {type:"floor", id:fid}; render(); toast("Подвал добавлен: проём с лестницей вниз здесь и лестница наверх там"); }],

  ]);

  html += sec("floor_main", "Этаж", `
    ${isEntrance ? `<p class="hint good">★ Сюда игрок попадает, входя в здание.</p>` : F.button("Сделать этажом входа", ()=>{ h.enterFloor = f.id; h.enterSpawn = (f.exits.find(e=>e.target==="world")||f.exits[0]||{}).id || ""; commit(); render(); })}
    <div class="grid2">${F.color("Пол", f.floorColor, v=>f.floorColor=v)}${F.color("Стены", f.wallColor, v=>f.wallColor=v)}</div>
    <p class="hint">В помещении клетки безопасны, пока не покрасить их кистью «Опасно». Мебель — «Добавить → Декор».</p>`);
  html += sec("floor_light", "Атмосфера", lightingSection(F, f, "floor"));
  html += sec("floor_monsters", "Монстры", monsterLevelFields(F, f) + encounterFields(F, f));
  html += sec("floor_exits", `Выходы (${f.exits.length})`, `
    <div class="list">${f.exits.map(e=>`<div class="li">${glyph("exit")}<span class="lbl">${isEntrance && h.enterSpawn===e.id ? `<span class="star">★</span> ` : ""}${esc(e.label||e.id)}</span><span class="pill">${e.target==="world" ? "улица" : esc((h.floors.find(x=>x.id===e.target)||{}).name||"?")}</span>${F.button("Открыть", ()=>select({type:"exit", floor:f.id, id:e.id}))}</div>`).join("") || `<p class="hint warn">Нет ни одного выхода.</p>`}</div>
    <p class="hint">Новый выход: «Добавить → Выход» и клик по полу.</p>`);
  html += sec("floor_adv", "Дополнительно", `${F.text("id этажа (для игры)", f.id, v=>{ const nid = renameFloorId(f.id, v); ui.sel = {type:"floor", id:nid}; }, {mono:true, lazy:true})}`, false);

}
// раунд 85: гостиница — ответ с действием «inn», цена — золото в последствиях
function innFields(F, n, inn){
  let html = `<p class="hint">Ночлег — единственный способ полностью восстановить отряд (уровень больше не лечит). Отряд спит до утра, а этот город становится местом, где он очнётся после смерти.</p>`;
  inn.forEach(c=>{
    html += `<div class="card"><div class="lootrow" style="grid-template-columns:minmax(0,1fr) 110px;align-items:end">${F.text("Ответ", c.text, v=>c.text=v)}${F.num("Цена, золото", Math.max(0, -(Number(c.gold)||0)), v=>{ c.gold = v > 0 ? -v : 0; }, {int:true, min:0, max:99999})}</div></div>`;
  });
  if (!inn.length) html += F.button("+ Добавить ответ «Переночевать»", ()=>{
    const start = n.nodes.find(x=>x.id===n.start) || n.nodes[0];
    start.choices.unshift({text:"Переночевать (20 золота)", next:"", action:"inn", gold:-20});
    commit(); render(); toast("В первую реплику добавлен ответ «Переночевать» за 20 золота");
  }, "primary");
  else html += `<p class="hint">Не хватает золота — ответ в игре заблокирован с подсказкой «Нужно: …».</p>`;
  return html;
}
// раунд 93: рыбак — как в Terraria, раз в игровой день просит одну рыбу (core/fish_book.gd)
function anglerFields(F, n){
  return F.check("Рыбак: заказы на рыбу", !!n.angler, v=>{ if (v) n.angler = true; else delete n.angler; },
    "В разговоре сам появится ответ «Заказ на рыбу»: раз в игровой день просит принести одну рыбу. Награда — золото и наживка, за 3 / 7 / 12 / 20 заказов — удочки получше. Чем больше сдано, тем ценнее просит рыбу.");
}
// лавка жителя: n.shop = {enabled, name, items:[{itemId, rarity, level}]}
function shopFields(F, n){
  const shop = n.shop || {enabled:false, name:"", items:[]};
  const on = !!shop.enabled;
  const opens = n.nodes.some(nd=> nd.choices.some(c=>c.action==="open_shop"));
  let html = F.check("Этот житель торгует", on, v=>{ n.shop = n.shop || {enabled:false, name:"", items:[]}; n.shop.enabled = v; },
    "Покупает у героя сырьё и снаряжение, продаёт зелья, свитки и снаряжение за золото");
  if (!on) return html;
  html += F.text("Название лавки", shop.name, v=>shop.name=v, {hint:"пусто — «Лавка · " + esc(n.name) + "»"});
  html += F.select("Вид лавки", shop.kind||"general", SHOP_KINDS, v=>shop.kind=v);
  if (opens) html += `<p class="hint good">✓ В разговоре есть ответ, открывающий лавку.</p>`;
  else html += `<p class="hint warn">В разговоре нет ответа, который открывает лавку — игрок в неё не попадёт.</p>` +
    F.button("+ Добавить ответ «Показать товары»", ()=>{
      const start = n.nodes.find(x=>x.id===n.start) || n.nodes[0];
      start.choices.unshift({text:"Показать товары", next:"", action:"open_shop"});
      commit(); render(); toast("В первую реплику добавлен ответ «Показать товары»");
    }, "primary");
  html += `<div class="hint" style="margin-top:8px;">Товары</div>`;
  if (!shop.items.length){
    const k = shop.kind||"general";
    html += `<p class="hint">Список пуст — продаётся <b>стандартный набор</b>: ${k==="smith" ? "слитки, кожа, ткань и дерево (лучше — с уровнем героя), до 3 неизученных чертежей и пара вещей воина" : k==="herbal" ? "склянки, травы и простые зелья" : k==="fisher" ? "вся наживка и удочки (получше — с уровнем героя: крепкая с 3-го, ивовая с 5-го, мастера с 9-го, мана-удочка с 12-го)" : "ягода, зелья HP и SP, свиток возвращения, лекарства и 5 вещей снаряжения под уровень героя"}.</p>`;
  }
  const pickItem = (cur, set)=> F.select("", cur, shopItemOptions(cur), v=>{
    if (v === "__custom__"){ const id = prompt("id предмета:", cur); if (id) set(sanitizeId(id)); }
    else set(v);
  });
  html += `<div class="list">`;
  shop.items.forEach((it, i)=>{
    const eq = isEquipment(it.itemId);
    html += `<div class="card">
      <div class="lootrow" style="grid-template-columns:minmax(0,1fr) auto">${pickItem(it.itemId, v=>it.itemId=v)}${F.button("✕", ()=>{ shop.items.splice(i,1); commit(); render(); }, "danger")}</div>
      ${eq ? `<div class="lootrow2">${F.select("Редкость", it.rarity||0, RARITIES.map((r,ri)=>[ri, r]), v=>it.rarity=Number(v))}${F.num("Уровень", it.level||0, v=>it.level=v, {int:true, min:0, max:99, hint:"0 — по уровню героя"})}</div>` : ""}
      <div class="lootrow2">${F.num("Появится с уровня героя", it.minLevel||0, v=>it.minLevel=v, {int:true, min:0, max:99, hint:"0 — сразу"})}${F.text("Только с отметкой", it.needFlag||"", v=>it.needFlag=v, {list:"flagList", hint:"редкий товар по сюжету"})}</div>
    </div>`;
  });
  html += `</div><div style="display:flex;gap:6px;flex-wrap:wrap;">
    ${F.button("+ Товар", ()=>{ shop.items.push({itemId:"potion_hp", rarity:0, level:0}); commit(); render(); })}
    ${shop.items.length ? "" : F.button("Взять стандартные расходники", ()=>{ ["berry","potion_hp","potion_sp","scroll_return"].forEach(id=> shop.items.push({itemId:id, rarity:0, level:0})); commit(); render(); })}
  </div>
  <p class="hint">Цены считает игра: расходники — по своей цене, снаряжение — по редкости и уровню. Количество у торговца не кончается. Продать герой может любое сырьё и снаряжение любому торговцу.</p>`;
  return html;
}
function shopItemOptions(cur){
  // сырьё и золото торговец не продаёт
  const other = [["__custom__","Другой id…"]];
  if (cur && !itemCatalog().some(i=>i.id===cur)) other.unshift([cur, `${cur} (свой id)`]);
  const rawIds = new Set(itemDefs().filter(d=>d.raw).map(d=>d.id));
  return ITEM_GROUPS.filter(([cat])=> cat!=="gold")
    .map(([cat, label])=>({group: cat==="material" ? "Сырьё на продажу" : label, items: itemCatalog().filter(i=>i.category===cat && (cat!=="material" || rawIds.has(i.id))).map(i=>[i.id, i.name])}))
    .concat([{group:"Прочее", items:other}]);
}

    <div class="hint">${n.nodes.length} ${plural(n.nodes.length,"реплика","реплики","реплик")} · ${n.nodes.reduce((a,x)=>a+x.choices.length,0)} вариантов ответа</div></div>

    "В разговоре сами появятся ответы «Отдать золотых гусениц» и «Про золотых гусениц». Награды — «Игра → Золотые гусеницы»."), !!n.collector);
  { const inn = []; n.nodes.forEach(nd=> nd.choices.forEach(c=>{ if (c.action==="inn") inn.push(c); }));
    html += sec("npc_inn", inn.length ? "Гостиница · есть ночлег" : "Гостиница", innFields(F, n, inn), inn.length > 0); }
  html += sec("npc_auto", n.autoTalk && n.autoTalk.enabled ? "Заговаривает сам · включено" : "Заговаривает сам", autoTalkFields(F, n), !!(n.autoTalk && n.autoTalk.enabled) || !!n.hidden);
  const bh = n.behavior || {mode:"stand"};
  const B = ()=>{ n.behavior = n.behavior || {mode:"stand"}; return n.behavior; };
  let bhtml = F.select("Что делает", bh.mode||"stand", [["stand","Стоит на месте"],["wander","Бродит вокруг своего места"],["patrol","Ходит по маршруту"],["sit","Сидит (на ближайшем стуле / скамье)"]], v=>{ B().mode = v; if (v==="patrol" && !(B().points||[]).length) B().points = [{x:n.x, z:n.z}, {x:n.x + 4, z:n.z}]; });
  if ((bh.mode||"stand")==="stand" || bh.mode==="sit") bhtml += F.slider("Смотрит", Number(bh.facing)||0, v=>B().facing=v, {min:-180, max:180, step:15, fmt:v=>({0:"на юг (к камере)", 90:"на восток", "-90":"на запад", 180:"на север", "-180":"на север"}[v] || `${v}°`), hint: bh.mode==="sit" ? "Если рядом (до 1.5 м) стоит стул или скамья — сядет на неё и повернётся, как она" : ""});
  if (bh.mode==="wander") bhtml += F.slider("Радиус прогулки", Number(bh.radius)||4, v=>B().radius=v, {min:1, max:15, step:0.5, fmt:v=>`${v} м`, hint:"Круг виден на карте, когда житель выбран"});
  if (bh.mode==="patrol"){

      <div style="display:flex;gap:6px;flex-wrap:wrap">${F.button(ui.routeFor===n.id ? "Готово (Enter)" : "+ Точки кликом по карте", ()=>{ ui.routeFor = ui.routeFor===n.id ? null : n.id; ui.ctx = areaCtx(n.area) || ui.ctx; render(); if (ui.routeFor) toast("Кликайте по карте — точки маршрута. Enter или Esc — закончить"); }, ui.routeFor===n.id ? "primary" : "")}
      ${F.button("Убрать последнюю", ()=>{ if ((bh.points||[]).length){ B().points.pop(); commit(); render(); } })}${F.button("Очистить", ()=>{ B().points = []; commit(); render(); })}</div>`;
  }

  {

}

/* ---------- дом / пещера ---------- */
function insHouse(F, sel){

  if (cave){

    actions.push(["Копия", duplicateSel], ["Удалить", ()=> deleteSel(sel), "danger"]);
    html += actionsBar(F, actions);
    let back = "";

function craftList(kind){ return Array.isArray(state[kind]) ? state[kind] : (kind==="alchemy" ? DEFAULT_ALCHEMY : DEFAULT_FORGE); }

// цвет отвара — зеркало CraftDB.mix_color (среднее цветов ингредиентов, насыщеннее)
function craftColor(r){
  let n = 0, rr = 0, gg = 0, bb = 0;
  (r.ingredients||[]).forEach(e=>{ const h = validHex(itemColor(e.itemId), "#c8b890"); const q = Number(e.qty)||1;
    rr += parseInt(h.slice(1,3),16)/255*q; gg += parseInt(h.slice(3,5),16)/255*q; bb += parseInt(h.slice(5,7),16)/255*q; n += q; });
  if (!n) return "#40697f";

  const mx = Math.max(rr,gg,bb), mn = Math.min(rr,gg,bb);
  let hh = 0; const d = mx-mn;
  if (d > 0){ if (mx===rr) hh = ((gg-bb)/d) % 6; else if (mx===gg) hh = (bb-rr)/d + 2; else hh = (rr-gg)/d + 4; hh *= 60; if (hh < 0) hh += 360; }

  const f = (k)=>{ const kk = (k + hh/60) % 6; return val - val*sat*Math.max(0, Math.min(kk, 4-kk, 1)); };

function renameDef(key, o, raw, selType){

function whereItemUsed(id){

  (state.npcs||[]).forEach(n=>{ if (has([n.nodes, n.shop])) out.push([`житель «${n.name}»`, {type:"npc", id:n.id}]); });
  (state.cutscenes||[]).forEach(s=>{ if (has(s.steps)) out.push([`сцена «${s.name||s.id}»`, {type:"scene", id:s.id}]); });
  (state.quests||[]).forEach(q=>{ if (has([q.reward, q.stages])) out.push([`задание «${q.name||q.id}»`, {type:"quest", id:q.id}]); });
  (state.battles||[]).forEach(b=>{ if (has(b.items)) out.push([`бой «${b.name}»`, {type:"battle", id:b.id}]); });

/* ---------- прикормка (раунд 100; игра: core/fishing.gd, поле chum) ----------
   Бросается в воду туда, куда падает поплавок (Q во время рыбалки или

const CHUM_WATERS = [["any","любая вода"],["","обычная вода"],["mana","мана-озеро"]];
function chumSection(F, it){
  if (!it.chum) return `<p class="hint">Обычный расходник. Сделайте его прикормкой — его будут бросать в воду у поплавка, а не пить.</p>` + F.button("Сделать прикормкой", ()=>{ it.chum = {dur:120, bite:30}; it.battle = false; if (!it.icon || it.icon==="potion") it.icon = "chum"; commit(); render(); });
  const c = it.chum;
  const pct = (label, key, o={})=> F.num(label, c[key]||0, v=>{ if (Number(v) > 0) c[key] = v; else delete c[key]; }, Object.assign({int:true, min:0, max:o.max||500}, o));

  html += F.num("Держится в воде, секунд", c.dur||120, v=>c.dur=v, {int:true, min:5, max:3600});
  html += `<div class="grid2">${pct("Клюёт быстрее, %", "bite", {max:90})}${pct("Крупная рыба чаще, %", "rare")}</div>`;
  html += `<div class="grid2">${pct("Мусора меньше, %", "junk", {max:100})}${pct("Двойной улов, %", "double", {max:100})}</div>`;
  html += `<div class="grid2">${pct("Сокровище со дна, %", "loot", {max:100})}${pct("Рыбные места чаще, % в минуту", "spot")}</div>`;
  html += pct("Зелёные зоны шире, %", "zone", {max:100});
  const adds = Array.isArray(c.adds) ? c.adds : [];
  html += `<div class="lab">Приманивает (без этой прикормки не клюёт)</div>`;
  adds.forEach((a, i)=>{
    html += `<div class="lootrow" style="grid-template-columns:minmax(0,1fr) 58px minmax(0,110px) 54px auto;align-items:end">
      ${F.select("", a.itemId, itemOptions(a.itemId), v=>a.itemId=v)}

      ${F.select("где", a.water==null?"any":a.water, CHUM_WATERS, v=>a.water=v)}
      ${F.num("кругов", a.rings||0, v=>{ if (Number(v) > 0) a.rings = v; else delete a.rings; }, {int:true, min:0, max:5, placeholder:String(fishRingsOf(a.itemId)), allowEmpty:true})}
      ${F.button("✕", ()=>{ adds.splice(i, 1); if (!adds.length) delete c.adds; commit(); render(); }, "danger")}</div>`;
  });
  html += `<div style="display:flex;gap:6px;flex-wrap:wrap">${F.button("+ Рыба", ()=>{ c.adds = adds; adds.push({itemId:"fish_perch", chance:6, water:"any"}); commit(); render(); })}${F.button("Не прикормка", ()=>{ delete it.chum; commit(); render(); }, "danger")}</div>`;
  html += `<p class="hint">«вес» — как в таблице рыбалки карты: добавляется к её весам. Для сравнения: окунь 30, щука 8, золотой карп 3. Варится в котле (Алхимия → рецепт с этим результатом; склянки не нужны), продаётся в рыболовной лавке.</p>`;
  return html;
}

function mechNeedsBlock(F, m, verb){

  srcs.forEach(src=>{

    h += `<div class="card"><div class="lootrow" style="grid-template-columns:minmax(0,1fr) auto auto auto">
      ${F.check(`${mechName(src)}${i>=0 && m.mode==="order" ? ` <b>№${i+1}</b>` : ""}`, i >= 0, v=>{ if (v){ if (!m.needs.includes(src.id)) m.needs.push(src.id); } else m.needs = m.needs.filter(n=>n!==src.id); })}

      ${F.button("Показать", ()=>{ ui.sel = {type:"mech", id:src.id}; focusOn(...mechPos(src)); render(); })}
    </div></div>`;
  });
  h += `</div>`;
  h += F.select("Условие", m.mode||"all", [["all", `все отмеченные включены — ${verb}`], ["any", `любой из отмеченных — ${verb}`], ["order", `включить строго по порядку (№1, №2…) — ${verb}`]], v=>m.mode=v, {hint: m.mode==="order" ? "Ошибся порядком — рычаги со щелчком возвращаются назад. Подсказку порядка напишите на табличке." : ""});
  return h;

/* ---------- переход ---------- */
function insTransition(F, sel){
  const cell = getSelObj(sel), p = cell.portal;
  const [cx, cz] = parseKey(sel.key);
  let html = insHead(sel, `Переход · клетка ${cx}, ${cz}`, `→ ${mapName(p.targetMap)}`, null, F);
  html += objProblems(sel);
  const actions = [];
  if (p.targetMap !== BACK && state.worldMaps[p.targetMap]) actions.push([`Перейти на «${mapName(p.targetMap)}»`, ()=> enterSel(sel), "primary"]);
  actions.push(["Убрать переход", ()=> deleteSel(sel), "danger"]);
  html += actionsBar(F, actions);
  let back = "";
  if (p.targetMap !== BACK && state.worldMaps[p.targetMap]){
    const tm = p.targetMap;
    const ret = allTransitions().find(t=>t.map===tm && (t.portal.targetMap===sel.map || t.portal.targetMap===BACK))
      || state.houses.find(x=>x.type==="cave" && x.area===tm && (x.targetMap===sel.map || x.targetMap===BACK));
    if (ret) back = `<p class="hint good">✓ С «${esc(mapName(tm))}» есть путь обратно.</p>`;
    else {
      back = `<p class="hint warn">С «${esc(mapName(tm))}» обратно пока не попасть.</p>` + F.button("Создать переход обратно", ()=>{
        const [scx, scz] = cellOf(p.targetSpawnX||0, p.targetSpawnZ||0);
        const tcells = state.worldMaps[tm].cells;
        const key = cellKey(scx, scz);
        if (!tcells[key]){ toast("Сначала укажите точку появления на земле"); return; }
        const [bx, bz] = cellCenter(cx, cz);
        const d = exitDir(state.worldMaps[sel.map].cells, cx, cz);
        let ax = bx - d[0]*CELL, az = bz - d[1]*CELL;
        if (!onCells(sel.map, ax, az)){ ax = bx; az = bz; }
        tcells[key].portal = {targetMap: sel.map, targetSpawnX: ax, targetSpawnZ: az};
        commit(); select({type:"transition", map:tm, key});
        toast("Обратный переход создан на клетке появления: игрок выходит на неё и может сразу шагнуть назад");
      });
    }
  }
  html += sec("tr_to", "Куда ведёт", `
    ${F.select("Карта назначения", p.targetMap, mapTargetOptions(), v=>{
      p.targetMap = v;
      if (v !== BACK && state.worldMaps[v] && !onCells(v, p.targetSpawnX||0, p.targetSpawnZ||0)){ const [x,z] = firstCellPos(state.worldMaps[v].cells); p.targetSpawnX = x; p.targetSpawnZ = z; }
    })}
    ${spawnBlock(F, p, {map:"targetMap", x:"targetSpawnX", z:"targetSpawnZ"}, mapName(sel.map))}
    ${back}
    <p class="hint">В игре: наступил на клетку — сразу переход. Над клеткой будет подпись «→ ${esc(p.targetMap===BACK ? "(откуда пришёл)" : mapName(p.targetMap))}». Перенести переход — перетащить его на другую клетку.</p>`);
  return html;
}

/* ---------- выход этажа ---------- */
function insExit(F, sel){

        const id = uidIn(tf.exits, "back");

  html += sec("exit_main", "Выход", `

    ${F.select("Куда ведёт", e.target, floorsOpts, v=>{ e.target = v; e.targetSpawn = ""; })}
    ${e.target !== "world" ? F.select("Вид прохода", e.look||"", EXIT_LOOKS, v=>{ if (v) e.look = v; else delete e.look; }, {hint:"лестница строится сама и поворачивается к ближайшей стене"}) : ""}
    ${spawn}${back}
    ${isEnter ? `<p class="hint good">★ Входя в здание, игрок появляется здесь.</p>` : F.button("Появляться здесь при входе в здание", ()=>{ h.enterFloor = f.id; h.enterSpawn = e.id; commit(); render(); })}
    ${positionFields(F, e)}`);
  html += sec("exit_adv", "Дополнительно", `${F.text("id выхода", e.id, v=>{ const nid = renameExitId(f.id, e, v); ui.sel = {type:"exit", floor:f.id, id:nid}; }, {mono:true, lazy:true})}`, false);

// делится на страницы так же, как npc/dialogue_data.gd::split_pages
const PAGE_CHARS = 300;
function splitPages(text){
  const out = [];
  String(text||"").replace(/\r\n/g,"\n").trim().split(/\n\s*\n/).forEach(block=>{
    block = block.trim();
    if (!block) return;
    if (block.length <= PAGE_CHARS){ out.push(block); return; }
    const parts = block.match(/[^.!?…]+[.!?…]*\s*/g) || [block];
    let page = "";
    parts.forEach(s=>{
      if (page && (page + s).length > PAGE_CHARS){ out.push(page.trim()); page = ""; }
      page += s;
    });
    if (page.trim()) out.push(page.trim());
  });
  return out.length ? out : [""];
}
// видно ли ответ при текущей «симпатии» в предпросмотре
function choiceVisible(c, rel){

// короткие ярлыки последствий — в заголовке свёрнутого блока и в предпросмотре
function fxChips(c){
  const out = [];
  const rel = Number(c.relation) || 0;
  if (rel) out.push(`<span class="pill" style="border-color:${CompanionColor};color:${CompanionColor}">${CompanionName}: ${rel>0?"+":""}${rel}</span>`);
  const gold = Number(c.gold) || 0;
  if (gold) out.push(`<span class="pill acc">${gold>0?"+":""}${gold} золота</span>`);
  if (c.items && c.items.length) out.push(`<span class="pill acc">${c.items.length} ${plural(c.items.length,"предмет","предмета","предметов")}</span>`);
  if (c.setFlag) out.push(`<span class="pill">отметка «${esc(c.setFlag)}»</span>`);
  if (c.once) out.push(`<span class="pill">один раз</span>`);
  if (c.relMin != null || c.relMax != null) out.push(`<span class="pill">симпатия ${c.relMin==null?"−100":c.relMin}…${c.relMax==null?"+100":c.relMax}</span>`);
  if (c.needFlag) out.push(`<span class="pill">нужна «${esc(c.needFlag)}»</span>`);
  if (c.noFlag) out.push(`<span class="pill">без «${esc(c.noFlag)}»</span>`);
  if (Number(c.minLevel)) out.push(`<span class="pill">с ур. ${Number(c.minLevel)}</span>`);
  if (c.talkNext){ const nn = state.npcs.find(x=>x.id===c.talkNext); out.push(`<span class="pill acc">следом: ${esc(nn ? nn.name : c.talkNext)}</span>`); }
  if (c.takeItems && c.takeItems.length) out.push(`<span class="pill">забрать ${c.takeItems.length} предм.</span>`);
  if (c.clearFlag) out.push(`<span class="pill">снять «${esc(c.clearFlag)}»</span>`);
  if (c.varOpName) out.push(`<span class="pill">${esc(c.varOpName)} ${c.varOp==="set"?"=":"+"} ${Number(c.varOpValue)||0}</span>`);
  if (c.needItem) out.push(`<span class="pill">нужно: ${esc(itemName(c.needItem))}${Number(c.needQty)>1?" ×"+Number(c.needQty):""}</span>`);
  if (c.noItem) out.push(`<span class="pill">без: ${esc(itemName(c.noItem))}</span>`);
  if (Number(c.minGold)) out.push(`<span class="pill">золота ≥ ${Number(c.minGold)}</span>`);
  if (c.quest) out.push(`<span class="pill">задание: ${esc(questName(c.quest))}</span>`);
  if (c.varName) out.push(`<span class="pill">${esc(c.varName)} ${esc(c.varCmp||">=")} ${Number(c.varValue)||0}</span>`);
  return out.join(" ");
}

  const reach = new Set([n.start]);
  n.nodes.forEach(nd=> nd.choices.forEach(c=>{ if (c.next) reach.add(c.next); }));
  let nodes = "";
  n.nodes.forEach((nd, i)=>{
    const start = nd.id === n.start;
    nodes += `<div class="node ${start?"start":""} ${dlg.live===nd.id && !dlg.ended?"live":""}" id="node-${esc(nd.id)}">
      <div class="node-head">
        ${start ? `<span class="pill acc">Начало разговора</span>` : `<button class="btn small" data-mkstart="${i}">Сделать началом</button>`}
        ${reach.has(nd.id) ? "" : `<span class="pill bad" title="на эту реплику не ведёт ни один ответ">не прозвучит</span>`}
        <span class="nid">${esc(nd.id)}</span>
        <span class="grow"></span>
        <button class="btn small" data-play="${i}" title="Проверить разговор с этой реплики">▶ отсюда</button>
        <button class="btn small danger" data-delnode="${i}" ${n.nodes.length<=1?"disabled":""}>Удалить</button>
      </div>
      <textarea data-ntext="${i}" rows="3" placeholder="Что говорит ${esc(own.name)}">${esc(nd.text)}</textarea>
      <div class="choice-extra" style="grid-template-columns:1fr 1fr">
        <select data-nemo="${i}" title="Лицо собеседника на портрете, пока звучит эта реплика">${EMOTIONS.map(([v,l])=>`<option value="${v}" ${(nd.emotion||"normal")===v?"selected":""}>${esc(own.name)}: ${EMO_ICON[v]||""} ${l}</option>`).join("")}</select>
        <select data-nhemo="${i}" title="Лицо героя на портрете, пока он выбирает ответ">${EMOTIONS.map(([v,l])=>`<option value="${v}" ${(nd.heroEmotion||"normal")===v?"selected":""}>Герой отвечает: ${EMO_ICON[v]||""} ${l}</option>`).join("")}</select>
      </div>
      ${splitPages(nd.text).length > 1 ? `<div class="hint">Монолог: ${splitPages(nd.text).length} ${plural(splitPages(nd.text).length,"страница","страницы","страниц")} — игрок листает их Enter'ом.</div>` : ""}
      <div class="hint" style="margin-top:8px;">Ответы героя${nd.choices.length ? "" : " — нет: после этой реплики разговор закончится"}</div>`;
    nd.choices.forEach((c, j)=>{
      const known = dialogActions().some(a=>a[0]===c.action);
      nodes += `<div class="choice">
          <input type="text" data-ctext="${i}:${j}" value="${esc(c.text)}" placeholder="Текст ответа">
          <select data-cnext="${i}:${j}" title="Что будет после этого ответа">
            <option value="" ${!c.next?"selected":""}>→ конец разговора</option>
            ${n.nodes.map(o=>`<option value="${esc(o.id)}" ${c.next===o.id?"selected":""}>→ ${esc(o.id===nd.id ? "эта же реплика" : nodeTitle(o))}</option>`).join("")}
            <option value="__new__">＋ новая реплика…</option>
          </select>
          <button class="btn small danger" data-delch="${i}:${j}" title="Удалить ответ">✕</button>
        </div>
        <div class="choice-extra">
          <select data-cact="${i}:${j}" title="Особое действие при выборе ответа">
            ${dialogActions().map(([v,l])=>`<option value="${v}" ${c.action===v || (!c.action && !v)?"selected":""}>действие: ${l}</option>`).join("")}
            <option value="__custom__" ${!known?"selected":""}>действие: другое…</option>
          </select>
          ${known ? "<span></span>" : `<input type="text" class="mono" data-cactc="${i}:${j}" value="${esc(c.action)}" placeholder="id действия">`}
          <span></span>
        </div>
        ${choiceFx(i, j, c)}`;
    });
    nodes += `<button class="btn small" data-addch="${i}" style="margin-top:8px;">+ Ответ</button></div>`;
  });

  // предпросмотр: страницы монолога + ответы с учётом симпатии
  const live = n.nodes.find(x=>x.id===dlg.live);
  const pages = live ? splitPages(live.text) : [""];
  if (dlg.page >= pages.length) dlg.page = pages.length - 1;
  let pv = "";
  if (dlg.ended || !live){
    pv = `<div class="pv-end">Разговор окончен${dlg.action ? ` · сработало действие «${esc(dlg.action)}»` : ""}.</div>`;
  } else {
    pv = `<div class="pv-text">${esc(pages[dlg.page] || "")}</div>`;
    if (pages.length > 1) pv += `<div class="hint">страница ${dlg.page+1} из ${pages.length}</div>`;
    if (dlg.page < pages.length - 1){
      pv += `<div class="pv-choices"><button class="pv-choice" data-pvnext="1">Далее ▸</button></div>`;
    } else if (live.choices.length){
      const vis = live.choices.map((c,j)=>[c,j]).filter(([c])=>choiceVisible(c, dlg.rel));
      pv += `<div class="pv-choices">${vis.map(([c,j])=>`<button class="pv-choice" data-pv="${j}">${esc(c.text||"…")}${c.action?` <span style="color:#a9a3b8">(${esc(c.action)})</span>`:""}<br>${fxChips(c)}</button>`).join("")}</div>`;
      if (vis.length < live.choices.length) pv += `<div class="hint">${live.choices.length - vis.length} ${plural(live.choices.length - vis.length,"ответ скрыт","ответа скрыто","ответов скрыто")} условием симпатии</div>`;
      if (!vis.length) pv += `<div class="pv-choices"><button class="pv-choice" data-pvend="1">Разговор закончится — видимых ответов нет</button></div>`;
    } else {
      pv += `<div class="pv-choices"><button class="pv-choice" data-pvend="1">Далее ▸ (разговор закончится)</button></div>`;
    }
    if (dlg.action) pv += `<div class="pv-end">Сработало действие «${esc(dlg.action)}»</div>`;
  }
  root.innerHTML = `<div class="modal" id="dlgModal">
    <div class="modal-box" role="dialog" aria-label="Диалог">
      <div class="modal-head">
        <div style="width:30px;height:30px;border-radius:50%;background:${own.color};flex:0 0 auto;"></div>
        <div><h2>${esc(own.title)}</h2><div class="hint">${esc(own.sub)} Справа можно сразу проверить разговор.</div></div>
        <span class="grow"></span>
        <button class="btn" id="dlgAdd">+ Реплика</button>
        <button class="btn primary" id="dlgClose">Готово (Esc)</button>
      </div>
      <div class="modal-body">
        <div class="dlg">
          <div id="dlgNodes">${nodes}</div>
          <div class="preview">
            <div class="pv-top"><span>Проверка в игре</span><button class="btn small" id="pvRestart">С начала</button></div>
            <div class="pv-box"><span class="pv-name">${esc(own.name)}${live && !dlg.ended ? " " + (EMO_ICON[live.emotion||"normal"]||"") : ""}</span>${pv}</div>
            <div class="field" style="margin-top:10px;">
              <span>Симпатия ${esc(CompanionName)} в проверке: <b id="pvRelVal">${dlg.rel>0?"+":""}${dlg.rel}</b> · ${esc(bondName(dlg.rel))}</span>
              <input type="range" id="pvRel" min="-100" max="100" step="5" value="${dlg.rel}">
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>`;

  const modal = root.querySelector("#dlgModal");
  modal.addEventListener("pointerdown", ev=>{ if (ev.target === modal) closeModal(); });
  root.querySelector("#dlgClose").onclick = closeModal;
  const structural = (focusSel)=>{ commit(); renderDialogue(focusSel); softRefresh(); };
  const newNode = (fromIdx)=>{
    const ids = new Set(n.nodes.map(x=>x.id)); let k = 1; while (ids.has("node_"+k)) k++;
    const id = "node_"+k;
    const from = n.nodes[fromIdx];
    n.nodes.push({id, text:"", choices: from ? [{text:"Назад", next:from.id, action:""}] : [{text:"Пока.", next:"", action:""}]});
    return id;
  };
  root.querySelector("#dlgAdd").onclick = ()=>{ const id = newNode(-1); structural(id); };
  root.querySelector("#pvRestart").onclick = ()=>{ dlg.live = n.start; dlg.page = 0; dlg.ended = false; dlg.action = ""; renderDialogue(); };
  root.querySelectorAll("[data-pv]").forEach(b=> b.onclick = ()=>{
    const c = live.choices[Number(b.dataset.pv)];
    dlg.action = c.action || "";
    dlg.rel = Math.max(-100, Math.min(100, dlg.rel + (Number(c.relation)||0)));
    dlg.page = 0;
    if (c.next && n.nodes.some(x=>x.id===c.next)){ dlg.live = c.next; } else { dlg.ended = true; }
    renderDialogue(dlg.ended ? null : dlg.live);
  });
  root.querySelectorAll("[data-pvnext]").forEach(b=> b.onclick = ()=>{ dlg.page++; renderDialogue(); });
  root.querySelectorAll("[data-pvend]").forEach(b=> b.onclick = ()=>{ dlg.ended = true; dlg.action = ""; renderDialogue(); });
  root.querySelectorAll("[data-play]").forEach(b=> b.onclick = ()=>{ dlg.live = n.nodes[Number(b.dataset.play)].id; dlg.page = 0; dlg.ended = false; dlg.action = ""; renderDialogue(); });
  const relSlider = root.querySelector("#pvRel");
  if (relSlider) relSlider.addEventListener("input", ()=>{ dlg.rel = Number(relSlider.value); renderDialogue(); });
  root.querySelectorAll("[data-mkstart]").forEach(b=> b.onclick = ()=>{ n.start = n.nodes[Number(b.dataset.mkstart)].id; structural(); });
  root.querySelectorAll("[data-delnode]").forEach(b=> b.onclick = ()=>{
    const nd = n.nodes[Number(b.dataset.delnode)];
    if (n.nodes.length <= 1) return;
    n.nodes = n.nodes.filter(x=>x!==nd);
    n.nodes.forEach(x=> x.choices.forEach(c=>{ if (c.next===nd.id) c.next = ""; }));
    if (n.start===nd.id) n.start = n.nodes[0].id;
    if (dlg.live===nd.id) dlg.live = n.start;
    structural();
    toast("Реплика удалена", "Отменить", ()=>{ undo(); if (dlg) renderDialogue(); });
  });
  root.querySelectorAll("[data-nemo]").forEach(s=> s.onchange = ()=>{ const nd = n.nodes[Number(s.dataset.nemo)]; if (s.value==="normal") delete nd.emotion; else nd.emotion = s.value; structural(); });
  root.querySelectorAll("[data-nhemo]").forEach(s=> s.onchange = ()=>{ const nd = n.nodes[Number(s.dataset.nhemo)]; if (s.value==="normal") delete nd.heroEmotion; else nd.heroEmotion = s.value; structural(); });
  root.querySelectorAll("[data-ntext]").forEach(t=>{
    t.addEventListener("input", ()=>{ n.nodes[Number(t.dataset.ntext)].text = t.value; scheduleSave(); refreshPreviewText(); });
    t.addEventListener("change", ()=>{ commit(); renderDialogue(); softRefresh(); });
  });
  root.querySelectorAll("[data-ctext]").forEach(t=>{
    const [i,j] = t.dataset.ctext.split(":").map(Number);
    t.addEventListener("input", ()=>{ n.nodes[i].choices[j].text = t.value; scheduleSave(); });
    t.addEventListener("change", ()=>{ commit(); renderDialogue(); });
  });
  root.querySelectorAll("[data-cnext]").forEach(s=>{
    const [i,j] = s.dataset.cnext.split(":").map(Number);
    s.onchange = ()=>{
      if (s.value === "__new__"){ const id = newNode(i); n.nodes[i].choices[j].next = id; structural(id); return; }
      n.nodes[i].choices[j].next = s.value; structural();
    };
  });
  root.querySelectorAll("[data-cact]").forEach(s=>{
    const [i,j] = s.dataset.cact.split(":").map(Number);
    s.onchange = ()=>{ const c = n.nodes[i].choices[j]; c.action = s.value === "__custom__" ? (c.action && !dialogActions().some(a=>a[0]===c.action) ? c.action : "custom_action") : s.value; structural(); };
  });
  root.querySelectorAll("[data-cactc]").forEach(t=>{
    const [i,j] = t.dataset.cactc.split(":").map(Number);
    t.addEventListener("change", ()=>{ n.nodes[i].choices[j].action = sanitizeId(t.value); structural(); });
  });
  root.querySelectorAll("[data-delch]").forEach(b=>{
    const [i,j] = b.dataset.delch.split(":").map(Number);
    b.onclick = ()=>{ n.nodes[i].choices.splice(j,1); structural(); };
  });
  root.querySelectorAll("[data-addch]").forEach(b=>{
    b.onclick = ()=>{ n.nodes[Number(b.dataset.addch)].choices.push({text:"", next:"", action:""}); structural(); };
  });
  // последствия и условия ответа
  const choiceAt = (ds)=>{ const [i,j] = ds.split(":").map(Number); return n.nodes[i].choices[j]; };
  root.querySelectorAll("[data-cnum]").forEach(t=>{
    const [i,j,field] = t.dataset.cnum.split(":");
    t.addEventListener("change", ()=>{ n.nodes[Number(i)].choices[Number(j)][field] = Math.round(Number(t.value)||0); structural(); });
  });
  root.querySelectorAll("[data-crel]").forEach(t=>{
    const [i,j,field] = t.dataset.crel.split(":");
    t.addEventListener("change", ()=>{
      const s = String(t.value).trim().replace(",", ".");
      n.nodes[Number(i)].choices[Number(j)][field] = s === "" ? null : Math.max(-100, Math.min(100, Math.round(Number(s)) || 0));
      structural();
    });
  });
  root.querySelectorAll("[data-cflag]").forEach(t=>{
    const [i,j,field] = t.dataset.cflag.split(":");
    t.addEventListener("change", ()=>{ const ch = n.nodes[Number(i)].choices[Number(j)]; if (String(t.value).trim()) ch[field] = sanitizeId(t.value); else delete ch[field]; structural(); });
  });
  root.querySelectorAll("[data-csel]").forEach(t=>{
    const [i,j,field] = t.dataset.csel.split(":");
    t.addEventListener("change", ()=>{ const ch = n.nodes[Number(i)].choices[Number(j)]; if (t.value) ch[field] = t.value; else delete ch[field]; structural(); });
  });
  root.querySelectorAll("[data-ctkadd]").forEach(b=>{
    b.onclick = ()=>{ const c = choiceAt(b.dataset.ctkadd); c.takeItems = c.takeItems || []; c.takeItems.push({itemId:"potion_hp", qty:1}); structural(); };
  });
  root.querySelectorAll("[data-ctkdel]").forEach(b=>{
    const [i,j,k] = b.dataset.ctkdel.split(":").map(Number);
    b.onclick = ()=>{ n.nodes[i].choices[j].takeItems.splice(k,1); structural(); };
  });
  root.querySelectorAll("[data-ctkitem]").forEach(t=>{
    const [i,j,k] = t.dataset.ctkitem.split(":").map(Number);
    t.addEventListener("change", ()=>{ n.nodes[i].choices[j].takeItems[k].itemId = t.value; structural(); });
  });
  root.querySelectorAll("[data-ctkqty]").forEach(t=>{
    const [i,j,k] = t.dataset.ctkqty.split(":").map(Number);
    t.addEventListener("change", ()=>{ n.nodes[i].choices[j].takeItems[k].qty = Math.max(1, Math.round(Number(t.value))||1); structural(); });
  });
  root.querySelectorAll("[data-cnext]").forEach(t=>{
    t.addEventListener("change", ()=>{ const ch = choiceAt(t.dataset.cnext); ch.talkNext = t.value; ch.talkNode = ""; if (!t.value) delete ch.talkNext; structural(); });
  });
  root.querySelectorAll("[data-cnextnode]").forEach(t=>{
    t.addEventListener("change", ()=>{ choiceAt(t.dataset.cnextnode).talkNode = t.value; structural(); });
  });
  root.querySelectorAll("[data-conce]").forEach(t=>{
    t.addEventListener("change", ()=>{ choiceAt(t.dataset.conce).once = t.checked; structural(); });
  });
  root.querySelectorAll("[data-caddit]").forEach(b=>{
    b.onclick = ()=>{ const c = choiceAt(b.dataset.caddit); c.items = c.items || []; c.items.push({itemId:"potion_hp", qty:1, rarity:0, level:0}); structural(); };
  });
  root.querySelectorAll("[data-cdelit]").forEach(b=>{
    const [i,j,k] = b.dataset.cdelit.split(":").map(Number);
    b.onclick = ()=>{ n.nodes[i].choices[j].items.splice(k,1); structural(); };
  });
  const itemField = (attr, key, num)=> root.querySelectorAll(`[data-${attr}]`).forEach(t=>{
    const [i,j,k] = t.dataset[attr].split(":").map(Number);
    t.addEventListener("change", ()=>{ n.nodes[i].choices[j].items[k][key] = num ? (Math.round(Number(t.value))||0) : t.value; structural(); });
  });
  itemField("citem", "itemId", false);
  itemField("cqty", "qty", true);
  itemField("crar", "rarity", true);
  itemField("clvl", "level", true);
  decorateTips(root);
  if (scrollTo){
    const el = root.querySelector(`#node-${CSS.escape(scrollTo)}`);
    if (el){ el.scrollIntoView({block:"nearest"}); const ta = el.querySelector("textarea"); if (ta && !ta.value) ta.focus(); }
  }
  function refreshPreviewText(){
    const box = root.querySelector(".pv-text");
    const l = n.nodes.find(x=>x.id===dlg.live);
    if (box && l) box.textContent = splitPages(l.text)[dlg.page] || "";
  }
}

   decorateTips(root) после каждой отрисовки сам ставит значки. Шаги сцены —

function tipText(t){
  t = String(t||"").replace(/\s+/g, " ").trim().replace(/:$/, "");
  if (!t) return null;
  if (FIELD_TIPS[t]) return FIELD_TIPS[t];
  let u = t.split(" · ")[0].trim();
  if (FIELD_TIPS[u]) return FIELD_TIPS[u];
  if (FIELD_TIPS["§" + u]) return FIELD_TIPS["§" + u];
  u = u.replace(/\s*\([^)]*\)\s*$/, "").trim();
  return FIELD_TIPS[u] || FIELD_TIPS["§" + u] || null;
}
// первый текстовый кусок элемента (без вложенных полей и подсказок)
function ownText(el){
  for (const n of el.childNodes){ if (n.nodeType === 3 && n.textContent.trim()) return n.textContent; if (n.nodeType === 1 && n.tagName === "B") return n.textContent; }
  return "";
}
function tipSpan(text){ return `<span class="tip" tabindex="0" data-tip="${esc(text)}">?</span>`; }
function decorateTips(root){
  if (!root) return;
  const put = (el, text)=>{
    if (!text || el.querySelector(":scope > .tip")) return;
    const t = document.createElement("span");
    t.className = "tip"; t.tabIndex = 0; t.dataset.tip = text; t.textContent = "?";
    // после первого текста подписи
    const first = [...el.childNodes].find(n=> (n.nodeType === 3 && n.textContent.trim()) || (n.nodeType === 1 && n.tagName === "B"));
    if (first && first.nextSibling) el.insertBefore(t, first.nextSibling); else el.appendChild(t);
  };
  root.querySelectorAll("label, .lab, summary, .field > span, label.check > span").forEach(el=>{
    if (el.closest(".tip, .guide, .shelp")) return;
    if (el.tagName === "LABEL" && el.querySelector("input, select, textarea") && !el.classList.contains("check")) return;   // подпись — во вложенном span
    if (el.tagName === "LABEL" && el.classList.contains("check")) return;   // у галочки — её span
    let text = tipText(ownText(el));
    if (!text && el.tagName === "SUMMARY") text = tipText("§" + ownText(el).split(" · ")[0].trim());
    if (text) put(el, text);
  });
}

document.body.appendChild(tipBox);
let tipFor = null;
function showTip(el){
  tipFor = el;
  tipBox.textContent = el.dataset.tip;
  tipBox.hidden = false;
  const r = el.getBoundingClientRect(), bw = Math.min(340, window.innerWidth - 20);
  tipBox.style.maxWidth = bw + "px";
  const bh = tipBox.offsetHeight;
  let x = Math.min(Math.max(10, r.left + r.width / 2 - bw / 2), window.innerWidth - bw - 10);
  let y = r.bottom + 8;
  if (y + bh > window.innerHeight - 8) y = Math.max(8, r.top - bh - 8);
  tipBox.style.left = x + "px"; tipBox.style.top = y + "px";
}
function hideTip(){ tipFor = null; tipBox.hidden = true; }
document.addEventListener("mouseover", ev=>{ const t = ev.target.closest && ev.target.closest("[data-tip]"); if (t) showTip(t); else if (tipFor) hideTip(); });
document.addEventListener("focusin", ev=>{ const t = ev.target.closest && ev.target.closest("[data-tip]"); if (t) showTip(t); });
document.addEventListener("focusout", ()=> hideTip());

// ---------- проверка: расчёт времени шагов и движения фигур ----------
function sceneTimeline(s){

  state.npcs.filter(n=>n.area===s.area).forEach(n=> cur[n.id] = sa[n.id] ? {x:sa[n.id].x, z:sa[n.id].z, vis:!n.hidden} : {x:n.x, z:n.z, vis:!n.hidden});

  const key = (id, t)=>{ if (!cur[id]) return; (keys[id] = keys[id] || []).push({t, ...cur[id]}); };

  let t = 0, bgEnd = 0;
  (s.steps||[]).forEach((st, i)=>{
    let dur = 0.3;
    const a = st.actor || "hero";
    switch (st.type){
      case "say": dur = 1.4 + String(st.text||"").length * 0.045; says.push({t0:t, t1:t+dur, st, i});
        if (st.emote) emotes.push({a:st.who, t0:t, t1:t+1.8, icon:st.emote});

      case "emote": dur = Math.max(Number(st.time)||1.5, 0.3); emotes.push({a, t0:t, t1:t+dur, icon:st.icon||"exclaim"}); if (st.jump) jumps.push({a, t0:t, t1:t+0.45}); break;
      case "move": {

        (st.points||[]).forEach(p=>{ const d = Math.hypot(p.x-cur[a].x, p.z-cur[a].z); tt += d/spd; cur[a].x = p.x; cur[a].z = p.z; cur[a].vis = true; key(a, tt); });
        dur = tt - t; break;
      }
      case "jump": dur = 0.45; jumps.push({a, t0:t, t1:t+dur}); break;
      case "appear": if (!cur[a]) cur[a] = {x:0, z:0, vis:false}; key(a, t); cur[a].x = Number(st.x)||0; cur[a].z = Number(st.z)||0; cur[a].vis = true; key(a, t); dur = 0.4; break;
      case "vanish": if (cur[a]){ key(a, t); cur[a].vis = false; key(a, t); } dur = 0.3; break;
      case "camera": dur = Math.max(Number(st.time)||1, 0.05); cams.push({t0:t, st}); break;
      case "wait": dur = Math.max(Number(st.time)||1, 0); break;
      case "talk": dur = 2.5; says.push({t0:t, t1:t+dur, st:{who:st.npc, emotion:"normal", text:"(обычный диалог жителя с ответами)"}, i}); break;
      case "battle": dur = 2.0; says.push({t0:t, t1:t+dur, st:{who:"narrator", text:"⚔ БОЙ: " + (st.monsters||[]).map(m=>monsterName(m.type)).join(", ")}, i}); break;
      case "join": dur = 0.8; says.push({t0:t, t1:t+dur, st:{who:"narrator", text:`🤝 ${CompanionName} вступает в отряд`}, i}); break;
      case "teleport": dur = 1.2; says.push({t0:t, t1:t+dur, st:{who:"narrator", text:`🌀 Переход на «${mapName(st.map)}»`}, i}); break;
      case "quest": dur = 0.8; says.push({t0:t, t1:t+dur, st:{who:"narrator", text:`📜 Новое задание: «${questName(st.quest)}»`}, i}); break;
      // раунд 49: проверка идёт по шагам подряд — все ветки одна за другой
      case "choice": dur = 1.4 + String(st.text||"").length * 0.045; says.push({t0:t, t1:t+dur, st:{who:st.who, emotion:st.emotion, text:(st.text ? st.text + "\n" : "") + (st.options||[]).map((o, k)=>`${k+1}) ${o.text||"…"}${o.goto ? "  → 🔖 " + o.goto : ""}`).join("\n")}, i}); break;
      case "take": dur = 0.8; says.push({t0:t, t1:t+dur, st:{who:"narrator", text:`🫳 Забирают: ${[Number(st.gold) ? st.gold + " золота" : ""].concat((st.items||[]).map(x=>itemName(x.itemId) + " ×" + (x.qty||1))).filter(Boolean).join(", ") || "ничего"}`}, i}); break;
      case "heal": dur = 0.6; says.push({t0:t, t1:t+dur, st:{who:"narrator", text:"💚 Отряд отдохнул"}, i}); break;
      case "fade": dur = Math.max(Number(st.time)||0.8, 0.05); says.push({t0:t, t1:t+dur, st:{who:"narrator", text:({out:"🌑 затемнение", in:"🌕 из затемнения", flash:"⚡ вспышка"})[st.mode||"out"]}, i}); break;
      case "shake": dur = Math.max(Number(st.time)||0.6, 0.05); break;
      case "if": dur = 0.8; says.push({t0:t, t1:t+dur, st:{who:"narrator", text:`⑂ Если ${condText(st)} → ${st.goto ? "🔖 " + st.goto : "дальше"}, иначе → ${st.elseGoto ? "🔖 " + st.elseGoto : "дальше"}`}, i}); break;
      case "label": case "goto": case "end": case "var": case "sound": case "mech": dur = 0; break;
      case "blacktext": dur = 1.2 + String(st.text||"").length * 0.05; says.push({t0:t, t1:t+dur, st:{who:"narrator", text:"🖋 (чёрный экран) " + (st.text||"")}, i}); break;
      case "name": dur = 1.5; says.push({t0:t, t1:t+dur, st:{who:"narrator", text:"✍ Игрок вводит имя: " + (st.prompt||"Как тебя зовут?")}, i}); break;

function actorAt(k, T){
  if (!k || !k.length) return null;
  let i = 0;

  const f = clamp((T - a.t)/(b.t - a.t), 0, 1);
  return {x:a.x + (b.x-a.x)*f, z:a.z + (b.z-a.z)*f, vis:true};
}

// ---------- мини-карта места (раунд 27: переделана) ----------
// Вид — сам, в метрах: колесо — приближение к курсору, тянуть пустое место —
// двигать, «По сцене» — показать всех участников. Фигурки — в пикселях (видно
// при любом масштабе) с именами. Показывается расстановка НА НАЧАЛО выбранного
// шага; у выбранного шага «Пройти» — путь со стрелками: клик по карте добавляет
// точку, точки тянутся мышью, правый клик — удалить; клик по фигурке — выбрать,
// кто идёт. Кнопка «+ Движение» заводит шаг сразу.
const SC_MAP_H = 440;
function sceneTarget(s){
  if (s.trigger !== "talk") return null;
  const who = s.talkTo || "lira";
  if (who === "lira"){ const cs = state.companionStart; return cs && cs.area===s.area ? {x:cs.x, z:cs.z} : null; }
  const n = state.npcs.find(x=>x.id===who); return n && n.area===s.area ? {x:n.x, z:n.z} : null;
}
// Лира ещё не в отряде в этой сцене — стоит на своём месте ожидания
function liraWaitsIn(s){
  const cs = state.companionStart;
  if (cs.inParty || cs.area !== s.area) return false;
  return (s.steps||[]).some(st=>st.type==="join") || (s.trigger==="talk" && (s.talkTo||"lira")==="lira");
}
function sceneHeroStart(s){
  if (s.startAt && s.startAt.hero) return {x:s.startAt.hero.x, z:s.startAt.hero.z};
  if (s.previewHero) return {x:s.previewHero.x, z:s.previewHero.z};
  const t = sceneTarget(s);
  if (t) return {x:t.x, z:t.z + 1.8};

function sceneInvolved(s){

  if (s.trigger==="talk") ids.add(s.talkTo || "lira");

function sceneFit(s){
  const tl = sceneTimeline(s);

  Object.keys(tl.keys).forEach(id=>{ if (inv.has(id)) tl.keys[id].forEach(k=>{ if (k.vis !== false) pts.push([k.x, k.z]); }); });
  (s.steps||[]).forEach(st=>{ (st.points||[]).forEach(p=>pts.push([p.x, p.z])); if (st.type==="appear" || (st.type==="camera" && st.mode==="point")) pts.push([Number(st.x)||0, Number(st.z)||0]); });

  pts.forEach(([x,z])=>{ a=Math.min(a,x); b=Math.max(b,x); c=Math.min(c,z); d=Math.max(d,z); });
  const el = document.getElementById("scMap");
  const W = el ? Math.max(el.clientWidth, 200) : 460;
  const spanX = Math.max(b - a + 10, 18), spanZ = Math.max(d - c + 10, 14);
  const scale = Math.min(W / spanX, SC_MAP_H / spanZ);

}
function sceneViewBox(){
  const el = document.getElementById("scMap");

  const v = sceneEd.view;
  const w = W / v.scale, h = SC_MAP_H / v.scale;

// кто где стоит к началу шага i (-1 — в начале сцены)
function sceneStateAt(s, tl, i){

  const out = {};
  Object.keys(tl.keys).forEach(id=>{ const p = actorAt(tl.keys[id], T + 1e-4); if (p) out[id] = p; });

// цвет клетки места сцены — как на основной карте (там cellFill берёт текущее место)
function sceneCellFill(area, cell){

  const m = state.worldMaps[area];

  if (bc) base = shade(safe ? bc[0] : bc[1], 0.12);

function sceneMapSvg(s, T){

    const x = cx*CELL - CELL/2, z = cz*CELL - CELL/2;

  const tl = sceneTimeline(s);
  const focus = sceneEd.focus;
  const fst = focus >= 0 ? (s.steps||[])[focus] : null;
  const inv = sceneInvolved(s);
  // пути всех шагов «Пройти» (выбранный — ярко, со стрелками и номерами)

    const col = actorColor(s, a);
    if (pts.length >= 2){
      g += `<polyline points="${pts.map(p=>p.x+","+p.z).join(" ")}" fill="none" stroke="${col}" stroke-width="${(on?4:2)*k}" stroke-dasharray="${on?"":`${6*k} ${4*k}`}" opacity="${on?1:0.55}" stroke-linejoin="round"/>`;
      if (on) for (let q = 1; q < pts.length; q++){
        const p0 = pts[q-1], p1 = pts[q]; const mx = (p0.x+p1.x)/2, mz = (p0.z+p1.z)/2; const ang = Math.atan2(p1.z-p0.z, p1.x-p0.x) * 180 / Math.PI;
        g += `<path d="M${-6*k} ${-5*k}L${6*k} 0L${-6*k} ${5*k}z" fill="${col}" transform="translate(${mx} ${mz}) rotate(${ang})"/>`;
      }
    }
    if (on) (st.points||[]).forEach((p,kk)=>{ g += `<circle data-spt="${i}:${kk}" cx="${p.x}" cy="${p.z}" r="${7*k}" fill="${col}" stroke="#fff" stroke-width="${2*k}" style="cursor:move"/><text x="${p.x}" y="${p.z+3.5*k}" font-size="${10*k}" text-anchor="middle" font-weight="700" fill="#fff" pointer-events="none">${kk+1}</text>`; });
  });
  (s.steps||[]).forEach((st, i)=>{
    if (st.type==="appear") g += `<circle cx="${st.x}" cy="${st.z}" r="${9*k}" fill="none" stroke="#e7b451" stroke-width="${(i===focus?3:1.5)*k}" stroke-dasharray="${3*k} ${2*k}"/>`;
    if (st.type==="camera" && st.mode==="point"){ const z = Number(st.zoom)||1; g += `<rect x="${st.x-10*z}" y="${st.z-6*z}" width="${20*z}" height="${12*z}" fill="none" stroke="#4d86e8" stroke-width="${(i===focus?2.5:1.2)*k}" stroke-dasharray="${6*k} ${4*k}" rx="${4*k}"/>`; }
  });
  // фигурки: в проверке — по времени; иначе — к началу выбранного шага
  const pos = T != null ? (()=>{ const o = {}; Object.keys(tl.keys).forEach(id=>{ const p = actorAt(tl.keys[id], T); if (p) o[id] = p; }); return o; })() : sceneStateAt(s, tl, focus);
  Object.keys(pos).forEach(id=>{
    const p = pos[id];
    if (!p.vis) return;
    let hop = 0; if (T != null) tl.jumps.forEach(j=>{ if (j.a===id && T>=j.t0 && T<=j.t1) hop = Math.sin((T-j.t0)/(j.t1-j.t0)*Math.PI)*0.8; });
    const important = inv.has(id);
    const isMover = fst && fst.type==="move" && (fst.actor||"hero")===id;
    const r = (important ? 10 : 7) * k;
    const col = actorColor(s, id);
    const pinned = T == null && focus < 0 && s.startAt && s.startAt[id];
    g += `<g data-sact="${esc(id)}" style="cursor:move" opacity="${important?1:0.6}">
      ${pinned ? `<circle cx="${p.x}" cy="${p.z}" r="${r+3.5*k}" fill="none" stroke="#e7b451" stroke-width="${2*k}" stroke-dasharray="${3*k} ${2*k}"/>` : ""}
      ${isMover ? `<circle cx="${p.x}" cy="${p.z-hop}" r="${r+5*k}" fill="none" stroke="#fff" stroke-width="${2.5*k}"/>` : ""}
      <circle cx="${p.x}" cy="${p.z-hop}" r="${r}" fill="${col}" stroke="#fff" stroke-width="${2*k}"/>
      <text x="${p.x}" y="${p.z-hop+4*k}" font-size="${11*k}" text-anchor="middle" font-weight="800" fill="#fff" pointer-events="none">${esc(actorName(s,id).slice(0,1).toUpperCase())}</text>
      ${important || isMover ? `<text x="${p.x}" y="${p.z-hop-r-4*k}" font-size="${11*k}" text-anchor="middle" font-weight="700" fill="#fff" stroke="rgba(0,0,0,.65)" stroke-width="${3*k}" paint-order="stroke" pointer-events="none">${esc(actorName(s,id))}</text>` : `<title>${esc(actorName(s,id))}</title>`}
      ${T != null ? tl.emotes.filter(e=>e.a===id && T>=e.t0 && T<=e.t1).map(e=>`<circle cx="${p.x + r*1.3}" cy="${p.z-hop-r*2.4}" r="${11*k}" fill="#fff" stroke="#1c1f2e" stroke-width="${1.5*k}"/><text x="${p.x + r*1.3}" y="${p.z-hop-r*2.4 + 5*k}" font-size="${13*k}" text-anchor="middle" pointer-events="none">${EMOTE_GLYPH[e.icon]||"❗"}</text>`).join("") : ""}
    </g>`;
  });
  if (T != null){
    let cam = null; tl.cams.forEach(c=>{ if (c.t0 <= T) cam = c.st; });
    if (cam){
      let fx = 0, fz = 0;
      if (cam.mode==="point"){ fx = Number(cam.x)||0; fz = Number(cam.z)||0; }
      else { const p = actorAt(tl.keys[cam.mode==="hero" ? "hero" : cam.actor], T); if (p){ fx = p.x; fz = p.z; } }
      const z = Number(cam.zoom)||1, w = 20*z, h = 12*z;
      g += `<rect x="${fx-w/2}" y="${fz-h/2}" width="${w}" height="${h}" fill="none" stroke="#4d86e8" stroke-width="${2.5*k}" stroke-dasharray="${8*k} ${5*k}" rx="${6*k}"/>`;
    }
  }
  const adding = fst && fst.type==="move" && !sceneEd.pick;
  return `<svg id="scSvg" viewBox="${bb.x} ${bb.z} ${bb.w} ${bb.h}" style="width:100%;height:${SC_MAP_H}px;display:block;background:var(--water);border-radius:8px;cursor:${sceneEd.pick || adding ? "crosshair" : "grab"};touch-action:none"><g style="font-family:inherit">${g}</g></svg>`;
}
// место актёра в начале сцены: фигура сцены — её собственные x/z, остальные — startAt
function setSceneStart(s, id, x, z){
  const f = (s.figures||[]).find(f=>f.id===id);
  if (f){ f.x = x; f.z = z; return; }
  s.startAt = s.startAt || {};
  s.startAt[id] = {x, z};
}
function sceneMapHint(s){
  const fst = sceneEd.focus >= 0 ? (s.steps||[])[sceneEd.focus] : null;
  if (sceneEd.pick) return "Кликните по карте, чтобы указать место.";
  if (fst && fst.type==="move") return `Путь для «${actorName(s, fst.actor||"hero")}»: клик по карте — точка, точки можно тянуть, правый клик по точке — удалить. Клик по фигурке — выбрать, кто идёт.`;
  if (fst) return `Шаг ${sceneEd.focus+1}: на карте — где все стоят к его началу.`;
  return "Начало сцены. Тяните фигурки — так задаётся, кто где стоит в начале (в игре сцена сама их расставит). Выберите шаг слева — будет видно, где все к его началу.";
}
function sceneRedrawMap(s){
  const m = document.getElementById("scMap"); if (!m) return;
  m.innerHTML = sceneMapSvg(s, sceneEd.play ? sceneEd.play.t : null);
  const h = document.getElementById("scMapHint"); if (h) h.textContent = sceneMapHint(s);
}
// обработчики — на постоянном контейнере #scMap: перерисовка заменяет SVG,
// а перетаскивание точки/панорама должны пережить её
function bindMap(root, s){
  const box = root.querySelector("#scMap");
  if (!box || box.dataset.bound) return;
  box.dataset.bound = "1";
  const svgEl = box;
  const toW = (ev)=>{ const sv = box.querySelector("#scSvg"); const pt = sv.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY; const w = pt.matrixTransform(sv.getScreenCTM().inverse()); return [w.x, w.y]; };
  let drag = null;
  svgEl.addEventListener("contextmenu", ev=> ev.preventDefault());
  svgEl.addEventListener("wheel", ev=>{
    ev.preventDefault();
    const [wx, wz] = toW(ev);
    const v = sceneEd.view, f = ev.deltaY > 0 ? 1/1.2 : 1.2;
    const ns = clamp(v.scale * f, 2, 90);
    v.cx = wx - (wx - v.cx) * v.scale / ns; v.cz = wz - (wz - v.cz) * v.scale / ns; v.scale = ns;
    sceneRedrawMap(s);
  }, {passive:false});
  svgEl.addEventListener("pointerdown", ev=>{
    if (!ev.target.closest("#scSvg")) return;
    const [x, z] = toW(ev);
    const pt = ev.target.closest("[data-spt]");
    if (pt){
      const [i, kk] = pt.dataset.spt.split(":").map(Number);
      if (ev.button === 2){ s.steps[i].points.splice(kk, 1); commit(); sceneRedrawMap(s); refreshStepList(s); return; }
      drag = {kind:"pt", i, kk}; svgEl.setPointerCapture(ev.pointerId); return;
    }
    const act = ev.target.closest("[data-sact]");
    drag = {kind: act && !sceneEd.play ? "act" : "pan", sx: ev.clientX, sy: ev.clientY, moved: false, act: act ? act.dataset.sact : null, x, z};
    svgEl.setPointerCapture(ev.pointerId);
  });
  svgEl.addEventListener("pointermove", ev=>{
    if (!drag) return;
    if (drag.kind === "pt"){
      const [x, z] = toW(ev); const p = s.steps[drag.i].points[drag.kk];
      p.x = ev.altKey ? round2(x) : snap(x); p.z = ev.altKey ? round2(z) : snap(z);
      drag.moved = true; sceneRedrawMap(s); return;
    }
    const dx = ev.clientX - drag.sx, dy = ev.clientY - drag.sy;
    if (!drag.moved && Math.abs(dx) + Math.abs(dy) > 4){
      drag.moved = true;
      // тянем фигурку — это её место В НАЧАЛЕ сцены: показать начало
      if (drag.kind === "act" && sceneEd.focus !== -1){ sceneEd.focus = -1; document.querySelectorAll("#scSteps .node").forEach(n=>n.classList.remove("start")); }
    }
    if (drag.moved && drag.kind === "act"){
      const [x, z] = toW(ev);
      setSceneStart(s, drag.act, ev.altKey ? round2(x) : snap(x), ev.altKey ? round2(z) : snap(z));
      sceneRedrawMap(s); return;
    }
    if (drag.moved){
      const v = sceneEd.view; v.cx -= (ev.movementX||0) / v.scale; v.cz -= (ev.movementY||0) / v.scale;
      sceneRedrawMap(s);
    }
  });
  svgEl.addEventListener("pointerup", ev=>{
    const d = drag; drag = null;
    if (!d) return;
    if (d.kind === "pt"){ if (d.moved){ commit(); refreshStepList(s); } return; }
    if (d.kind === "act" && d.moved){ commit(); renderScene(); return; }
    if (d.moved || ev.button !== 0) return;
    const x = snap(d.x), z = snap(d.z);
    const p = sceneEd.pick;
    const fst = sceneEd.focus >= 0 ? s.steps[sceneEd.focus] : null;
    if (p){
      if (p.kind==="points"){ const st = s.steps[p.i]; st.points = st.points || []; st.points.push({x, z}); }
      else if (p.kind==="pos" || p.kind==="cam"){ const st = s.steps[p.i]; st.x = x; st.z = z; sceneEd.pick = null; }
      else if (p.kind==="fig"){ const f = s.figures[-1 - p.i]; if (f){ f.x = x; f.z = z; } sceneEd.pick = null; }
      else if (p.kind==="hero"){ setSceneStart(s, "hero", x, z); sceneEd.pick = null; }
      commit(); renderScene(); return;
    }
    if (fst && fst.type === "move"){
      if (d.act){ fst.actor = d.act; commit(); renderScene(); return; }
      fst.points = fst.points || []; fst.points.push({x, z}); commit(); sceneRedrawMap(s); refreshStepList(s); return;
    }
  });
}
// обновить только список точек у выбранного шага (без перерисовки всего окна)
function refreshStepList(s){
  const i = sceneEd.focus; if (i < 0) return;
  const node = document.getElementById("scstep-" + i);
  if (!node || (s.steps[i]||{}).type !== "move") return;
  const hint = node.querySelector("[data-ptlist]");
  if (!hint) return;
  hint.innerHTML = movePointsHtml(s.steps[i], i);
  hint.querySelectorAll("[data-spdel]").forEach(a=> a.onclick = (ev)=>{ ev.preventDefault(); const [ii, kk] = a.dataset.spdel.split(":").map(Number); s.steps[ii].points.splice(kk, 1); commit(); renderScene(); });
}
function movePointsHtml(st, i){
  return `Точки пути: ${(st.points||[]).map((p,k)=>`<span class="pill">${k+1}: ${round2(p.x)}, ${round2(p.z)} <a href="#" data-spdel="${i}:${k}" title="убрать">✕</a></span>`).join(" ") || "пока нет — кликайте по карте справа"}`;
}

// ---------- окно ----------
function sceneField(label, html){ return `<label class="field"><span>${label}</span>${html}</label>`; }
function sceneSel(i, field, value, opts){ return `<select data-ss="${i}:${field}">${opts.map(o=> o.group ? `<optgroup label="${esc(o.group)}">${o.items.map(([v,l])=>`<option value="${esc(v)}" ${String(v)===String(value)?"selected":""}>${esc(l)}</option>`).join("")}</optgroup>` : `<option value="${esc(o[0])}" ${String(o[0])===String(value)?"selected":""}>${esc(o[1])}</option>`).join("")}</select>`; }
function sceneNum(i, field, value, step=0.5){ return `<input type="number" data-sn="${i}:${field}" value="${value==null?"":value}" step="${step}">`; }
function sceneTxt(i, field, value, ph="", list=""){ return `<input type="text" data-sf="${i}:${field}" value="${esc(value==null?"":value)}" placeholder="${esc(ph)}" ${list?`list="${list}"`:""}>`; }
// условия шага «Если…» — поля прямо на шаге (как у ответа диалога)

    <div class="grid3">${sceneField(`Симпатия ${CompanionName} от`, sceneTxt(i, "relMin", c.relMin, "любая"))}${sceneField("до", sceneTxt(i, "relMax", c.relMax, "любая"))}${sceneField("Уровень героя от", sceneNum(i, "minLevel", c.minLevel||0, 1))}</div>`;

function sceneItemsHtml(st, i){

function sceneChk(i, field, value, label){ return `<label class="check"><input type="checkbox" data-sc="${i}:${field}" ${value?"checked":""}><span>${label}</span></label>`; }
function pickBtn(i, kind, label){ const on = sceneEd.pick && sceneEd.pick.i===i && sceneEd.pick.kind===kind; return `<button class="btn small ${on?"primary":""}" data-spick="${i}:${kind}">${on ? "Кликайте по мини-карте… (готово)" : label}</button>`; }

        <label class="field"><span>Приближение: ×${Number(st.zoom||1).toFixed(2)} (меньше — ближе)</span><input type="range" min="0.4" max="1.6" step="0.05" value="${st.zoom||1}" data-sn="${i}:zoom"></label>`;
